  }

    --tone-ink: var(--paper);
    --tone-alpha: .58;
  }
  
  .btn-danger {

    --tone-alpha: .52;
  }

    --tone-edge: rgb(var(--tone-rgb));

    --tone-edge-w: 1px;
    --tone-alpha: .58;

  .tab, .add-tab, .tabbar-tab, .topbar-tab {

  }
  .add-mode-tab {
    --tab-ink: var(--slate);

    --tab-rule-on: transparent;
  }

  
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {

      --tpl-ground: var(--tpl-frost-ground);
      --tpl-head-ground: transparent;
      
      --tpl-edge: transparent;
      -webkit-backdrop-filter: var(--tpl-frost);
      backdrop-filter: var(--tpl-frost);
      box-shadow: var(--tpl-rim);
      
      --tpl-head-scrim: linear-gradient(
        to bottom,
        rgba(0, 0, 0, .55) 0%,
        rgba(0, 0, 0, .34) 55%,
        rgba(0, 0, 0, 0) 100%);
    }

    

  }
  :root {
    
    --blood: #8E0000;
    --flash: #C21414;
    --ink: #0E0E10;
    --paper: #F2F3F6;
    --graphite: #2A2C31;
    --ash: #8A8D93;
    --dust: #D5D7DB;
    
    --amber: #D9A521;

    
    --blood-rgb: 142, 0, 0;
    --flash-rgb: 194, 20, 20;
    --graphite-rgb: 42, 44, 49;

    
    --coal: #15161A;
    --surface: #17181D;
    --coal-rgb: 21, 22, 26;
    --surface-rgb: 23, 24, 29;
    --coal2: #1B1C21;
    --border: #24262C;
    --steel: #3A3D44;
    --slate: #5F646E;

    
    --bg: var(--surface-key);
    --surface2: var(--graphite);

    
    
    
    --surface-key: #242424;  
    --surface-lit: #333333;  
    --surface-dim: #050505;  
    --key: var(--surface-key);
    --key-out:
      0 4px 6px -1px rgba(5,5,5,.43),
      inset 0 -2px 2px -1px rgba(5,5,5,.29),
      0 -3px 5px -1px rgba(51,51,51,.54),
      inset 0 2px 2px -1px rgba(51,51,51,.48),
      inset 0 0 4px .4px rgba(51,51,51,.52),
      inset 0 12px 13px 0 rgba(51,51,51,.16);
    
    
    --key-in:
      inset 0 0 0 1px var(--flash),
      0 4px 6px -1px rgba(5,5,5,.34),
      inset 0 -5px 13px 1px rgba(51,51,51,.84),
      0 -3px 5px -1px rgba(51,51,51,.54),
      inset 0 5px 11px 0 rgba(5,5,5,.62),
      inset 0 0 8px .4px rgba(51,51,51,.42);
    --field-sunk:
      inset 0 4px 9px 0 rgba(5,5,5,.62),
      inset 0 -3px 7px 0 rgba(51,51,51,.5),
      inset 0 0 0 1px rgba(5,5,5,.4);
    --relief-radius: 60px;
    
    --label-gap: 16px;
    --section-gap: 30px;
    --text: var(--paper);
    --text-muted: var(--ash);
    --like: var(--flash);
    --danger: var(--flash);
    --ok: var(--paper);
    
    --accent: var(--dust);
    --accent2: var(--blood);
    --accent3: var(--flash);

    
    --font-display: 'Archivo Black', Archivo, 'Helvetica Neue', Arial, sans-serif;

    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    
    
    --wordmark-app: 42px;
    --radius: 3px;
    
    --radius-key: 10px;
    
    --radius-card: 14px;
    --radius-poster: 9px;
    --radius-overlay: 16px;
    --control-h: 44px;

    
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  
  
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--flash);
    outline-offset: 2px;
    border-radius: inherit;
  }
  
  a, button, input, select, textarea, [role="button"], [tabindex] {
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
  }

  
  .lbl, .cf-label, .acc-label, .badge, .card-meta-row .year,
  .genre-section h2 .count, .trend-rank, .trend-year {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  }
  
  .lbl {
    font-size: var(--type-size); letter-spacing: var(--type-track);
    text-transform: uppercase; color: var(--type-ink);
    margin-bottom: var(--label-gap);
  }
  
  body.scroll-locked {
    position: fixed;
    left: 0; right: 0;
    overflow: hidden;
  }
  
  header {
    
    
    
    --bar-pad: max(24px, calc((100% - 1232px) / 2));
    padding: calc(8px + var(--safe-top)) 0 0;
    position: sticky; top: 0; z-index: 46;
    
    background-color: var(--tpl-ground);
  }
  
  
  .topbar-tabs {
    --topbar-gap: 0px;
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    padding: 0 var(--bar-pad);
    height: var(--tabbar-row);
  }
  .topbar-tab {
    
    position: relative;
    display: flex; align-items: center; justify-content: center;
    min-width: 0; padding: 0 4px;
    background: none; border: 0; cursor: pointer;
    font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em;
    text-transform: uppercase; white-space: nowrap;
    
    color: var(--tab-ink);
    -webkit-tap-highlight-color: transparent;
  }
  
  .topbar-tab.active { color: var(--flash); }
  @media (hover: hover) { .topbar-tab:hover { color: var(--paper); } }
  
  .topbar-tab + .topbar-tab::before {
    content: '•'; position: absolute; top: 50%;
    
    left: calc(var(--topbar-gap, 0px) / -2);
    transform: translate(-50%, -50%);
    
    color: var(--tab-ink); opacity: .55; font-size: 11px; line-height: 1;
  }

  
  header::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar-line);
    
    background: var(--blood);
  }
  
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--bar-pad) 10px;
  }
  .topbar::before { content: ''; flex: none; width: var(--control-h); }
  .topbar.searching::before { display: none; }
  header h1 { margin: 0; font-size: 24px; flex: 1; display: flex; align-items: center; justify-content: center; }
  .brand-badge svg { width: 100%; height: 100%; display: block; }
  .brand-badge { display: flex; align-items: center; justify-content: center; }
  
  .wordmark {
    font-family: var(--font-display);
    font-weight: 400;
    
    text-transform: uppercase;
    letter-spacing: -.035em;
    font-size: 1.3em;
    line-height: 1.1;
    color: var(--text);
  }
  
  .wordmark em { font-style: normal; color: var(--blood); }
  
  header h1 .wordmark { font-size: var(--wordmark-app); }

  
  .hicon {
    width: var(--control-h); height: var(--control-h); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; padding: 0; color: var(--dust);
    cursor: pointer; transition: color .15s; border-radius: var(--radius-key);
  }
  .hicon:active { color: var(--paper); }
  
  .topbar-icons { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  
  #addMovieBtn, #menuBtn, #filterBtn, #searchOpenBtn { display: none; }

  .topbar-search.open #searchOpenBtn { display: flex; }

  
  
  
  :root {
    --tabbar-base: 58px; --bar-line: 2px;
    --tabbar-h: calc(var(--tabbar-base) + var(--bar-line));
  }
  
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    
    background-color: var(--tpl-ground);
    
    border-top: var(--bar-line) solid var(--blood);
    padding-bottom: var(--safe-bottom);
  }

  .tabbar-scroll {
    
    position: relative;
    display: flex; align-items: stretch;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    scroll-snap-type: x proximity;
    max-width: 1280px; margin: 0 auto; padding: 0 6px;
  }
  .tabbar-scroll::-webkit-scrollbar { display: none; }
  
  .tabbar-tab {
    flex: 0 0 auto; min-width: 64px; height: var(--tabbar-base);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    
    background: none; border: none; padding: 0 10px 8px; cursor: pointer;
    color: var(--tab-ink);
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase;
    white-space: nowrap;
    scroll-snap-align: start;
    transition: color .15s, border-color .15s;
    -webkit-tap-highlight-color: transparent;
  }

  .to-top {

    width: 32px; height: 32px; flex: none; position: relative;

    transition: color .15s, transform .15s ease;
  }
  .dice::after { content: ''; position: absolute; inset: -6px; }

  @keyframes die-roll {
    0%   { transform: rotate(0) scale(1); }

    62%  { transform: rotate(16deg) scale(1.04); }
    100% { transform: rotate(0) scale(1); }

  .batch-list { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; margin-bottom: 12px; padding-bottom: 14vh; }
  .batch-row { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 3px; background: var(--surface2); border: 1px solid var(--border); }
  .batch-row img { width: 48px; height: 71px; object-fit: cover; border-radius: 2px; }
  .batch-info { flex: 1; min-width: 0; }
  .batch-miss { font-size: 12px; color: var(--ash); margin-top: 2px; }
  .batch-alt { width: 100%; box-sizing: border-box; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 2px; padding: 4px 6px; font-size: 12px; margin-top: 3px; }

  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
    }
  }

  
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    
    .nav-row { border-bottom: 0; }
    .sheet-row { border-top-color: transparent; }
  }

  
  .btn, .chip, .opt, .svc, .actor, .film-sound, .season-tgl,
  .btn-primary, .btn-ghost, .btn-danger {
    position: relative; z-index: 0;
    background: transparent; border: 0; box-shadow: none;
    color: var(--dust); border-radius: var(--relief-radius);
    cursor: pointer; text-decoration: none;
    text-shadow: 0 1px 0 var(--surface-lit), 0 -1px 1px var(--surface-dim);
    -webkit-tap-highlight-color: transparent;
    transition: color .15s;
  }
  .btn::before, .chip::before, .opt::before, .svc::before, .actor::before,
  .film-sound::before, .season-tgl::before,
  .btn-primary::before, .btn-ghost::before, .btn-danger::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    border-radius: inherit; background: var(--key);
    box-shadow: var(--key-out);
    transition: box-shadow .3s cubic-bezier(.23, 1, .32, 1), background .3s;
  }
  
  .btn:active::before, .chip:active::before, .opt:active::before, .svc:active::before,
  .actor:active::before, .film-sound:active::before, .season-tgl:active::before,
  .season-tgl.on-watched::before, .season-tgl.on-liked::before, .season-tgl.on-must::before,
  .btn-primary:active::before, .btn-ghost:active::before, .btn-danger:active::before,
  .chip.active::before, .opt.active::before, .svc--on::before,
  .btn.b-watched.on::before, .btn.b-liked.on::before, .btn.b-must.on::before,
  .btn.b-collect:active::before, .btn.b-collect[aria-expanded="true"]::before {
    box-shadow: var(--key-in);
  }
  
  .btn.b-collect, .btn-danger { color: var(--paper); text-shadow: none; }
  .btn.b-collect::before, .btn-danger::before { background: var(--blood); }
  .btn.b-collect[aria-expanded="true"]::before, .btn-danger:active::before { background: var(--flash); }

  
  [data-surface="bar"] .btn, [data-surface="bar"] .chip,
  [data-surface="bar"] .opt, [data-surface="bar"] .svc,
  [data-surface="bar"] .btn-primary, [data-surface="bar"] .btn-ghost,
  [data-surface="bar"] .btn-danger {
    background: var(--tone-ground); color: var(--tone-ink);
    border: var(--tone-edge-w) solid var(--tone-edge);
    border-radius: 2px; text-shadow: none;
  }
  [data-surface="bar"] .btn::before, [data-surface="bar"] .chip::before,
  [data-surface="bar"] .opt::before, [data-surface="bar"] .svc::before,
  [data-surface="bar"] .btn-primary::before, [data-surface="bar"] .btn-ghost::before,
  [data-surface="bar"] .btn-danger::before { display: none; }
</style>
