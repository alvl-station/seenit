    const hit = entry && s.match(entry.match);
    if (hit) {
      // Cutting the ceremony out of the middle leaves debris on both
      // sides — "Премія «Оскар» за X" becomes "Премія « » за X" — so the
      // remains are cleaned in order: quotes, then the generic
      // award/премія noun, then the connective, then punctuation.
      const rest = (s.slice(0, hit.index) + ' ' + s.slice(hit.index + hit[0].length))
        .replace(/[«»"„“”]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        // \b is ASCII-only in JS, so it never fires after a Cyrillic word —
        // the noun has to be anchored on whitespace instead.
        .replace(/^(?:awards?|prizes?|премія|нагорода|приз|кінопремія|кінонагорода)(?=\s|$)\s*/i, '')
        .replace(/^(?:for|за)\s+/i, '')
        .replace(/^[\s:–—-]+|[\s:,–—-]+$/g, '')
        .trim();
      return { name: info.name, category: rest || null };
    }
  }
  const m = s.match(/^(.+?)(?:\s+(?:for|за)\s+|\s*[:–—]\s+)(.+)$/i);
  return m ? { name: m[1].trim(), category: m[2].trim() } : { name: s, category: null };
}
// For a ceremony we don't recognize (not in AWARD_INFO), there's no curated
// short name to fall back on — used as the badge/popover-header text so a
// long compound label doesn't show its category detail on the badge
// itself (that's what the popover's category bullet list is for).
function shortAwardLabel(text) {
  return splitAwardLabel(text).name;
}

// Turns one ceremony group's raw award strings into the tap-popup's bullet
// list. Deliberately counts rather than de-duplicates: the badge already
// claims a total ("Oscar (2)"), so the bullets have to account for all of
// it. Silently collapsing two entries that share a category — or dropping
// the ones with no extractable category — left the popup showing fewer
// bullets than the badge counted (confirmed live: "Oscar (2)" listing a
// single category, and "Emmy (2)" listing nothing at all).
//
// So: one entry per distinct category in first-seen order, each carrying
// how many of the group's awards share it, plus — if any entry has no
// category at all — one trailing `category: null` entry counting those.
// That last case is normal, not a bug: OMDb's "Awards" field only ever
// gives a count, so parseOmdbAwardsSummary() (the fallback for a title
// Wikidata has no per-category data on) yields a bare ceremony name
// repeated N times. The popup says "N, categories unknown" instead of
// looking broken.
function awardCategoryBreakdown(texts) {
  const byCategory = new Map();
  let unknown = 0;
  for (const t of texts || []) {
    const { category } = splitAwardLabel(t);
    if (!category) { unknown++; continue; }
    byCategory.set(category, (byCategory.get(category) || 0) + 1);
  }
  const out = [...byCategory].map(([category, count]) => ({ category, count }));
  if (unknown) out.push({ category: null, count: unknown });
  return out;
}

// A movie can win/be nominated for the same ceremony more than once (2
// acting Oscars, say) — awards_won/awards_nominated hold one array entry
// per actual award (see scripts/backfill-critic-awards.js and the
// add-movie confirm form), so the UI shouldn't show one badge per entry;
// it should show one badge per ceremony with the real count folded in.
// Groups in first-seen order; unrecognized text groups by its own
// (trimmed, lowercased) full text (not the shortened label, so two
// different categories from the same unrecognized ceremony don't
// accidentally merge into one group), so distinct unknown awards don't
// merge either.
function groupAwards(list) {
  const order = [];
  const byKey = new Map();
  for (const raw of (list || [])) {
    const text = (raw || '').trim();
    if (!text) continue;
    const info = matchAward(text);
    const key = info ? info.key : text.toLowerCase();
    let group = byKey.get(key);
    if (!group) {
      // recognized: false means there's no curated English name for this
      // one — `name` is just a best-effort regex split of one movie's own
      // award text, not guaranteed clean or English (see splitAwardLabel).
      // The badge should show an icon only for these, never that name, so
      // a mis-split doesn't leak category text without a tap.
      group = {
        key,
        name: info ? info.name : shortAwardLabel(text),
        recognized: !!info,
        // Only for a curated ceremony — an unrecognized one has no
        // description, so a no-category group of those stays untappable.
        description: info ? info.description : null,
        texts: [],
      };
      byKey.set(key, group);
      order.push(group);
    }
    group.texts.push(text);
  }
  return order;
}
// How a badge/popover shows "this ceremony, more than once": the actual
// count in parentheses (e.g. "Оскар (4)") — nothing for exactly one.
function awardCountSuffix(count) {
  return count > 1 ? ` (${count})` : '';
}

// OMDb's "Awards" field is a free-text summary, e.g. "Won 2 Oscars. Another
// 44 wins & 203 nominations." — only ceremonies it names explicitly can be
// attributed, and only as a count (never which specific category), so a
// named ceremony's own name is pushed once per award it actually contributes
// (letting groupAwards() re-derive the real count) rather than once per
// mention. The generic "N wins & M nominations" tail has no identifiable
// source and is deliberately dropped rather than guessed at. Used by
// scripts/backfill-critic-awards.js; pure so it's unit-testable without a
// network call.
function parseOmdbAwardsSummary(text) {
  const s = (text || '').trim();
  const result = { won: [], nominated: [] };
  if (!s || s.toUpperCase() === 'N/A') return result;
  for (const entry of AWARD_INFO) {
    const wonRe = new RegExp(`won\\s+(\\d+)[^.]{0,40}?(?:${entry.match.source})`, 'i');
    const nomRe = new RegExp(`nominat\\w*\\s+(?:for\\s+)?(\\d+)[^.]{0,40}?(?:${entry.match.source})`, 'i');
    const wonMatch = s.match(wonRe);
    if (wonMatch) {
      const count = parseInt(wonMatch[1], 10) || 1;
      for (let i = 0; i < count; i++) result.won.push(entry.name);
      continue;
    }
    const nomMatch = s.match(nomRe);
    if (nomMatch) {
      const count = parseInt(nomMatch[1], 10) || 1;
      for (let i = 0; i < count; i++) result.nominated.push(entry.name);
    }
  }
  return result;
}

// Rotten Tomatoes' Tomatometer is already 0-100 and already literally "% of
// critics who approved" — the exact metric CONVENTIONS.md's critic-score
// badge asks for — so it's preferred whenever OMDb lists it; Metascore
// (also 0-100) is the fallback when a title has no RT rating on file.
// Shared by the add-movie flow (src/app.js, live OMDb fetch) and
// scripts/backfill-critic-awards.js (catalog backfill) so both apply the
// exact same rule.
function extractCriticScore(omdbData) {
  if (!omdbData) return undefined;
  const ratings = omdbData.Ratings || [];
  const rt = ratings.find(r => r.Source === 'Rotten Tomatoes');
  if (rt) {
    const pct = parseInt(rt.Value, 10);
    if (!Number.isNaN(pct)) return pct;
  }
  const meta = parseInt(omdbData.Metascore, 10);
  return Number.isNaN(meta) ? undefined : meta;
}

/* ---------- watched/liked marks vs. the catalog ----------
 * kino/watched and kino/liked are plain id->true maps with no foreign key
 * to kino/movies, so an id can outlive the movie it points at — a title
 * removed from the catalog leaves its marks behind forever.
 *
 * That is not hypothetical: the "Дивився (4)" chip counted four while the
 * list showed three, because one mark pointed at a film that no longer
 * existed. The chip counted the raw set; the list rendered only movies it
 * could find. Any count shown next to a list has to be computed over the
 * same thing the list renders, which is what these two do.
 */


/**
 * The confirm text for a delete. Deletion is irreversible and multi-select
 * makes it easy to have selected more than you meant to, so the names are
 * spelled out rather than only counted — but a long list is truncated so the
 * dialog cannot grow past the confirm button on a phone.
 */
function deleteConfirmMessage(movies, maxNamed = 5) {
  const list = (movies || []).filter(Boolean);
  if (!list.length) return '';
  const title = m => m.canonical_title_uk || m.canonical_title_en || m.id;
  // "Прибрати", not "Видалити", and named for the shelf rather than the
  // catalogue: there is one catalogue and this does not touch it. Saying
  // "видалити з каталогу" would promise something the app deliberately
  // cannot do — no one person gets to empty the shelf everybody reads.
  if (list.length === 1) return `Прибрати «${title(list[0])}» з моїх фільмів?`;
  const named = list.slice(0, maxNamed).map(m => `«${title(m)}»`).join(', ');
  const rest = list.length - maxNamed;
  return rest > 0
    ? `Прибрати з моїх фільмів ${list.length} ${pluralFilms(list.length)}: ${named} і ще ${rest}?`
    : `Прибрати з моїх фільмів ${list.length} ${pluralFilms(list.length)}: ${named}?`;
}

/** Ukrainian needs three forms: 2 фільми, 5 фільмів, 21 фільм. */
function pluralFilms(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'фільм';
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'фільми';
  return 'фільмів';
}

/** Ids in `marks` that no longer have a movie — the ones safe to sweep. */
function orphanedMarkIds(marks, movies) {
  const known = new Set((movies || []).map(markKey).filter(Boolean));
  return [...(marks || [])].filter(id => !known.has(String(id)));
}

/** How many marks actually correspond to a movie in the catalog. */
function countExistingMarks(marks, movies) {
  const total = marks && typeof marks.size === 'number' ? marks.size : [...(marks || [])].length;
  return total - orphanedMarkIds(marks, movies).length;
}

/* ---------- OMDb: surviving a one-year disagreement ----------
 * OMDb's `y` parameter is an exact filter, not a hint, and OMDb and TMDb
 * routinely disagree about a film's year by one: TMDb records the earliest
 * release (a festival premiere), OMDb the wide release. Casablanca is TMDb
 * 1942 and OMDb 1943, so `t=Casablanca&y=1942` answers "Movie not found!"
 * and the film silently ends up with no critic score and no awards at all.
 * Anything premiering late in a year and released in the next one hits this.
 *
 * So the year is used as a preference, not a filter: ask with it, and if
 * OMDb finds nothing, ask again without it — then check the year that comes
 * back is close enough to be the same film rather than a remake.
 */

/**
 * Whether a payload is actually an OMDb answer at all.
 *
 * Every OMDb reply — hit or miss — carries a `Response` field. Anything
 * without one came from somewhere else: a proxy error page, a rate-limit
 * body, an HTML gateway response. The old code asked only whether Response
 * was 'False', so a body with no Response at all fell through as a SUCCESS
 * with no data, and the film was recorded as "OMDb has nothing" and stamped
 * as checked for a month.
 */
function isOmdbAnswer(data) {
  return !!data && typeof data === 'object' && typeof data.Response === 'string';
}

/**
 * Whether an OMDb result is really the title we asked for.
 *
 * OMDb's `t=` is a fuzzy search, not an exact lookup, and it will answer with
 * something that merely CONTAINS the words. Asked for "I Care a Lot" (2021)
 * it returned "FailurePiece Theater ep 36: I Care a Lot." — a podcast
 * episode that happens to share the catalog's year, because the real film is
 * 2020 in OMDb. Without this check the enrichment attaches one work's
 * ratings and awards to a different work entirely, which is worse than
 * leaving the film empty: wrong data looks exactly like right data.
 *
 * The rule: the titles match outright, or one is the other's part before a
 * SEPARATOR. Catalogs disagree about subtitles — TMDb's "Dune" is OMDb's
 * "Dune: Part One" — but they do not disagree by appending plain words, so
 * "The Bodyguard Diaries" is not "Bodyguard". A bare prefix rule accepts
 * both; keying on the separator accepts only the first.
 *
 * Deliberately strict. A false negative leaves a film unenriched, which is
 * visible and harmless. A false positive writes another work's ratings and
 * awards onto it, which looks exactly like correct data.
 */
function omdbTitleMatches(returned, requested) {
  const a = normalizeTitleForMatch(returned);
  const b = normalizeTitleForMatch(requested);
  if (!a || !b) return false;
  if (a === b) return true;
  return normalizeTitleForMatch(titleHead(returned)) === b
    || normalizeTitleForMatch(titleHead(requested)) === a;
}

/** The part of a title before its first subtitle separator. */
function titleHead(text) {
  return String(text == null ? '' : text).split(/[:\u2013\u2014(]|\s-\s/)[0];
}

function normalizeTitleForMatch(text) {
  return String(text == null ? '' : text)
    .toLowerCase()
    // Leading articles differ between catalogs often enough that they must
    // not decide a match ("Shining" vs "The Shining").
    .replace(/^(the|a|an)\s+/, '')
    // Apostrophes sit INSIDE a word, so they must vanish rather than become
    // a space: "Miranda's Victim" and "Mirandas Victim" are one title.
    .replace(/['\u2019\u02bc\u0060]/g, '')
    .replace(/[^\p{L}\p{N}]+/gu, ' ')
    .trim();
}

/**
 * Is this OMDb answer a QUOTA refusal rather than a fact about the film?
 *
 * OMDb reports "Request limit reached!" with HTTP 200 and Response:False —
 * the same shape as a genuine "Movie not found!". Conflating them is
 * expensive in both directions: a quota day looks like a catalog of
 * missing films, and worse, adding a film would report an error and lose
 * the person's work over a rate limit that has nothing to do with them.
 *
 * A limited answer means "ask again tomorrow", never "this film has no
 * critic score" — so it must not be recorded, stamped, or surfaced.
 */
function isOmdbQuotaExhausted(data) {
  const err = data && typeof data === 'object' ? String(data.Error || '') : '';
  return /limit reached|request limit/i.test(err);
}

/** The first four-digit year in an OMDb `Year` ("1943", "2019–2023"). */
function parseOmdbYear(value) {
  const m = /(\d{4})/.exec(String(value == null ? '' : value));
  return m ? Number(m[1]) : null;
}

/**
 * Whether a year-less OMDb result is plausibly the film we asked about.
 *
 * The tolerance is what makes the retry safe: without it, dropping the year
 * would happily return the 1998 remake of a 1960 film. One year covers the
 * premiere/release split; anything further apart is a different film.
 */
function omdbYearAcceptable(returnedYear, expectedYear, tolerance = 1) {
  const expected = parseOmdbYear(expectedYear);
  if (expected === null) return true;   // nothing to contradict
  const got = parseOmdbYear(returnedYear);
  if (got === null) return false;       // a result with no year is unverifiable
  return Math.abs(got - expected) <= tolerance;
}

/* ---------- Wikidata: per-category award detail ----------
 * OMDb's "Awards" field is counts only ("Won 4 Oscars") — never which
 * categories. Wikidata records that detail as structured statements, so
 * once we know a title's IMDb id (OMDb's own response already includes
 * one, no extra lookup needed — see fetchWikidataAwardCategories() in
 * app.js/scripts/backfill-critic-awards.js), a single SPARQL query gets
 * the actual category names.
 *
 * The badge/popover NAME always comes from AWARD_INFO's own curated
 * English name for a *recognized* ceremony (see groupAwards()) — but for
 * an unrecognized one there's no curated override, so the name shown is
 * whatever text this query produced. Asking Wikidata's label service for
 * a single "uk,en" label per award — the original approach — gives back
 * ONE language for the *entire* compound label, decided per award item by
 * whichever language happens to have a translation on Wikidata, not by any
 * rule of ours. That's exactly what produced inconsistent-looking results
 * on the same movie: "премія «Сезар» за найкращий фільм іноземною мовою"
 * (a Ukrainian label existed) right next to "London Film Critics Circle
 * Award for British Actress of the Year" (no Ukrainian label existed, so
 * the whole thing — name AND category — fell back to English).
 *
 * Fix: fetch BOTH an English and a Ukrainian label per award (every
 * ceremony has an English label; only some have a Ukrainian one), split
 * each independently (splitAwardLabel()), and always take the NAME half
 * from English and the CATEGORY half from Ukrainian-if-present — see
 * combineWikidataAwardLabel(). So the name is consistently English even
 * for an unrecognized ceremony, and the category reads in Ukrainian
 * whenever Wikidata has that translation, falling back to English only
 * when it genuinely doesn't exist for that specific award item.
 *
 * Two shapes to check: an award recorded directly on the film's own item
 * (P166 "award received" / P1411 "nominated for" — typical for Best
 * Picture-type categories), and one recorded on a cast/crew member's item
 * qualified "for work" (P642) = this film (typical for acting/directing/
 * writing categories, which Wikidata attributes to the person, not the
 * film). Both pure/no-network so they're unit-testable; the actual fetch
 * is duplicated client-side and in the Node backfill script, same as
 * fetchOmdbData()/fetchOmdb() already are — logic.js can't touch the
 * network.
 */
function buildWikidataAwardsQuery(imdbId) {
  return `SELECT ?type ?awardLabelEn ?awardLabelUk WHERE {
  VALUES ?imdbId { "${imdbId}" }
  {
    { ?film wdt:P345 ?imdbId ; wdt:P166 ?award . BIND("won" AS ?type) }
    UNION
    { ?film wdt:P345 ?imdbId ; wdt:P1411 ?award . BIND("nom" AS ?type) }
    UNION
    { ?film wdt:P345 ?imdbId . ?person p:P166 ?st . ?st pq:P642 ?film ; ps:P166 ?award . BIND("won" AS ?type) }
    UNION
    { ?film wdt:P345 ?imdbId . ?person p:P1411 ?st2 . ?st2 pq:P642 ?film ; ps:P1411 ?award . BIND("nom" AS ?type) }
  }
  OPTIONAL { ?award rdfs:label ?awardLabelEn . FILTER(lang(?awardLabelEn) = "en") }
  OPTIONAL { ?award rdfs:label ?awardLabelUk . FILTER(lang(?awardLabelUk) = "uk") }
} LIMIT 200`;
}
// Combines the two per-award label variants buildWikidataAwardsQuery() asks
// for into one compound string in this app's usual "Name за Category"
// shape — name from the English label (falls back to Ukrainian's own name
// half on the rare award with no English label at all), category from the
// Ukrainian label when one exists, else English's own category. Returns
// null only if neither label was present at all.
/**
 * Wikidata's label service returns the ENTITY ID when an item carries no
 * label in any requested language — so an award with neither an English
 * nor a Ukrainian name arrives as the literal string "Q118956281", and it
 * was stored and shown as though that were the ceremony. It is an
 * identifier, not a name, and there is nothing in it for a person to read.
 */
function isWikidataEntityId(text) {
  return /^Q\d+$/i.test(String(text || '').trim());
}

function combineWikidataAwardLabel(labelEn, labelUk) {
  const en = labelEn ? splitAwardLabel(labelEn) : null;
  const uk = labelUk ? splitAwardLabel(labelUk) : null;
  const name = (en && en.name) || (uk && uk.name) || '';
  // A bare entity id is not a name — see isWikidataEntityId.
  if (!name || isWikidataEntityId(name)) return null;
  const category = (uk && uk.category) || (en && en.category) || null;
  return category ? `${name} за ${category}` : name;
}
function parseWikidataAwards(bindings) {
  const result = { won: [], nominated: [] };
  for (const b of (bindings || [])) {
    const type = b && b.type && b.type.value;
    if (!type) continue;
    const label = combineWikidataAwardLabel(
      b.awardLabelEn && b.awardLabelEn.value,
      b.awardLabelUk && b.awardLabelUk.value
    );
    if (!label) continue;
    if (type === 'won') result.won.push(label);
    else if (type === 'nom') result.nominated.push(label);
  }
  return result;
}

/* ---------- database backup guards ----------
 * scripts/backup-db.js runs as a gate before every migration, so its
 * failure modes matter more than its happy path. The dangerous one is a
 * backup that LOOKS fine but is empty: an empty read is far more likely to
 * be a permissions or URL problem than a genuinely empty database, and
 * restoring such a file would wipe everything. Kept here (pure) so the
 * refusal rules are unit-testable without touching Firebase.
 */
function backupCounts(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) return null;
  return Object.fromEntries(
    Object.entries(data).map(([k, v]) => [k, v && typeof v === 'object' ? Object.keys(v).length : 1]),
  );
}
/** @returns {string|null} why the snapshot must NOT be written, or null if it's fine. */
function backupRejectionReason(data) {
  const counts = backupCounts(data);
  // Two distinct failures, and the message must say WHICH — they send you
  // to different places. Nothing at all (unreadable, or an empty subtree)
  // points at credentials, the database URL or the ref path. Data that
  // exists but has no movies points at the data itself.
  if (!counts || Object.keys(counts).length === 0) return 'Read kino/ but got nothing back.';
  // Movies live per-account now (kino/users/{uid}/movies); the legacy
  // shared node may or may not still exist. A backup is acceptable if
  // EITHER holds films — and worthless if neither does.
  const perUserMovies = Object.values((data && data.users) || {})
    .some(u => u && u.movies && Object.keys(u.movies).length);
  if (!counts.movies && !perUserMovies) return 'Backup contains no movies (neither kino/movies nor any kino/users/*/movies).';
  return null;
}

/* ---------- enrichment re-check window ----------
 * A title OMDb has nothing for never gets critic_score or awards_* written,
 * so a naive "is it still empty?" check re-queried it on every single
 * deploy — dozens of guaranteed-useless calls per run against a 1,000/day
 * quota. scripts/backfill-critic-awards.js therefore stamps
 * `enrichment_checked_at` whenever it actually asks OMDb, whatever the
 * answer, and skips anything asked recently. The window is not zero because
 * OMDb does gain titles over time — just not daily.
 */
const ENRICHMENT_RECHECK_DAYS = 30;
function enrichmentCheckedRecently(movie, now = Date.now(), days = ENRICHMENT_RECHECK_DAYS) {
  const stamp = movie && movie.enrichment_checked_at;
  if (!stamp) return false;
  const then = Date.parse(stamp);
  if (!Number.isFinite(then)) return false;   // unparseable: treat as never asked
  return (now - then) < days * 24 * 60 * 60 * 1000;
}

/* ---------- why a title ended up with nothing ----------
 * The database used to record only WHEN we last asked about a film, never
 * what the answer was. Those are not the same thing, and the difference cost
 * real time: a film with no critic score looked identical whether OMDb had
 * never heard of it, had it but carried no score, answered with a different
 * work entirely, or the request had failed and been misread as "no data".
 * All four also produced the same summary line, so a broken run and a
 * healthy one were indistinguishable from the outside.
 *
 * Recording the reason makes the database answer that question itself.
 */
const ENRICHMENT_RESULTS = {
  OK: 'ok',                          // something was written
  NO_DATA: 'no-data',                // OMDb has the title, but no score and no awards
  NOT_FOUND: 'not-found',            // OMDb does not have it
  TITLE_MISMATCH: 'title-mismatch',  // OMDb offered a different work
  YEAR_MISMATCH: 'year-mismatch',    // found, but too far from our year to be the same film
  // Not an answer from OMDb but still the true reason the field is empty:
  // the film is old enough that we deliberately stopped asking. Recorded
  // without spending a call, so "why is this blank?" stays answerable for
  // the whole catalog and not only for what we still query.
  SKIPPED_OLD: 'skipped-too-old',
};

/** The failure kinds — the ones whose share should not suddenly jump. */
const ENRICHMENT_FAILURES = [
  ENRICHMENT_RESULTS.NOT_FOUND,
  ENRICHMENT_RESULTS.TITLE_MISMATCH,
  ENRICHMENT_RESULTS.YEAR_MISMATCH,
];

/**
 * Whether a title is old enough that re-asking is pointless.
 *
 * Award ceremonies happen the year AFTER release (a 2025 film wins its Oscar
 * in March 2026), and OMDb keeps adding recent titles — so a young film is
 * worth re-asking about. An old one is not: nothing about it is going to
 * change, and every call spends a 1,000/day quota.
 *
 * Applies to the ROUTINE recheck only. A deliberate one-off pass — fixing
 * data a bug got wrong — must still be able to reach old films, or it cannot
 * fix the very records it exists for.
 */
function enrichmentTooOldToRecheck(movie, now = Date.now(), years = ENRICHMENT_MAX_AGE_YEARS) {
  const year = Number(movie && movie.year);
  if (!Number.isFinite(year) || year <= 0) return false;   // unknown age: do not skip
  return (new Date(now).getUTCFullYear() - year) > years;
}
const ENRICHMENT_MAX_AGE_YEARS = 2;

/**
 * Whether a run's outcome looks wrong enough to stop and shout about.
 *
 * The failure this exists for: if the OMDb key expired, every request would
 * fail, every film would be recorded as checked, and the report would read
 * "110 films, nothing new" — a perfectly calm sentence describing a total
 * outage, followed by a month of silence because each film was stamped.
 *
 * @param {object} current  counts keyed by ENRICHMENT_RESULTS value, plus `failed`
 * @param {object|null} previous  the last run's counts, or null on a first run
 * @returns {string|null} what looks wrong, or null if the run looks normal
 */
function enrichmentRunAlarm(current, previous = null, opts = {}) {
  const { minSample = 10, failedShare = 0.2, minFailed = 5, jump = 0.2 } = opts;
  const c = current || {};
  const processed = enrichmentProcessedCount(c);
  if (processed < minSample) return null;   // too few to reason about

  const failed = c.failed || 0;
  if (failed >= minFailed && failed > processed * failedShare) {
    return `${failed} of ${processed} requests failed outright — the proxy or the API key is likely broken.`;
  }

  const resolved = (c[ENRICHMENT_RESULTS.OK] || 0) + (c[ENRICHMENT_RESULTS.NO_DATA] || 0);
  if (resolved === 0) {
    return `None of ${processed} titles resolved to a real OMDb record. A healthy run always resolves most of them.`;
  }

  if (previous && enrichmentProcessedCount(previous) >= minSample) {
    const before = enrichmentFailureRate(previous);
    const after = enrichmentFailureRate(c);
    if (after - before > jump) {
      return `Titles that failed to match jumped from ${Math.round(before * 100)}% to ${Math.round(after * 100)}% since the last run.`;
    }
  }
  return null;
}

function enrichmentProcessedCount(counts) {
  const c = counts || {};
  // SKIPPED_OLD is excluded deliberately: those films were never asked
  // about, so counting them would dilute the failure rate the alarm reads
  // and could hide a real outage behind a pile of skips.
  return Object.values(ENRICHMENT_RESULTS)
    .filter(k => k !== ENRICHMENT_RESULTS.SKIPPED_OLD)
    .reduce((n, k) => n + (c[k] || 0), 0) + (c.failed || 0);
}

function enrichmentFailureRate(counts) {
  const processed = enrichmentProcessedCount(counts);
  if (!processed) return 0;
  const c = counts || {};
  return ENRICHMENT_FAILURES.reduce((n, k) => n + (c[k] || 0), 0) / processed;
}

/* ---------- reconciling the two award sources ----------
 * The two sources fail in opposite directions, so neither alone is right:
 *
 * - OMDb gives a reliable COUNT per named ceremony ("Won 7 Oscars") but
 *   never which categories.
 * - Wikidata gives real CATEGORIES but is incompletely entered, especially
 *   for recent titles. Measured against this catalog: only ~22% of titles
 *   have any award statements at all, and even when present the counts can
 *   undershoot badly — Oppenheimer returns 4 Oscars where it actually won
 *   7 (Titanic and LOTR, both older and thoroughly curated, return the
 *   correct 11).
 *
 * Taking Wikidata whole whenever it returned anything — the original
 * either/or rule — therefore threw away OMDb's more accurate total for
 * exactly the titles Wikidata half-covers, showing "Oscar (4)" for a
 * 7-Oscar film. This merges instead: every Wikidata entry is kept for its
 * category detail, and where OMDb counts MORE awards for a ceremony than
 * Wikidata detailed, the difference is padded with bare ceremony names.
 * Those padded entries carry no category, so awardCategoryBreakdown()
 * already renders them as the "category unknown (N)" line — the badge ends
 * up with the honest total and as much real detail as Wikidata could give.
 *
 * Ceremonies OMDb doesn't name (its generic "another 44 wins" tail, which
 * parseOmdbAwardsSummary deliberately drops) contribute nothing, and an
 * unrecognized Wikidata ceremony can never collide with an OMDb entry
 * since OMDb only ever names AWARD_INFO ceremonies.
 */
function mergeAwardLists(wikidataList, omdbList) {
  const merged = [...(wikidataList || [])];
  const countByKey = list => {
    const m = new Map();
    for (const raw of (list || [])) {
      const text = (raw || '').trim();
      if (!text) continue;
      const info = matchAward(text);
      if (!info) continue; // unrecognized: can't be reconciled against OMDb
      m.set(info.key, (m.get(info.key) || 0) + 1);
    }
    return m;
  };
  const wikiCounts = countByKey(wikidataList);
  const omdbCounts = countByKey(omdbList);
  for (const [key, omdbCount] of omdbCounts) {
    const shortfall = omdbCount - (wikiCounts.get(key) || 0);
    if (shortfall <= 0) continue;
    const info = AWARD_INFO.find(a => a.key === key);
    for (let i = 0; i < shortfall; i++) merged.push(info.name);
  }
  return merged;
}
function mergeAwardSources(wikidata, omdb) {
  return {
    won: majorAwardsOnly(mergeAwardLists(wikidata && wikidata.won, omdb && omdb.won)),
    nominated: majorAwardsOnly(mergeAwardLists(wikidata && wikidata.nominated, omdb && omdb.nominated)),
  };
}

/**
 * Tops up an ALREADY-STORED award list from OMDb's counts. Add-only.
 *
 * Why this is separate from mergeAwardSources(): that one builds a fresh
 * list and filters it down to recognized ceremonies. Here the list already
 * exists in the database and may contain hand-typed entries, so nothing may
 * be dropped, reordered or rewritten — a top-up that can remove is not a
 * top-up, it is an overwrite with extra steps.
 *
 * The problem it fixes: awards are written once, at add-time, and the rule
 * "only enrich a film whose awards are empty" then freezes whatever was
 * captured. Where Wikidata knew about one of a film's eight Emmys, that one
 * is what the catalog shows forever. Beef is stored with a single Emmy;
 * OMDb reports eight.
 */
function topUpAwardCounts(stored, fromOmdb) {
  const existing = [...(stored || [])];
  const topped = mergeAwardLists(existing, fromOmdb);
  // mergeAwardLists only ever appends, but this is data nobody can get back
  // if it is wrong, so the guarantee is checked rather than assumed.
  if (topped.length < existing.length) return existing;
  for (let i = 0; i < existing.length; i++) {
    if (topped[i] !== existing[i]) return existing;
  }
  return topped;
}

/* ---------- how awards are STORED ----------
 * Flat arrays repeated the ceremony name in every single entry:
 *
 *   awards_won: [
 *     "Премія «Оскар» за найкращий оригінальний сценарій",
 *     "премія «Оскар» за найкращу чоловічу роль другого плану",
 *   ]
 *
 * which meant the same ceremony name was stored, split apart at render
 * time by a regex, and — worst of all — sent through the translator again
 * on every re-enrichment, because the name and the category travelled as
 * one inseparable string. It also produced the casing drift visible above.
 *
 * Grouped by ceremony, the name is stored ONCE as a stable key and each
 * entry is only the category:
 *
 *   awards_won: {
 *     oscar: ["за найкращий оригінальний сценарій", "за найкращу чоловічу роль другого плану"],
 *     "National Board of Review": ["за найкращий акторський склад"],
 *   }
 *
 * The key is AWARD_INFO's key for a ceremony we curate (so the English
 * display name comes from there and never from stored text), or the
 * ceremony's own name for one we do not. An entry is "" when the award is
 * known to have happened but its category is not — that is the
 * count-only shape OMDb gives, and the array length stays the true count.
 */

/**
 * The stable key a ceremony is stored under.
 *
 * For a curated ceremony it is AWARD_INFO's key, so the English display
 * name always comes from there and never from stored text. For one we do
 * not curate, the ceremony's own name — normalised, because the same body
 * arrives spelled differently in different awards: "National Board of
 * Review Award for Best Cast" and "National Board of Review: Top Ten
 * Films" are one ceremony and must not become two keys.
 *
 * Firebase keys also cannot contain . # $ / [ ].
 */
function awardCeremonyKey(text) {
  const info = matchAward(text);
  if (info) return info.key;
  return shortAwardLabel(text).replace(/[.#$/\[\]]/g, ' ').replace(/\s+/g, ' ').trim() || 'other';
}

/**
 * The form two spellings of one ceremony have in common.
 *
 * "National Board of Review Award for Best Cast" and "National Board of
 * Review: Top Ten Films" are the same body: the trailing "Award(s)" is a
 * suffix present in some of its own entries and absent in others. Matching
 * on this collapses them; the KEY itself keeps the fuller spelling, since
 * that is the ceremony's actual name and what a person reads on the badge.
 */
function ceremonyMatchForm(key) {
  return String(key || '').toLowerCase()
    .replace(/\s+(awards?|prize|премі[яї])\s*$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

/** Flat array -> { ceremonyKey: [category, ...] } */
function groupAwardsByCeremony(list) {
  const out = {};
  const byMatch = new Map();          // common form -> the key actually used
  for (const raw of (list || [])) {
    const text = (raw || '').trim();
    if (!text) continue;
    const key = awardCeremonyKey(text);
    const match = ceremonyMatchForm(key);
    const existing = byMatch.get(match);
    if (existing === undefined) {
      byMatch.set(match, key);
    } else if (key.length > existing.length) {
      // A fuller spelling turned up later ("… Award" after a bare name):
      // adopt it as THE name and move what was already collected.
      out[key] = out[existing];
      delete out[existing];
      byMatch.set(match, key);
    }
    const target = byMatch.get(match);
    const { category } = splitAwardLabel(text);
    (out[target] = out[target] || []).push(category || '');
  }
  return out;
}

/**
 * Translates the CATEGORY values of a grouped award map into Ukrainian.
 *
 * Values are what a person reads, so they must be Ukrainian (the ceremony
 * NAME stays English — see CONVENTIONS). This is the whole payoff of the
 * grouped shape: the name is a key and never reaches the translator, so
 * only the half that needs translating is sent, once.
 */
async function localizeCeremonyAwards(grouped, translate) {
  const out = {};
  for (const [key, cats] of Object.entries(grouped || {})) {
    out[key] = [];
    for (const cat of (cats || [])) {
      out[key].push(cat ? await ensureUkrainian(cat, translate) : '');
    }
  }
  return out;
}

/** { ceremonyKey: [category] } -> flat array, for code that still wants it. */
function flattenCeremonyAwards(grouped) {
  const out = [];
  for (const [key, cats] of Object.entries(grouped || {})) {
    const info = AWARD_INFO.find(a => a.key === key);
    const name = info ? info.name : key;
    for (const cat of (cats || [])) out.push(cat ? `${name} за ${cat}` : name);
  }
  return out;
}

/**
 * Reads either shape. Everything downstream — badges, popovers, counts —
 * goes through this, so a record written before the change and one written
 * after render identically and no migration has to run before a deploy.
 */
function readAwards(value) {
  if (Array.isArray(value)) return value;
  if (value && typeof value === 'object') return flattenCeremonyAwards(value);
  return [];
}

/* ---------- language rules for award text ----------
 * Two invariants, enforced as RULES rather than curated lookups so they
 * keep holding for ceremonies and categories we haven't seen yet:
 *
 *   1. The ceremony NAME always reads in English. Guaranteed structurally,
 *      not by translation: majorAwardsOnly() keeps only ceremonies that
 *      AWARD_INFO recognizes, and the displayed name always comes from
 *      AWARD_INFO's curated English value (see groupAwards()), whatever
 *      language the stored text happens to be in.
 *   2. The CATEGORY always reads in Ukrainian. Wikidata supplies one when
 *      it has a uk label; when it doesn't, the English category it did
 *      return is sent through the translator — see localizeAwardCategories().
 *
 * Dropping everything AWARD_INFO doesn't recognize also implements the
 * "well-known ceremonies only, no local festivals" rule, and removes the
 * whole class of badges whose name came from an uncurated Wikidata label
 * (which is what leaked a Ukrainian ceremony name onto a badge before).
 */
function majorAwardsOnly(list) {
  return (list || []).filter(text => !!matchAward(text));
}
// The three pieces of the translation rule are deliberately separate:
//
//   needsUkTranslation(text)          - the CHECK: is the language wrong?
//   translate(text)                   - the TRANSLATOR: injected, does the
//                                       actual en->uk call (network, so it
//                                       lives in app.js / the backfill
//                                       script, never here)
//   ensureUkrainian(text, translate)  - the RULE: runs the check, and only
//                                       calls the translator when it fails
//
// so the rule applies to anything, not just the strings we happen to know
// about today, and either half can be swapped or tested on its own.
function hasCyrillic(s) {
  return /[а-яіїєґ]/i.test(s || '');
}
function needsUkTranslation(text) {
  const s = (text || '').trim();
  return !!s && !hasCyrillic(s);
}
// Returns `text` unchanged when it's already Ukrainian; otherwise the
// translator's output, falling back to the original if translation fails
// (losing the text entirely would be worse than showing it in English).
async function ensureUkrainian(text, translate) {
  if (!needsUkTranslation(text)) return text;
  let uk = '';
  try { uk = await translate(text); } catch (err) { uk = ''; }
  return uk || text;
}
// True when this award string's category half exists but isn't Ukrainian.
function awardCategoryNeedsTranslation(text) {
  return needsUkTranslation(splitAwardLabel(text).category);
}
// Applies the rule to every award's category half, leaving the name half
// alone (rule 1 keeps that English via AWARD_INFO).
async function localizeAwardCategories(list, translate) {
  const out = [];
  for (const raw of (list || [])) {
    const text = (raw || '').trim();
    if (!text) continue;
    const { name, category } = splitAwardLabel(text);
    if (!category) { out.push(text); continue; }
    const uk = await ensureUkrainian(category, translate);
    out.push(uk === category ? text : `${name} за ${uk}`);
  }
  return out;
}

/* ---------- search matching ---------- */
// Small edit-distance helper so search tolerates typos / near-misses in
// spelling (e.g. "інтерстелар" vs "інтерстеллар").
function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = a[i - 1] === b[j - 1]
        ? prev[j - 1]
        : 1 + Math.min(prev[j - 1], prev[j], cur[j - 1]);
    }
    prev = cur;
  }
  return prev[b.length];
}
// Soft match: query is split into words, each of which must roughly match
// (prefix/substring OR small edit distance, tolerance scaling with word
// length) some word in the haystack — order-independent, so "інтерстелар
// нолан" matches even if the words appear in a different order or slightly
// misspelled.
//
// Only checks hw.includes(qw) — a catalog word containing what was typed
// (so "дюн" matches "Дюна") — never the reverse. qw.includes(hw) used to
// also count, so any long/unrelated query happening to contain a short
// catalog word anywhere inside it (a "99" in a title, a two-letter cast
// initial, the word "фільм") counted as a hit — reported independently
// both by hand-testing and by two separate E2E smoke-test false
// positives (see tests/e2e/smoke.spec.js's git history). That direction
// never matched real search intent, so it's gone, and the edit-distance
// tolerance is tighter now too.
function matches(m, q) {
  if (!q) return true;
  const query = q.toLowerCase().trim();
  if (!query) return true;
  const hay = [
    m.canonical_title_uk || '', m.canonical_title_en || '',
    // Country is display-only everywhere else, but people look for "Корея"
    // or "Japan" the same way they look for an actor, and the field is
    // already on every movie — so searching it costs nothing.
    m.country || '',
    ...(m.cast || [])
  ].join(' ').toLowerCase();
  if (hay.includes(query)) return true;

  const qWords = query.split(/\s+/).filter(Boolean);
  const hayWords = hay.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  return qWords.every(qw => {
    if (hayWords.some(hw => hw.includes(qw))) return true;
    if (qw.length < 3) return false; // too short to fuzzy-match reliably
    const maxDist = qw.length <= 4 ? 1 : (qw.length <= 8 ? 1 : 2);
    return hayWords.some(hw => Math.abs(hw.length - qw.length) <= maxDist && levenshtein(qw, hw) <= maxDist);
  });
}

/* ---------- catalog filtering (search box + tabs + toggles) ----------
 * Pure predicate over the full catalog, given the current UI state and the
 * watched/liked id sets (anything with `.has(id)` — a Set works). Kept
 * separate from sorting/grouping so tab/toggle interactions (see
 * CONVENTIONS.md) can be unit-tested without touching the DOM.
 */
function filterCatalog(movies, { query, tab, showWatched, genre, recommender, likedIds, watchedIds }) {
  // Marks are keyed by the film's TMDb id, not by its slug — see markKey().
  const has = isMarked;
  const q = (query || '').toLowerCase();
  return (movies || []).filter(m => {
    if (!matches(m, q)) return false;
    if (tab === 'liked') {
      // "Рекомендую" is its own independent list — always the full set of
      // recommended titles, regardless of the "Дивився" filter below.
      if (!has(likedIds, m)) return false;
    } else if (showWatched) {
      // "Дивився" pressed -> isolate to ONLY watched titles.
      if (!has(watchedIds, m)) return false;
    } else {
      // Default ("Дивився" unpressed) -> only unwatched titles.
      if (has(watchedIds, m)) return false;
    }
    if (genre && genre !== 'all' && m.genre_group !== genre) return false;
    if (recommender && recommender !== 'all' && (m.recommended_by || '') !== recommender) return false;
    return true;
  });
}

/**
 * Films already in the catalog that loosely match what someone typed.
 *
 * Used when TMDb finds nothing while adding: often the reason is that the
 * film is already here and the person is searching for it in the wrong
 * place. Runs the SAME matcher as the catalog search box, typo tolerance
 * and all, so "нічого не знайдено" stops being the end of the road.
 */
function fuzzyCatalogSuggestions(catalog, query, limit = 5) {
  const q = (query || '').trim();
  if (!q) return [];
  return (catalog || []).filter(m => m && matches(m, q.toLowerCase())).slice(0, limit);
}

/* ---------- daily trending top-20 (the starter pack) ----------
 * A new account looks at an unfamiliar catalog; the starter pack answers
 * "what do film fans watch right now" with a daily-refreshed top-20. Two
 * independent signals feed it: TMDb's weekly trending (what the film
 * community views and rates — we already hold a key via the proxy) and the
 * iTunes top-movies feed (what viewers actually pay for; open JSON, no
 * key). Letterboxd, IMDb and Trakt were all tried first and are bot-gated —
 * Cloudflare challenges or mandatory API registration — so a daily fetch
 * from CI would be brittle theatre.
 *
 * Pure parsing/merging lives here so it is unit-tested; the network and
 * database halves are scripts/update-trending.js.
 */

/** One film's cross-source identity: normalized title + year. */
function trendingIdentity(title, year) {
  const base = normTitleForDup(title);
  const y = Number(year);
  return Number.isFinite(y) && y > 0 ? `${base}|${y}` : base;
}

/** Firebase keys forbid . # $ / [ ] — the identity may carry any of them. */
function trendingCacheKey(identity) {
  return String(identity || '').replace(/[.#$/\[\]]/g, '_');
}

/** TMDb /trending/movie/week -> [{title, year, tmdb_id, poster_path}] */
function parseTmdbTrending(data) {
  return ((data && data.results) || [])
    .filter(r => r && (r.title || r.original_title))
    .map(r => ({
      title: r.title || r.original_title,
      year: Number((r.release_date || '').slice(0, 4)) || null,
      tmdb_id: r.id || null,
      poster_path: r.poster_path || null,
    }));
}

/** iTunes top-movies RSS -> [{title, year}] */
function parseItunesTopMovies(data) {
  const entries = (data && data.feed && data.feed.entry) || [];
  return entries
    .map(e => {
      let title = (e && e['im:name'] && e['im:name'].label || '').trim();
      const year = Number(((e && e['im:releaseDate'] && e['im:releaseDate'].label) || '').slice(0, 4)) || null;
      // iTunes sometimes bakes the year into the name — "Obsession (2026)" —
      // which would break cross-source matching against TMDb's clean title.
      if (year) title = title.replace(new RegExp(`\\s*\\(${year}\\)$`), '');
      return { title, year };
    })
    .filter(e => e.title);
}

/**
 * Merges ranked source lists into one top-N.
 *
 * Rank-based scoring (first place in a 25-item list is worth 25), summed
 * across sources — so a film hot on BOTH lists beats a film hot on one.
 * Cross-source identity is normalized title + year with one year of
 * tolerance, because the sources disagree about years for the same reason
 * TMDb and OMDb do (premiere vs release).
 */
function mergeTrendingSources(sources, limit = 20) {
  const byIdentity = new Map();
  for (const src of sources || []) {
    const items = (src && src.items) || [];
    items.forEach((item, idx) => {
      if (!item || !item.title) return;
      const year = Number(item.year) || null;
      const base = normTitleForDup(item.title);
      if (!base) return;
      let identity = null;
      for (const dy of [0, -1, 1]) {
        const probe = year ? `${base}|${year + dy}` : base;
        if (byIdentity.has(probe)) { identity = probe; break; }
      }
      if (!identity) identity = trendingIdentity(item.title, year);
      const cur = byIdentity.get(identity) || {
        identity, title: item.title, year, tmdb_id: null, poster_path: null, score: 0, sources: [],
      };
      cur.score += items.length - idx;
      if (src.name && !cur.sources.includes(src.name)) cur.sources.push(src.name);
      cur.tmdb_id = cur.tmdb_id || item.tmdb_id || null;
      cur.poster_path = cur.poster_path || item.poster_path || null;
      cur.year = cur.year || year;
      byIdentity.set(identity, cur);
    });
  }
  return [...byIdentity.values()]
    .sort((a, b) => b.score - a.score || String(a.title).localeCompare(String(b.title)))
    .slice(0, limit)
    .map((m, i) => ({ ...m, rank: i + 1 }));
}

/**
 * Where one merged entry's display data should come from, WITHOUT spending
 * a request: the live catalog first (a film we already track carries its
 * own Ukrainian title and poster), then the resolution cache from earlier
 * runs. Only 'lookup' entries cost a TMDb call, and the list churns slowly,
 * so most days cost zero lookups.
 */
function resolveTrendingEntry(entry, catalog, cache) {
  const dup = findDuplicateMovie(catalog, entry.title, entry.title, entry.year);
  if (dup) return { kind: 'catalog', movie: dup };
  const cached = cache && cache[trendingCacheKey(entry.identity)];
  if (cached) return { kind: 'cache', data: cached };
  return { kind: 'lookup' };
}

/**
 * Whether the stored list needs rewriting. Field-by-field on what the UI
 * shows, so a re-run with identical results writes nothing — "перевірити,
 * чи є зміни" rather than blindly overwrite.
 */
function trendingListChanged(oldMovies, newMovies) {
  const strip = list => (list || []).map(m => ({
    identity: m.identity, title_en: m.title_en, title_uk: m.title_uk, year: m.year,
    poster_url: m.poster_url, rank: m.rank,
    sources: [...(m.sources || [])].sort(),
  }));
  return JSON.stringify(strip(oldMovies)) !== JSON.stringify(strip(newMovies));
}

/* ---------- auto-generated top-100 collections ----------
 * The "Добірки SeenIt" half of the recommendations flow: a top-100 overall
 * plus a top-100 per genre, rebuilt by scripts/update-toplists.js from
 * TMDb discover (highest vote average with a minimum vote count, so a
 * ten-vote 10.0 never outranks a classic). Genre ids are TMDb's own.
 */
// `group` is the decisive field: TMDb's with_genres matches ANY tag a film
// carries, which is why anime flooded the sci-fi list and action films sat
// in the drama one. Each list keeps only films whose PRIMARY genre (see
// primaryGenre) equals its group, so a film appears in exactly one
// collection — the one it actually belongs to.
const TOPLIST_DEFS = [
  { key: 'all',       title: 'Топ-100 фільмів',        genres: [],        group: null,             minVotes: 1000 },
  { key: 'thriller',  title: 'Топ-100 трилерів',       genres: [53, 80],  group: 'Трилери',        minVotes: 400 },
  { key: 'drama',     title: 'Топ-100 драм',           genres: [18, 36, 10749, 10752], group: 'Драми', minVotes: 400 },
  { key: 'comedy',    title: 'Топ-100 комедій',        genres: [35],      group: 'Комедії',        minVotes: 400 },
  { key: 'horror',    title: 'Топ-100 жахів',          genres: [27],      group: 'Жахи',           minVotes: 250 },
  { key: 'scifi',     title: 'Топ-100 фантастики',     genres: [878, 14], group: 'Фантастика',     minVotes: 400 },
  { key: 'detective', title: 'Топ-100 детективів',     genres: [9648],    group: 'Детективи',      minVotes: 200 },
  { key: 'action',    title: 'Топ-100 бойовиків',      genres: [28],      group: 'Бойовики',       minVotes: 400 },

/* ---------- catalog migration safety ----------
 * The one-time movie migration wrote the whole of kino/movies in a single
 * set(), sourced from the static snapshot baked into src/movies-data.js.
 * That snapshot is frozen at build time, so anything added to the live
 * catalog since then was destroyed by a re-run — and the script advertised
 * itself as "safe to re-run".

/* ---------- duplicate detection when adding a movie ----------
 * Matching on the generated slug id alone is fragile (a slightly different

 * or a cast list cleaned of CJK names; re-fetching from TMDb would quietly
 * undo all of it. So a value that is already present always wins, and this

/* ---------- sorting ----------

 * sort mode; watchedIds is anything with a `.has(id)` method (a Set works).

/* ---------- TMDb genre mapping ---------- */

/* TMDb's genre_ids order is CURATED, not sorted — measured, not assumed:
 *   The Dark Knight  28 Action, 80 Crime, 53 Thriller
 *   Hot Fuzz         80 Crime, 28 Action, 35 Comedy
 *   Pulp Fiction     53 Thriller, 80 Crime, 35 Comedy
 *   Dune             878 SciFi, 12 Adventure
 * None of those are ascending by id, and each leads with what the film
 * actually is. So "first recognised id" is a sound basis for the primary
 * genre — a true action film with comic moments leads with Action, a
 * comedy with gunfights leads with Comedy, exactly the distinction we
 * want. What the rule was missing is anime.
 */

/**
 * ANIME is not a TMDb genre; TMDb files it as Animation, so it scattered
 * into Sci-Fi, Fantasy and Adventure collections and drowned them. The
 * reliable split is animation + Japanese origin — measured on the same
 * probe: Spirited Away is 16 Animation with original_language "ja", while
 * Spider-Verse is 16 Animation with "en". Same genre tag, different thing.
 */
const ANIMATION_GENRE_IDS = [16, 10762];

/* PARODY is the second thing TMDb's genre list cannot express. Hot Shots!
 * — a Top Gun spoof whose own keywords say `parody` — is filed
 * 28 Action > 35 Comedy > 10752 War, so the order rule calls it an action
 * film. The order there describes what the film is ABOUT (military
 * aviation), not what it IS. Same for Hot Fuzz and Shaun of the Dead.
 *
 * The keyword is the honest signal: TMDb's `parody` (9755) appears on all
 * three and on none of the straight action films in the sample. `satire`
 * (8201) is deliberately NOT included — a satirical drama is still a
 * drama, and widening the rule to it would swallow films that are not
 * parodies at all.
 */
const PARODY_KEYWORD_ID = 9755;

/** Keywords arrive as [{id,name}] from TMDb, or as bare ids/names elsewhere. */
function hasKeyword(meta, id, name) {
  const list = (meta && meta.keywords) || [];
  const items = Array.isArray(list) ? list : (list.keywords || []);
  return items.some(k => {
    if (k && typeof k === 'object') return k.id === id || String(k.name).toLowerCase() === name;
    return k === id || String(k).toLowerCase() === name;
  });
}

  return hasKeyword(meta, PARODY_KEYWORD_ID, 'parody');
}
function isAnime(genreIds, meta) {
  const ids = genreIds || [];
  if (!ids.some(id => ANIMATION_GENRE_IDS.includes(Number(id)))) return false;

/**
 * The ONE genre a film belongs to, used both when adding a film and when
 * building the auto-generated collections — so a film lands in the same
 * place either way.
 */

  // Two overrides before the order rule, both for things TMDb's genre list
  // cannot say. Anime goes first deliberately: it describes the MEDIUM and
  // the origin, which stays true even of a parody — a Japanese animated
  // spoof is still shelved with anime.
  if (isAnime(genreIds, meta)) return { genre: 'аніме', group: 'Аніме' };
  if (isParody(meta)) return { genre: 'пародія', group: 'Пародії' };

// Kept as the historical name used across app.js and the migrations.

/* ---------- slug for new movies ---------- */
/**
 * An id that is free in this catalog, derived from a preferred one.
 *
 * Needed by "save as a separate record": the second copy cannot reuse the
 * first one's id, or writing it would silently overwrite the film the person
 * chose to keep. Appends -2, -3, ... rather than anything random, so the

/**
 * The fields a re-download may refresh on an existing record, and the ones
 * it must not touch.

 * "переглянуто"/"рекомендую" marks attached — re-adding under a new id would

/* ---------- trailer embedding ----------

/* ---------- OCR title-candidate extraction ---------- */

function isJunkLine(line) {
  const s = line.trim();
  if (!s) return true;
  if (/^https?:\/\//i.test(s)) return true;
  const withoutTags = s.replace(/[#@][^\s#@]+/g, '').trim();
  if (!withoutTags) return true;
  if ((withoutTags.match(/\p{L}/gu) || []).length < 2) return true;
  return false;
}
function cleanCandidate(raw) {
  let s = raw;
  for (let i = 0; i < 3; i++) {
    const before = s;
    s = s.trim();
    const cut = s.search(/[.!?…](\s|$)/);
    if (cut > 3 && cut < s.length - 1) s = s.slice(0, cut);
    s = s.replace(/[#@][^\s#@]*$/g, '');
    s = s.replace(/^[\s"«»“”'’ʼ:\-–—.,!?]+|[\s"«»“”'’ʼ:\-–—.,!?]+$/g, '');
    s = s.replace(/\s{2,}/g, ' ');
    if (s === before) break;
  }
  return s.trim();
}

function isPlausibleTitle(s) {
  if (!s || s.length < 2 || s.length > 70) return false;
  if (/^https?:\/\//i.test(s)) return false;
  if (/^[#@]/.test(s)) return false;
  if (/^\d[\d.,:]{1,7}(\D|$)/.test(s)) return false;
  const letterCount = (s.match(/\p{L}/gu) || []).length;
  if (letterCount < 3) return false;
  const longestWord = (s.match(/\p{L}+/gu) || []).reduce((m, w) => Math.max(m, w.length), 0);
  if (longestWord < 3) return false;
  if (/^\d+$/.test(s.replace(/\s/g, ''))) return false;
  const lc = s.toLowerCase();
  if (UI_JUNK_PHRASES.some(p => lc === p || (s.length <= 22 && lc.includes(p)))) return false;
  return true;
}
function extractTitleCandidates(text) {
  const quoted = [];
  const triggered = [];
  const wholeLines = [];

  const pairs = [['«', '»'], ['"', '"'], ['“', '”'], ["'", "'"], ['‘', '’'], ['ʼ', 'ʼ']];
  for (const [open, close] of pairs) {
    const re = new RegExp(`${open}([^${open}${close}\\n]{2,80})${close}`, 'g');
    let m;
    while ((m = re.exec(text))) quoted.push(cleanCandidate(m[1]));
  }
  const triggerRe = new RegExp(
    `(?<![\\p{L}\\p{N}])(?:${TITLE_TRIGGER_WORDS.join('|')})(?![\\p{L}\\p{N}])[:\\-–—]?\\s+([^\\n"«»“”‘’ʼ—#@/]{2,80})`, 'giu'
  );
  let tm;
  while ((tm = triggerRe.exec(text))) triggered.push(cleanCandidate(tm[1]));
  for (const line of text.split('\n')) {
    if (isJunkLine(line)) continue;
    const c = cleanCandidate(line);
    if (c && c.length <= 50) wholeLines.push(c);
  }

  const seen = new Set();
  const result = [];
  for (const c of [...quoted, ...triggered, ...wholeLines]) {
    if (!isPlausibleTitle(c)) continue;
    const key = c.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    result.push(c);
  }
  return result.slice(0, 12);
}

function parseBatchLine(line) {
  const m = line.match(/^(.*?)[,(]\s*(\d{4})\)?\s*$/);
  if (m) return { title: m[1].trim(), year: m[2] };
  return { title: line.trim(), year: '' };
}

/* ---------- data tables ----------
 * Icons, award pictograms and the genre section order live in
 * src/data/ui.js — see the same two-path loading note in logic.js. Under
 * Node this file is only ever loaded through the built page, so the
 * browser branch is the live one here; the require keeps it importable.
 */
const UI = (typeof module !== 'undefined' && module.exports) ? require('./data/ui.js') : UI_DATA;
const ICON = UI.ICON;
const AWARD_ICONS = UI.AWARD_ICONS;
const GENRE_ORDER = UI.GENRE_ORDER;

/* ---------- persistence (shared via Firebase Realtime Database) ---------- */

const db = firebase.database();
const auth = firebase.auth();
// Both hold TMDb ids as strings, not slugs — see markKey() in logic.js. A
// mark is cross-cutting now: it is true of the FILM, wherever the film
// appears, so it can only be keyed by the film's own identity.
let watched = new Set();
let liked = new Set();

/**
 * The TMDb ids on MY shelf.
 *
 * The catalogue used to be a per-account copy, so "is this film mine" and
 * "is this film in the catalogue" were the same question. They are not any
 * more: the grid shows all 13,546 films, and being able to see one says
 * nothing about whether it is on my shelf. Without this set every film would
 * read as one I already have, and adding anything would be impossible.
 */
let mine = new Set();

/** My own films, out of the shelf the Worker assembles in one round trip. */
async function loadShelf() {
  try {
    const res = await fetch(`${API_PROXY}/library/collections`, { headers: await proxyHeaders({ accept: 'application/json' }) });
    if (!res.ok) throw new Error(`shelf ${res.status}`);
    const data = await res.json();
    // A collection is addressed by the PAIR (owner, id): somebody else's
    // "my_films" can sit on the same shelf as mine, so matching on the id
    // alone would fold their films into my count.
    const own = (data.collections || []).find(c => c.source === 'own' && c.collection_id === MY_FILMS_ID);
    mine = new Set((own && own.film_ids ? own.film_ids : []).map(String));
    render({ keepDrawn: true });
  } catch (err) {
    // An empty shelf is the safe failure: it offers to add a film that is
    // already there (harmless — the add is idempotent) rather than refusing
    // to add one that is not.
    mine = new Set();
  }
}

/** Whether this film is already on my shelf. */
function haveFilm(m) {
  const key = markKey(m);
  return !!(key && mine.has(key));
}

// Local fallback so the page still works if Firebase is unreachable
const localStore = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e) { return []; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};

/**
 * Both mark lists, in one request.
 *
 * `watched` and `liked` are cross-cutting — a mark applies to the film
 * wherever it shows up, in any collection, on anybody's shelf — so they are
 * read once per session for the whole account rather than watched per film.
 * That is also why they arrive together: they live in one row.
 *
 * There is no live listener any more. Firebase pushed every change to every
 * tab; D1 answers questions and says nothing on its own. In exchange a mark
 * is now applied optimistically and written in the background (see toggle()),
 * which is what the reader actually feels — the round trip used to be visible
 * on a slow connection.
 */
async function loadMarks(uid) {
  const localKeys = { watched: localMarksKey(uid, 'watched'), liked: localMarksKey(uid, 'liked') };
  const apply = (source) => {
    watched = new Set((source.watched || []).map(String));
    liked = new Set((source.liked || []).map(String));
    window.watched = watched;
    window.liked = liked;
    // A readiness beacon, not app logic: the e2e fixture waits on it so a
    // scenario's first "remember the count" read cannot race the marks
    // arriving from the database — which produced remembered-null against
    // a chip that filled in a moment later. Counted per list, as before,
    // because both used to arrive separately.
    window.__marksLoadedCount = (window.__marksLoadedCount || 0) + 2;
    // keepDrawn: marks arriving from the database must not scroll the reader
    // to the top of the catalogue.
    render({ keepDrawn: true });
  };
  try {
    const res = await fetch(`${API_PROXY}/library/marks`, { headers: await proxyHeaders({ accept: 'application/json' }) });
    if (!res.ok) throw new Error(`marks ${res.status}`);
    const data = await res.json();
    apply(data);
    if (localKeys.watched) localStore.set(localKeys.watched, [...watched]);
    if (localKeys.liked) localStore.set(localKeys.liked, [...liked]);
  } catch (err) {
    // Offline, or the token expired mid-session: fall back to whatever was
    // last saved locally rather than showing an account with no history.
    apply({
      watched: localKeys.watched ? localStore.get(localKeys.watched) : [],
      liked: localKeys.liked ? localStore.get(localKeys.liked) : [],
    });
  }
}
/* ---------- auth: each person logs in with their own username + password ---------- */
// Firebase needs an email format under the hood, so we map a plain
// "username" to a fixed fake domain. The actual password is set per-account
// in the Firebase Console and never appears anywhere in this code.
// usernameToEmail() now lives in src/logic.js (loaded before this file).

const loginOverlay = document.getElementById('loginOverlay');
const appRoot = document.getElementById('appRoot');
const loginForm = document.getElementById('loginForm');
const loginUser = document.getElementById('loginUser');
const loginPass = document.getElementById('loginPass');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const logoutBtn = document.getElementById('logoutBtn');

let syncedOnce = false;
auth.onAuthStateChanged(user => {
  if (user && user.isAnonymous) {
    // Leftover session from an earlier version of the app that used
    // anonymous sign-in. That mode is gone now — kick it out automatically
    // so the person always lands on the real login screen.
    auth.signOut();
    return; // onAuthStateChanged will fire again with user = null
  }
  if (user) {
    loginOverlay.classList.add('hidden');
    appRoot.style.display = '';
    logoutBtn.style.display = '';
    accountBtn.style.display = '';
    if (!syncedOnce) {
      syncedOnce = true;
      // Films come from D1, the person stays on Firebase. Both start at once
      // and neither waits on the other: the catalogue paints as its first
      // page lands, and the marks re-render over it when they arrive.
      loadCatalog();
      loadMarks(user.uid);
      loadShelf();
      loadServices(user.uid);
      // First visit on this account: the flag lives in the account's own
      // subtree (not localStorage), so a new phone does not replay the
      // guide for an account that has already seen it.
      const marksPath = userMarksPath(user.uid, 'watched');
      if (marksPath) {
        db.ref(`kino/users/${user.uid}/onboarded`).once('value')
          .then(snap => { if (!snap.val()) openOnboarding(); })
          .catch(() => { /* offline: the guide can wait */ });
      }
    }
  } else {
    loginOverlay.classList.remove('hidden');
    appRoot.style.display = 'none';
    logoutBtn.style.display = 'none';
    accountBtn.style.display = 'none';
  }
});

// One form, two modes. Registration reuses the login fields because the
// data is identical (username + password); only the submit call and the
// error texts differ per mode.
let authMode = 'login';
const registerToggle = document.getElementById('registerToggle');
function setAuthMode(mode) {
  authMode = mode;
  loginError.textContent = '';
  const register = mode === 'register';
  loginBtn.textContent = register ? 'Зареєструватися' : 'Увійти';
  document.querySelector('.login-sub').textContent = register
    ? 'Придумай ім\u02bcя користувача і пароль'
    : 'Увійди у свій акаунт';
  registerToggle.textContent = register
    ? 'Уже є акаунт? Увійти'
    : 'Немає акаунта? Зареєструватися';
}
registerToggle.addEventListener('click', () => setAuthMode(authMode === 'login' ? 'register' : 'login'));

// Every code gets its own text because the generic fallback misleads: the
// throttling case genuinely sent people to reset a password that was fine.
function registerErrorText(err) {
  const code = err && err.code;
  if (code === 'auth/email-already-in-use') return 'Це ім\u02bcя вже зайняте — спробуй інше або увійди.';
  // The console enforces a password policy (owner-configured): min 8,
  // upper+lower case, a digit and a symbol. It arrives as its own code;
  // plain weak-password still covers the under-6 case, and both get the
  // POLICY text — telling someone "6 characters minimum" when the real bar
  // is higher sends them into a loop of valid-looking rejected passwords.
  if (code === 'auth/weak-password' || code === 'auth/password-does-not-meet-requirements') {
    return 'Пароль: щонайменше 8 символів, велика й мала літери, цифра і символ.';
  }
  if (code === 'auth/operation-not-allowed') return 'Реєстрацію вимкнено адміністратором.';
  if (code === 'auth/invalid-email') return 'Ім\u02bcя містить недозволені символи.';
  return 'Не вдалося зареєструватися. Спробуй ще раз.';
}

loginForm.addEventListener('submit', e => {
  e.preventDefault();
  loginError.textContent = '';
  const register = authMode === 'register';
  loginBtn.disabled = true;
  loginBtn.textContent = register ? 'Створюємо…' : 'Входимо…';
  const email = usernameToEmail(loginUser.value);
  const call = register
    ? auth.createUserWithEmailAndPassword(email, loginPass.value)
    : auth.signInWithEmailAndPassword(email, loginPass.value);
  call
    .catch(err => {
      // Firebase throttles an account after repeated sign-ins and returns
      // auth/too-many-requests. Swallowing the code and always saying
      // "wrong password" sent people to reset a password that was fine —
      // and made a throttled CI run look like broken credentials.
      loginError.textContent = register
        ? registerErrorText(err)
        : ((err && err.code === 'auth/too-many-requests')
          ? 'Забагато спроб входу. Спробуйте за кілька хвилин.'
          : "Невірне ім'я користувача або пароль");
    })
    .finally(() => {
      loginBtn.disabled = false;
      loginBtn.textContent = authMode === 'register' ? 'Зареєструватися' : 'Увійти';
    });
});

/* ---------- Google sign-in ----------
 * One button for both sign-in and instant registration: Firebase creates
 * the account on first Google sign-in, so the form's two modes do not
 * apply here. Popup first — this site is not on Firebase Hosting, and
 * browsers increasingly block the third-party storage the REDIRECT flow
 * needs on such setups — with redirect kept only as the fallback for
 * browsers that block the popup itself.
 */
const googleBtn = document.getElementById('googleBtn');
function googleErrorText(err) {
  const code = err && err.code;
  if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return '';
  if (code === 'auth/account-exists-with-different-credential') {
    return 'Ця пошта вже використовується акаунтом із паролем — увійди ним.';
  }
  if (code === 'auth/operation-not-allowed') return 'Вхід через Google вимкнено адміністратором.';
  if (code === 'auth/network-request-failed') return 'Немає з\u02bcєднання. Спробуй ще раз.';
  return 'Не вдалося увійти через Google. Спробуй ще раз.';
}
googleBtn.addEventListener('click', () => {
  loginError.textContent = '';
  googleBtn.disabled = true;
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .catch(err => {
      if (err && err.code === 'auth/popup-blocked') {
        // The one case redirect handles better than an error message does.
        return auth.signInWithRedirect(provider);
      }
      loginError.textContent = googleErrorText(err);
    })
    .finally(() => { googleBtn.disabled = false; });
});
// A redirect round-trip lands back here; without this its FAILURE would be
// silent — the page just shows the login screen again with no explanation.
if (typeof auth.getRedirectResult === 'function') {
  auth.getRedirectResult().catch(err => {
    loginError.textContent = googleErrorText(err);
  });
}

let selectedForDelete = new Set();

/* ---------- toast (save success/error banner) ---------- */
let _toastEl = null;
let _toastTimer = null;
// Guards the very click that just opened a toast (an award/critic-score
// badge tap) from immediately closing it again as it keeps bubbling up to
// `document` in the same tick — see the click listener below. Flips true
// on the next tick, so any click after the opening one closes it.
let _toastDismissible = false;
function toast(kind, message) {
  if (!_toastEl) {
    _toastEl = document.createElement('div');
    _toastEl.id = 'toast';
    document.body.appendChild(_toastEl);
  }
  _toastEl.className = `toast toast--${kind}`;
  _toastEl.textContent = message;
  _toastEl.classList.add('show');
  clearTimeout(_toastTimer);
  const duration = kind === 'error' ? 4500 : (kind === 'info' ? 5500 : 3000);
  _toastTimer = setTimeout(hideToast, duration);
  _toastDismissible = false;
  setTimeout(() => { _toastDismissible = true; }, 0);
}
function hideToast() {
  clearTimeout(_toastTimer);
  if (_toastEl) _toastEl.classList.remove('show');
}

/* ---------- info popover (award/critic-score explanations) ----------
 * A fixed-position bottom banner (the toast above) makes sense for a
 * save confirmation — it's not "about" anything on screen. An
 * explanation of a specific badge you just tapped is: it needs to show
 * up next to that badge, not down at the bottom of a long modal/card
 * grid where it's easy to miss it's even related to what you tapped.
 */
let _popoverEl = null;
let _popoverDismissible = false;
function showInfoPopover(anchorEl, message) {
  if (!_popoverEl) {
    _popoverEl = document.createElement('div');
    _popoverEl.id = 'infoPopover';
    document.body.appendChild(_popoverEl);
  }
  _popoverEl.textContent = message;
  // Measure off-screen first (size depends on the text just set), then
  // place it right next to the anchor — never fall back to a viewport-wide
  // clamp that can strand it far from what was actually tapped (that
  // happened for a long bullet list: neither "fits below" nor "fits above"
  // held, so the old clamp shoved it all the way to the top of the
  // screen). Instead pick whichever side (above/below the anchor) has more
  // room, and cap the popover's own height to that room — so it always
  // ends up adjacent to the anchor, never covering it, never drifting away.
  _popoverEl.classList.remove('show');
  _popoverEl.style.visibility = 'hidden';
  _popoverEl.style.left = '0px';
  _popoverEl.style.top = '0px';
  _popoverEl.style.maxHeight = '';
  const anchorRect = anchorEl.getBoundingClientRect();
  const margin = 8;
  const spaceBelow = window.innerHeight - anchorRect.bottom - margin;
  const spaceAbove = anchorRect.top - margin;
  const placeBelow = spaceBelow >= spaceAbove;
  _popoverEl.style.maxHeight = `${Math.max(80, placeBelow ? spaceBelow : spaceAbove)}px`;
  const popRect = _popoverEl.getBoundingClientRect();
  let top = placeBelow ? anchorRect.bottom + margin : anchorRect.top - popRect.height - margin;
  top = Math.max(margin, Math.min(top, window.innerHeight - popRect.height - margin));
  let left = anchorRect.left + anchorRect.width / 2 - popRect.width / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - popRect.width - margin));
  _popoverEl.style.top = `${top}px`;
  _popoverEl.style.left = `${left}px`;
  _popoverEl.style.visibility = '';
  _popoverEl.classList.add('show');
  _popoverDismissible = false;
  setTimeout(() => { _popoverDismissible = true; }, 0);
}
function hideInfoPopover() {
  if (_popoverEl) _popoverEl.classList.remove('show');
}
document.addEventListener('click', e => {
  if (!_popoverDismissible || !_popoverEl || !_popoverEl.classList.contains('show')) return;
  if (_popoverEl.contains(e.target)) return;
  hideInfoPopover();
});
// Reposition (or just dismiss) on scroll/resize rather than leaving it
// pointing at empty space if the anchor moved.
window.addEventListener('scroll', () => hideInfoPopover(), true);
window.addEventListener('resize', () => hideInfoPopover());

// Tapping anywhere outside an open toast dismisses it immediately, instead
// of waiting out its timeout.
document.addEventListener('click', e => {
  if (!_toastDismissible || !_toastEl || !_toastEl.classList.contains('show')) return;
  if (_toastEl.contains(e.target)) return;
  hideToast();
});

/* ---------- render ---------- */
function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Critic-score badge (0-100%): background/border color is computed per-value
// via criticScoreColor() (src/logic.js) — a smooth red->yellow->green sweep,
// applied through a CSS custom property rather than a handful of fixed
// classes, so the color itself is continuous. Tappable (see the delegated
// click listeners below) since a native `title` tooltip doesn't work on touch.
function criticBadgeHtml(m) {
  if (m.critic_score === undefined || m.critic_score === null || m.critic_score === '') return '';
  const pct = Math.max(0, Math.min(100, Math.round(m.critic_score)));
  return `<span class="badge badge--critic critic-badge" style="--critic-color:${criticScoreColor(pct)}" data-critic-pct="${pct}">${pct}%</span>`;
}
function criticScoreToast(anchorEl, pct) {
  showInfoPopover(anchorEl, `${pct}% — частка позитивних оцінок критиків (Rotten Tomatoes, або Metascore, якщо перше недоступне для цього фільму).`);
}
// m.rating is a plain "TMDb 8.4"/"IMDb 7.7"-style string (see tmdbDetails()
// below and the older, differently-sourced catalog entries) — just
// explains whichever source it's actually tagged with, out of 10.
function ratingBadgeToast(anchorEl, ratingText) {
  const source = /^TMDb\b/i.test(ratingText) ? 'The Movie Database (TMDb)'
    : /^IMDb\b/i.test(ratingText) ? 'IMDb'
    : null;
  showInfoPopover(anchorEl, source ? `${ratingText} — рейтинг глядачів на ${source}, за шкалою 0–10.` : ratingText);
}

// Awards are grouped by ceremony (groupAwards(), src/logic.js) — a movie
// that won 3 Oscars shows ONE Oscar badge with a "+"-style multiplicity
// marker (awardCountSuffix()), not three separate icons. Each rendered
// badge's group is pushed into a registry so a later tap can toast exactly
// which award(s) it covers without cramming an array into a data-
// attribute. Two separate registries (card grid vs. modal), each reset at
// the start of its own render pass (see render()/openModal()) — otherwise
// re-rendering the grid while a modal is open would invalidate the
// modal's still-visible badge indices.
let _posterAwardMovies = [];
let _modalAwardGroups = [];
