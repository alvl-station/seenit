// OMDb count-only shape, and the padding mergeAwardSources() adds for a
// ceremony Wikidata under-detailed) are dropped rather than listed as an
// "unknown" line — that line was pure noise next to the real ones.
//
// So the bullets deliberately DON'T sum to the header's count: "Oscar (7)"
// can list 4 categories because those are the 4 we actually know. The count
// stays honest (it's the real number of awards), the list stays useful.
function knownAwardCategories(group) {
  return awardCategoryBreakdown(group.texts).filter(e => e.category);
}
// Only well-known ceremonies are shown at all — a local festival that
// AWARD_INFO doesn't recognize is dropped rather than rendered as a bare
// icon. Applied at RENDER time (not just when fetching) so rows stored
// before that rule existed display clean without waiting for a re-backfill.
function majorAwardGroups(list) {
  return groupAwards(majorAwardsOnly(list));
}
// What a tap on this group's badge should reveal, or null when there's
// nothing worth opening a popover for.
//
// Known categories win: the header names the ceremony once, each bullet is
// just the category half (splitAwardLabel()), and two awards sharing one
// category collapse to a single bullet with its own "(2)".
//
// Only when NOTHING is known — the OMDb count-only shape, e.g. a bare
// "Emmy" repeated, where no category exists anywhere in the group — does
// the curated one-line description of what the ceremony *is* stand in. It's
// strictly a fallback: whenever real categories exist, what the film
// actually won is shown instead, never a blurb about the ceremony.
function awardGroupPopoverText(group) {
  const header = `${group.name}${awardCountSuffix(group.texts.length)}`;
  const known = knownAwardCategories(group);
  if (known.length) {
    return [header, ...known.map(({ category, count }) => `• ${category}${awardCountSuffix(count)}`)].join('\n');
  }
  if (group.description) return `${header}\n${group.description}`;
  // Unrecognized ceremony, no categories, no curated description: the badge
  // renders icon-only for these (its "name" is a best-effort split that
  // could still be category text — see awardCountBadgesHtml), so the name
  // IS the new information a tap reveals here, not a repeat of the badge.
  return group.recognized ? null : header;
}
function awardGroupToast(anchorEl, registryName, idx) {
  const group = _modalAwardGroups[idx];
  if (!group) return;
  const text = awardGroupPopoverText(group);
  if (text) showInfoPopover(anchorEl, text);
}
// The poster trophy covers EVERY won ceremony at once (it is the only
// award UI on a card now), so its popover joins the per-ceremony blocks
// rather than showing one group's text.
function posterAwardToast(anchorEl, idx) {
  const m = _posterAwardMovies[idx];
  if (!m) return;
  const text = majorAwardGroups(readAwards(m.awards_won))
    .map(awardGroupPopoverText).filter(Boolean).join('\n\n');
  if (text) showInfoPopover(anchorEl, text);
}
// A badge is only tappable when the tap would actually reveal something.
// Returns the class + data-attributes for that, or empty strings otherwise.
function awardBadgeAttrs(group, registryName, idx) {
  if (!awardGroupPopoverText(group)) return { cls: '', attrs: '' };
  return { cls: ' award-badge', attrs: ` data-award-registry="${registryName}" data-award-idx="${idx}"` };
}
// Full award list for the modal: won and nominated shown as their own
// labeled groups of mini pill-badges (icon + name + count marker), each
// tappable for a toast enumerating the actual award(s) it covers.
function awardsSectionHtml(m) {
  const wonGroups = majorAwardGroups(readAwards(m.awards_won));
  const nomGroups = majorAwardGroups(readAwards(m.awards_nominated));
  if (!wonGroups.length && !nomGroups.length) return '';
  const pill = (g, kind) => {
    const icon = AWARD_ICONS[g.key] || (kind === 'won' ? ICON.trophy : ICON.star);
    _modalAwardGroups.push(g);
    // Same rule as the card badge: an unrecognized ceremony's "name" is a
    // best-effort guess (could still be a category fragment), so it stays
    // icon-only until tapped rather than risk leaking that text.
    const label = g.recognized ? esc(g.name) : '';
    const tap = awardBadgeAttrs(g, 'modal', _modalAwardGroups.length - 1);
    return `<span class="award-pill award-pill--${kind}${tap.cls}"${tap.attrs}>${icon}${label}${esc(awardCountSuffix(g.texts.length))}</span>`;
  };

    ? `<div class="modal-awards-group"><div class="lbl">${ICON.trophy}Нагороди</div>${wonGroups.map(g => pill(g, 'won')).join('')}</div>`
    : '';
  const nomHtml = nomGroups.length
    ? `<div class="modal-awards-group"><div class="lbl">${ICON.star}Номінації</div>${nomGroups.map(g => pill(g, 'nom')).join('')}</div>`
    : '';
  return `<div class="modal-awards">${wonHtml}${nomHtml}</div>`;
}

function posterHtml(m, cls) {
  if (m.poster_url) {
    return `<div class="${cls}" style="--hue:${hue(m)}">
      <img src="${esc(m.poster_url)}" alt="${esc(m.canonical_title_uk)}" loading="lazy"

    </div>`;
  }
  return `<div class="${cls} fallback" style="--hue:${hue(m)}"><span class="poster-initial">${esc((m.canonical_title_uk||'?')[0].toUpperCase())}</span></div>`;
}

// The ONLY award UI on a card (owner's call: the under-title badge row
// duplicated this with a different tally — wins here, wins-plus-nominations
// there — and two trophies with two numbers on one card read as a
// contradiction). Wins only, because "how many did it WIN" is the at-a-
// glance signal; nominations live in the modal. Tappable: opens the
// per-ceremony breakdown the badge row used to carry.
// Returns a RENDERER for this movie's trophy, so the card can place the
// same pill (same registry index, same popover) in two spots: the poster

// view — where an absolutely-positioned corner badge collided with the
// row layout (owner-reported). CSS shows exactly one of the two.
function posterAwardBadge(m) {
  const wonCount = readAwards(m.awards_won).length;
  if (!wonCount) return () => '';
  const idx = _posterAwardMovies.push(m) - 1;
  return (variant) =>
    `<div class="poster-award-badge poster-award-badge--${variant}" data-poster-award-idx="${idx}" role="button" tabindex="0">${ICON.trophy}<span>${wonCount}</span></div>`;
}

function cardHtml(m) {
  const isW = isMarked(watched, m), isL = isMarked(liked, m);
  const critic = criticBadgeHtml(m);
  const sel = deleteMode && selectedForDelete.has(m.id);
  const trophy = posterAwardBadge(m);
  return `<div class="card ${isW ? 'is-watched' : ''} ${sel ? 'is-selected' : ''}" data-id="${esc(m.id)}">
    ${deleteMode ? `<div class="card-select-mark">${sel ? ICON.check : ''}</div>` : ''}
    ${posterHtml(m, 'poster')}
    ${trophy('corner')}
    <div class="card-toggles">
      <button class="tgl ${isW ? 'on-watched' : ''}" data-act="watch" title="Переглянуто">${ICON.eye}</button>
      <button class="tgl ${isL ? 'on-liked' : ''}" data-act="like" title="Рекомендую">${ICON.heart}</button>
    </div>
    <div class="card-body">

        <span class="year">${esc(m.type)}${m.year ? ` · ${m.year}` : ''}</span>
        ${m.rating ? `<span class="badge badge--rating rating-badge" data-rating="${esc(m.rating)}">${ICON.ratingStar} ${esc(m.rating)}</span>` : ''}
      </div>
      <div class="card-title-row"><h3>${esc(m.canonical_title_uk)}</h3></div>
      ${critic ? `<div class="critic-corner">${critic}</div>` : ''}
      ${trophy('inline')}
    </div>
  </div>`;

/**
 * How many cards one render pass draws before waiting for the reader.
 *
 * The catalogue used to be drawn WHOLE, every pass. That was fine at a
 * hundred films; after the genome import an account holds 13,000, so every
 * filter change, every mark, and every entry into delete mode rebuilt
 * thirteen thousand cards in one innerHTML write. On a phone that is a long
 * freeze; in CI it made clicking a card time out, which failed the smoke
 * suite and rolled live releases back.
 *
 * 200 is generous enough that a filtered view — watched, liked, one genre —
 * almost always arrives complete in the first pass, while still being ~65x
 * less work than the whole catalogue.
 */
const RENDER_BATCH = 200;
// How many cards the current view should hold. Grows as the reader scrolls,
// and is preserved across re-renders that only change how cards LOOK.
let _drawnTarget = RENDER_BATCH;
let _renderQueue = [];         // films grouped but not yet drawn
let _batchObserver = null;

/**
 * Appends the next films from _renderQueue, reusing a genre section when one
 * is already on the page instead of rewriting it.
 *
 * Append-only on purpose: redrawing what is already there is the cost this
 * whole mechanism exists to avoid.
 */
function drawQueuedCards(main, budget) {
  while (budget > 0 && _renderQueue.length) {
    const head = _renderQueue[0];
    const take = head.movies.splice(0, budget);
    budget -= take.length;
    let grid = main.querySelector(`.genre-section[data-group="${cssAttr(head.group)}"] .grid`);
    if (!grid) {
      const section = document.createElement('section');
      section.className = 'genre-section';
      section.dataset.group = head.group;
      // The count is the group's TOTAL, not what is drawn so far — it answers
      // "how many are there", which does not change as you scroll.
      section.innerHTML = `<h2>${esc(head.group)} <span class="count">${head.total}</span></h2><div class="grid"></div>`;
      main.appendChild(section);
      grid = section.querySelector('.grid');
    }
    grid.insertAdjacentHTML('beforeend', take.map(cardHtml).join(''));
    if (!head.movies.length) _renderQueue.shift();
  }
  placeBatchSentinel(main);
}

/** Escapes a group name for use inside a [data-group="..."] selector. */
function cssAttr(value) {
  return String(value).replace(/["\\]/g, '\\$&');
}

/**
 * Keeps a sentinel as the last child of the grid while films remain.
 *
 * Where IntersectionObserver is unavailable — jsdom, which every page test
 * runs in — there is nothing to trigger the next batch, so the rest is drawn
 * immediately. Those fixtures hold a handful of films, so drawing them all is
 * both correct and free.
 */
function placeBatchSentinel(main) {
  const existing = document.getElementById('renderSentinel');
  if (!_renderQueue.length) {
    if (existing) existing.remove();
    return;
  }
  if (typeof IntersectionObserver === 'undefined') {
    if (existing) existing.remove();
    drawQueuedCards(main, Infinity);
    return;
  }
  const sentinel = existing || document.createElement('div');
  sentinel.id = 'renderSentinel';
  sentinel.className = 'render-sentinel';
  sentinel.setAttribute('aria-hidden', 'true');
  main.appendChild(sentinel);   // moves it back to last if it already existed
  if (!_batchObserver) {
    _batchObserver = new IntersectionObserver(entries => {
      if (!entries.some(e => e.isIntersecting)) return;
      const el = document.getElementById('main');
      _drawnTarget += RENDER_BATCH;
      drawQueuedCards(el, RENDER_BATCH);
    // Start the next batch before the reader reaches the end, so the grid
    // does not visibly stall at the bottom.
    }, { rootMargin: '800px' });
  }
  _batchObserver.observe(sentinel);
}

/**
 * @param {{keepDrawn?: boolean}} opts keepDrawn re-renders the same number of
 *   cards the view already held. Use it when only the APPEARANCE of cards
 *   changed (delete mode, a mark) — resetting to the first batch there would
 *   yank the page out from under someone who had scrolled.
 */
function render(opts = {}) {
  const main = document.getElementById('main');
  const items = visibleMovies();
  _posterAwardMovies = [];
  if (!opts.keepDrawn) _drawnTarget = RENDER_BATCH;

  // Counted over the catalog, not over the raw sets: a mark can outlive the
  // movie it points at (nothing deletes marks when a title is removed), and
  // counting the set made the chip claim four watched films while the list
  // below it showed three. See countExistingMarks() in logic.js.
  const nLiked = countExistingMarks(liked, MOVIES);
  const nWatched = countExistingMarks(watched, MOVIES);
  document.getElementById('nLiked').textContent = nLiked ? `(${nLiked})` : '';
  document.getElementById('nWatched').textContent = nWatched ? `(${nWatched})` : '';

  if (!items.length) {
    // Three different truths, three different sentences: still loading, an
    // account whose catalog is genuinely empty (every new registration),
    // and filters that matched nothing in a non-empty catalog.
    _renderQueue = [];
    main.innerHTML = !moviesLoaded
      ? '<div class="empty-msg">Завантажую каталог…</div>'
      : MOVIES.length === 0
        ? '<div class="empty-msg">Твій каталог поки порожній.<br>Додай перший фільм кнопкою <b>NEW</b> — або відкрий «Акаунт → Гайд і Топ-20»: там щоденний топ-20 і випадкова рекомендація з добірки.</div>'
        : '<div class="empty-msg">Нічого не знайдено</div>';
    return;
  }

  // group by genre unless a specific genre chip or non-all tab with search — keep genre sections always for structure
  const groups = new Map();
  for (const m of items) {
    const g = m.genre_group || 'Інше';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(m);
  }
  _renderQueue = [];
  for (const g of GENRE_ORDER) {
    if (!groups.has(g)) continue;
    const list = groups.get(g).slice().sort(sortFn);
    _renderQueue.push({ group: g, total: list.length, movies: list });
  }
  main.innerHTML = '';
  drawQueuedCards(main, _drawnTarget);
}

/* ---------- scroll lock (shared by every overlay/modal) ---------- */
// Plain `overflow:hidden` on body isn't reliable on iOS Safari (the page can
// still be dragged underneath a fixed-position overlay), so we additionally
// pin the body in place and restore the exact scroll position on unlock.
let _lockedScrollY = 0;
let _scrollLockCount = 0;
function lockScroll() {
  if (_scrollLockCount === 0) {
    _lockedScrollY = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = `-${_lockedScrollY}px`;
    document.body.classList.add('scroll-locked');
  }
  _scrollLockCount++;
}
function unlockScroll() {
  _scrollLockCount = Math.max(0, _scrollLockCount - 1);
  if (_scrollLockCount === 0) {
    document.body.classList.remove('scroll-locked');
    document.body.style.top = '';
    window.scrollTo(0, _lockedScrollY);
  }
}

/* ---------- "my services" ---------- */

// The services this person says they already pay for. A PREFERENCE, never a
// connection: see userServicesPath() in logic.js for why no real provider
// account can be linked, and why that is also what makes an accidental
// purchase impossible.
//
// Offered here rather than free-typed so the names match what TMDb returns
// and the sort in providersHtml() can compare them directly.
const KNOWN_SERVICES = ['Netflix', 'Megogo', 'HBO Max', 'Apple TV', 'Crunchyroll', 'MUBI', 'Amazon Prime Video'];
let _services = [];
function myServices() { return _services; }
function loadServices(uid) {
  const path = userServicesPath(uid);
  if (!path) { _services = []; return; }
  db.ref(path).on('value', snap => {
    _services = Object.keys(snap.val() || {});
    // A modal open at the time still shows the old order otherwise.
    if (overlay.classList.contains('open') && _modalMovie) openModal(_modalMovie);
  });
}
function toggleService(name, on) {
  const uid = auth.currentUser && auth.currentUser.uid;
  const path = userServicesPath(uid);
  if (!path) return Promise.resolve();
  return db.ref(`${path}/${name}`).set(on ? true : null);
}

/* ---------- modal ---------- */

/**
 * "Де подивитись" — the provider row under the trailer.
 *
 * Every entry is a plain link that opens the provider's TITLE page in a new
 * tab. This app has no account connection to any provider and never posts
 * anywhere, so it cannot rent, buy or subscribe to anything on a person's
 * behalf — deliberately, and the links avoid checkout/"buy" deep links so a
 * misplaced tap can't start a purchase either.
 *
 * Providers a person marked as already paid for (see myServices) are shown
 * first with a "у вас є" marker, since those cost nothing extra to watch.
 */
function providersHtml(m) {
  const list = sortProviders(m.providers || [], myServices());
  if (!list.length) return '';
  const rows = list.map(p => {
    const href = providerLinkUrl(p, m.providers_link);
    const logo = providerLogoUrl(p);
    const owned = myServices().includes(p.name);
    const inner = `
      ${logo ? `<img class="prov-logo" src="${esc(logo)}" alt="" loading="lazy">`
             : `<span class="prov-logo prov-logo--none" aria-hidden="true">${esc(p.name.slice(0, 1))}</span>`}
      <span class="prov-text">
        <span class="prov-name">${esc(p.name)}</span>
        <span class="prov-kind">${esc(providerKindLabel(p.kind))}${owned ? ' · у вас є' : ''}</span>
      </span>`;
    // No href -> render the same row as static text rather than a dead link.
    return href
      ? `<a class="prov${owned ? ' prov--owned' : ''}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
      : `<span class="prov${owned ? ' prov--owned' : ''}">${inner}</span>`;
  }).join('');
  return `<div class="modal-providers"><div class="lbl">Де подивитись</div><div class="prov-row">${rows}</div></div>`;
}

/* ---------- toggles ---------- */
async function toggle(act, id) {
  const movie = MOVIES.find(x => x.id === id);
  const key = markKey(movie);
  if (!key) {
    // A film with no tmdb_id cannot be marked: the mark IS a reference to
    // that id. Six such records exist, left over from before the app stored
    // it (scripts/backfill-tmdb-ids.js is what fixes them). Saying so beats
    // a tap that appears to work and is gone on the next load.
    toast('error', 'Цей фільм ще без TMDb-ідентифікатора — позначку нема на чому тримати.');
    return;
  }
  const list = act === 'watch' ? 'watched' : 'liked';
  const set = act === 'watch' ? watched : liked;
  const willBeOn = !set.has(key);

  // Optimistic local update for instant feedback.
  // keepDrawn: a mark can change WHICH films are listed (the "Дивився"
  // isolation filter), so this still re-renders — but it keeps the reader
  // where they were instead of jumping back to the top of the catalogue.
  willBeOn ? set.add(key) : set.delete(key);
  render({ keepDrawn: true });
  const localKey = localMarksKey(auth.currentUser && auth.currentUser.uid, list);
  if (localKey) localStore.set(localKey, [...set]);

  // D1 pushes nothing back, so this tab's own state is the state. A failed
  // write therefore has to be UNDONE rather than left for a listener to
  // correct — otherwise the mark sits there looking saved until a reload
  // quietly loses it.
  try {
    const url = markUrl(API_PROXY, list, key);
    const res = await fetch(url, {
      method: willBeOn ? 'PUT' : 'DELETE',
      headers: await proxyHeaders({ accept: 'application/json' }),
    });
    if (!res.ok) throw new Error(`mark ${res.status}`);
  } catch (err) {
    willBeOn ? set.delete(key) : set.add(key);
    if (localKey) localStore.set(localKey, [...set]);
    render({ keepDrawn: true });
    toast('error', 'Не вдалося зберегти позначку — спробуй ще раз');
  }
}

/* ---------- reusable clear button wiring for text inputs ---------- */
function wireClearButtons(root) {
  // `root` may either be a container that HAS .field-clear-wrap descendants
  // (e.g. the add-movie modal, several fields) or a single .field-clear-wrap
  // element itself (e.g. the header search field) — querySelectorAll alone
  // only ever finds descendants, so a lone wrap passed directly used to
  // match nothing and its clear button silently never got wired up.
  const wraps = root.classList && root.classList.contains('field-clear-wrap')
    ? [root]
    : Array.from(root.querySelectorAll('.field-clear-wrap'));
  wraps.forEach(wrap => {
    const input = wrap.querySelector('input');
    const btn = wrap.querySelector('.field-clear-btn');
    if (!input || !btn) return;
    const sync = () => wrap.classList.toggle('has-value', !!input.value);
    sync();
    input.addEventListener('input', sync);
    btn.addEventListener('click', () => {
      input.value = '';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.focus();
    });
  });
}

/* ==================== Add movie: OCR + TMDb ==================== */
// All third-party API calls go through the seenit-backend Cloudflare
// Worker proxy — the published page is a static site, so any key baked
// into it would be world-readable, and OMDb's free quota would be shared
// by every visitor. The Worker holds the keys as Cloudflare secrets and
// injects them server-side (REQUIREMENTS S-2). Poster images stay direct:
// image.tmdb.org needs no key.
const API_PROXY = 'https://seenit-proxy.seenit.workers.dev';

// The proxy only serves signed-in users: its URL is in this public page, so
// without this anyone could spend our OMDb quota. The Firebase ID token is
// the credential — it is minted per session, expires hourly and is refreshed
// automatically, so unlike a key baked into the HTML there is nothing here
// worth lifting out of DevTools.
async function proxyHeaders(extra = {}) {
  const user = auth.currentUser;
  if (!user) return extra;                       // caller handles the 401
  try {
    return { ...extra, Authorization: `Bearer ${await user.getIdToken()}` };
  } catch (err) {
    return extra;
  }
}
const TMDB_IMG = 'https://image.tmdb.org/t/p/w342';

let moviesLoaded = false;
// movies-data.js still ships a baked catalog, but it is NEVER shown any
// more: it is the OWNER's old list, and painting it before the database
// answers would flash another person's films at every new account. The
// instant-paint role belongs to a localStorage cache instead.

/**
 * The catalogue, from D1, a page at a time.
 *
 * There is ONE catalogue now — a query over `movies`, not a per-account copy
 * — so this takes no uid and the cache is shared (localCatalogueKey()).
 *
 * Paged rather than fetched whole for two reasons that pull the same way:
 * 13,546 films is more than one response should carry, and the grid can
 * start drawing after the first page instead of after the last. A page
 * shorter than asked for means the end; there is no total to compare
 * against, deliberately — see CATALOGUE_PAGE_MAX in the Worker.
 *
 * Films accumulate rather than replacing what is there, so the reader
 * watches the catalogue fill instead of waiting in front of an empty grid.
 */
async function loadCatalog() {
  // A readiness beacon, not app logic — the same role __marksLoadedCount
  // plays, and needed for the same reason one step further on.
  //
  // The catalogue used to arrive in one snapshot; it now arrives in fourteen
  // pages, and every page re-sorts and re-groups the grid. So a card's
  // POSITION is not stable until the last one lands: something that reads
  // "the card at index 61" while loading is still going can be looking at a
  // different film by the time it acts on it. That is exactly how the layout
  // smoke scenarios failed after the switch — they found a film with awards,
  // then asserted against an index that had since moved.
  window.__catalogueLoaded = false;
  const cacheKey = localCatalogueKey();
  const cached = localStore.get(cacheKey);
  if (Array.isArray(cached) && cached.length) {
    MOVIES.length = 0;
    cached.forEach(m => { if (m && m.id) MOVIES.push(m); });
    // The cache IS a loaded catalog as far as messaging goes. Without this,
    // a search typed during the paint-from-cache window answered
    // "Завантажую каталог…" to a person looking at a fully painted grid —
    // e2e caught it on the first run after the per-account change.
    moviesLoaded = true;
    render();
  }

  const collected = [];
  try {
    let after = 0;
    for (let first = true; ; first = false) {
      const res = await fetch(poolListUrl(API_PROXY, { limit: CATALOGUE_PAGE, after }),
        { headers: await proxyHeaders({ accept: 'application/json' }) });
      if (!res.ok) throw new Error(`catalogue ${res.status}`);
      const body = await res.json();
      const page = body.films || [];
      collected.push(...page.filter(m => m && m.id));
      // Replace the cached copy on the FIRST page and append after it: the
      // fresh answer is authoritative, and half of it drawn beats a stale
      // copy held until the last page lands.
      if (first) MOVIES.length = 0;
      page.forEach(m => { if (m && m.id) MOVIES.push(m); });
      moviesLoaded = true;
      renderChips();
      updateSubtitle();
      updateRecommenderFilter();
      // keepDrawn: later pages must not scroll a reader who has already
      // started browsing back to the top.
      render({ keepDrawn: !first });
      if (page.length < CATALOGUE_PAGE) break;
      // The server hands back the cursor rather than us deriving it: which
      // column orders the page is its business, and a caller guessing wrong
      // would skip films in silence.
      const next = Number(body.next_after) || Number(page[page.length - 1] && page[page.length - 1].tmdb_id) || 0;
      // A cursor that has not moved would fetch the same page for ever —
      // which is exactly what an older Worker, one that ignores `after` and
      // still pages by offset, would produce. Stopping beats spinning.
      if (next <= after) break;
      after = next;
    }
    localStore.set(cacheKey, collected);
    window.__catalogueLoaded = true;
  } catch (err) {
    // Offline, or the token expired: whatever the cache held is still on
    // screen, and an empty grid says so honestly.
    moviesLoaded = true;
    // Loaded as in "no longer changing under you". A failed load has stopped
    // just as surely as a finished one, and a waiter that only ever sees
    // success hangs on the case it most needs to survive.
    window.__catalogueLoaded = true;
    render({ keepDrawn: true });
    if (!MOVIES.length) toast('error', 'Каталог недоступний — перевір зʼєднання.');
  }
}

/**
 * Puts a film on my shelf, and into the catalogue if it is new to it.
 *
 * One call does both, and the ORDER is the Worker's business rather than
 * ours: it inserts the film only when `movies` has never seen that tmdb_id,
 * and never overwrites — putting a film on your own shelf must not rewrite a
 * record everybody reads. So a film already in the catalogue keeps whatever
 * enrichment it has, and the fields we send are simply ignored.
 *
 * The recommender rides along separately because it is NOT a fact about the
 * film: it belongs to this shelf, and the same film on somebody else's can
 * carry a different name.
 */
async function addFilmToMine(record, { collectionId = MY_FILMS_ID, collectionName = MY_FILMS_NAME } = {}) {
  const key = markKey(record);
  if (!key) throw new Error('фільм без TMDb-ідентифікатора');
  const film = { ...record };
  // Never travels into the shared catalogue — see above.
  delete film.recommended_by;
  const res = await fetch(collectionFilmUrl(API_PROXY, collectionId, key), {
    method: 'PUT',
    headers: await proxyHeaders({ accept: 'application/json', 'content-type': 'application/json' }),
    body: JSON.stringify({ name: collectionName, film, recommended_by: record.recommended_by || undefined }),
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `HTTP ${res.status}`);
  }
  // The catalogue in memory is a copy of a query, so it does not learn about
  // the new film on its own. Adding it here keeps the duplicate check, the
  // chips and the counts honest until the next load.
  if (!MOVIES.some(m => markKey(m) === key)) MOVIES.push(record);
  mine.add(key);
  return res;
}

// TMDb genre id -> our own genre/genre_group taxonomy (see GENRE_ORDER above)
// TMDB_GENRE_MAP, mapGenre(), slugify() now live in src/logic.js (loaded before this file).
async function tmdbFetch(path, params = {}) {
  const url = new URL(API_PROXY + '/tmdb/3' + path);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url, { headers: await proxyHeaders({ accept: 'application/json' }) });
  if (!res.ok) throw new Error(`TMDb ${res.status}`);
  return res.json();
}
async function tmdbSearch(query, year) {
  const params = { query, language: 'uk-UA', include_adult: 'false' };
  if (year) params.year = year;
  const data = await tmdbFetch('/search/multi', params);
  return (data.results || [])
    .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
    .slice(0, 6);
}
// pickTrailer() now lives in src/logic.js — it is pure (no DOM/fetch) and
// scripts/backfill-trailer-links.js needs the exact same selection rule
// Node-side, so it moved rather than being copied.
// critic_score/awards data source (see extractCriticScore()/
// parseOmdbAwardsSummary() in src/logic.js) — TMDb has neither. Best-effort:
// a title OMDb doesn't have, or a network hiccup, just leaves these fields
// empty rather than failing the whole add-movie flow.
// The year is a PREFERENCE, not a filter. OMDb's `y` matches exactly, and
// OMDb and TMDb routinely disagree by one year — TMDb dates a film by its
// earliest release (a festival premiere), OMDb by the wide one. Casablanca
// is TMDb 1942 and OMDb 1943, so asking with the year found nothing and the
// film silently ended up with no critic score and no awards. So: ask with
// the year (it disambiguates remakes), and if that finds nothing, ask again
// without it and check the year that comes back is close enough to be the
// same film — see omdbYearAcceptable() in logic.js.
async function fetchOmdbData(titleEn, titleUk, year, kind) {
  const title = titleEn || titleUk;
  if (!title) return null;
  // Set by ask() when OMDb says the daily allowance is gone. Retrying a
  // year-less lookup then just walks into the same wall.
  let quotaHit = false;
  const ask = async (withYear) => {
    const url = new URL(API_PROXY + '/omdb/');
    url.searchParams.set('t', title);
    if (withYear && year) url.searchParams.set('y', year);
    url.searchParams.set('type', kind === 'tv' ? 'series' : 'movie');
    const res = await fetch(url, { headers: await proxyHeaders() });
    const data = await res.json();
    // A body with no `Response` field is not an OMDb answer — it is a proxy
    // error (401, 429, upstream failure). Treating it as data would show the
    // film as simply having no critic score, which is a different claim.
    if (!isOmdbAnswer(data)) return null;
    // A quota refusal is NOT a fact about this film. Adding a movie must
    // never fail — or even mention it — because OMDb's daily allowance ran
    // out: the critic score simply stays empty and the catalog job picks it
    // up on a later day (see the nightly enrichment run).
    if (isOmdbQuotaExhausted(data)) { quotaHit = true; return null; }
    if (data.Response === 'False') return null;
    // OMDb's `t=` is a fuzzy search: asked for "I Care a Lot" it has
    // answered with a podcast episode whose name contains those words. A
    // result that is not actually this title must be discarded, not written
    // onto the film — see omdbTitleMatches() in logic.js.
    return omdbTitleMatches(data.Title, title) ? data : null;
  };
  try {
    const exact = await ask(true);
    if (exact) return exact;
    if (quotaHit || !year) return null;
    const loose = await ask(false);
    return loose && omdbYearAcceptable(loose.Year, year) ? loose : null;
  } catch (err) {
    return null;
  }
}
// Per-category award detail (OMDb's "Awards" field is counts only) — see
// buildWikidataAwardsQuery()/parseWikidataAwards() (src/logic.js) for why
// this is two UNIONed shapes, not one. imdbId comes from the OMDb response
// we already fetched (its own `imdbID` field), so this never needs its
// own title-matching lookup. Best-effort, same as the OMDb call: no
// category data for this title, or a network hiccup, just means
// awards_won/nominated fall back to OMDb's plain counts (see tmdbDetails).
async function fetchWikidataAwardCategories(imdbId) {
  if (!imdbId || !/^tt\d+$/.test(imdbId)) return null;
  try {
    const url = `${API_PROXY}/wikidata/sparql?format=json&query=${encodeURIComponent(buildWikidataAwardsQuery(imdbId))}`;
    const res = await fetch(url, { headers: await proxyHeaders({ Accept: 'application/sparql-results+json' }) });
    if (!res.ok) return null;
    const data = await res.json();
    return parseWikidataAwards(data.results && data.results.bindings);
  } catch (err) {
    return null;
  }
}
// Enforces the "actor names in Latin script only, no hieroglyphs" rule
// (CONVENTIONS.md) for names pulled fresh from TMDb credits. hasCJKScript()/
// pickLatinPersonName() are pure (src/logic.js); this wrapper does the
// actual network lookup, and — same policy as the deploy-time migration in
// scripts/migrate-actor-names.js — drops an actor entirely rather than
// ever saving a name with hieroglyphs if no Latin alias can be found.
async function resolveLatinCastNames(entries) {
  const out = [];
  for (const c of (entries || [])) {
    if (!c || !c.name) continue;
    if (!hasCJKScript(c.name)) { out.push(c.name); continue; }
    if (!c.id) continue; // no person id to look up -> can't safely resolve, drop
    try {
      const details = await tmdbFetch(`/person/${c.id}`, { language: 'en-US' });
      const latin = pickLatinPersonName(details);
      if (latin) out.push(latin);
    } catch (err) { /* lookup failed -> drop rather than risk hieroglyphs */ }
  }
  return out;
}
// Free, no-key translation fallback (client-side call, runs in the visitor's
// browser — not something we can bundle a paid key for). Best-effort only:
// if it fails or is unreachable we just keep the English text.
async function translateToUk(text) {
  if (!text) return '';
  try {
    const chunk = text.slice(0, 480);
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=en|uk`;
    const res = await fetch(url);
    const data = await res.json();
    const t = data && data.responseData && data.responseData.translatedText;
    // MyMemory sometimes "fails silently": an all-caps error string, or a
    // transliteration of the English text into Latin letters instead of an
    // actual Ukrainian (Cyrillic) translation. Reject both — a bad Latin
    // guess in the Ukrainian-title field is worse than just keeping English.
    return (t && !/^[A-Z ]+$/.test(t) && /[а-яіїєґ]/i.test(t)) ? t : '';
  } catch (err) {
    return '';
  }
}
// TMDb's own uk-UA "title" field is often just the original/English title
// with no translation on file. The actual Ukrainian *distribution* title
// (what's on the poster in Ukrainian cinemas — can be quite different from
// a literal translation) lives in alternative_titles under country UA.
// We prefer that over the plain uk-UA localized title whenever it exists.
async function fetchUaReleaseTitle(kind, id) {
  try {
    const data = await tmdbFetch(`/${kind}/${id}/alternative_titles`, {});
    const list = data.results || data.titles || [];
    const ua = list.find(t => t.iso_3166_1 === 'UA' && t.title && t.title.trim());
    return ua ? ua.title.trim() : '';
  } catch (err) {
    return '';
  }
}
async function tmdbDetails(id, mediaType) {
  const kind = mediaType === 'tv' ? 'tv' : 'movie';
  const [dUk, uaReleaseTitle] = await Promise.all([
    tmdbFetch(`/${kind}/${id}`, { language: 'uk-UA', append_to_response: 'credits,videos' }),
    fetchUaReleaseTitle(kind, id),
  ]);

  let overview = dUk.overview || '';
  let overviewTranslated = false;
  let trailer = pickTrailer(dUk.videos && dUk.videos.results);

  // Trailer fallback chain: uk -> ru (often the only dubbed trailer that
  // exists on YouTube for these titles) -> en.
  if (!trailer) {
    try {
      const dRu = await tmdbFetch(`/${kind}/${id}`, { language: 'ru-RU', append_to_response: 'videos' });
      trailer = pickTrailer(dRu.videos && dRu.videos.results);
    } catch (err) { /* ignore, fall through to en */ }
  }

  let dEn = null;
  if (!trailer || !overview) {
    try {
      dEn = await tmdbFetch(`/${kind}/${id}`, { language: 'en-US', append_to_response: 'credits,videos' });
    } catch (err) { /* ignore */ }
  }
  if (!trailer && dEn) trailer = pickTrailer(dEn.videos && dEn.videos.results);
  if (!overview && dEn && dEn.overview) {
    const translated = await translateToUk(dEn.overview);
    overview = translated || dEn.overview;
    overviewTranslated = !!translated;
  }

  const d = dUk;
  const titleEn = kind === 'tv' ? d.original_name : d.original_title;
  let titleUk = uaReleaseTitle || (kind === 'tv' ? d.name : d.title);
  let titleTranslated = false;
  // No official Ukrainian release title and no TMDb-supplied uk translation
  // (titleUk just falls back to the original) — try machine-translating the
  // title itself, shown as "Переклад (Оригінал)" so it's clearly a guess.
  if (!uaReleaseTitle && titleEn && (!titleUk || titleUk.trim().toLowerCase() === titleEn.trim().toLowerCase())) {
    const translated = await translateToUk(titleEn);
    if (translated && translated.trim().toLowerCase() !== titleEn.trim().toLowerCase()) {
      titleUk = `${translated} (${titleEn})`;
      titleTranslated = true;
    }
  }
  const yearStr = (kind === 'tv' ? d.first_air_date : d.release_date) || '';
  const year = yearStr ? parseInt(yearStr.slice(0, 4), 10) : null;
  // The details response carries original_language and origin_country, and
  // both are needed: anime is animation FROM JAPAN, and without them a
  // Studio Ghibli film files itself as a cartoon (see primaryGenre).
  const { genre, group } = mapGenre(d.genres ? d.genres.map(g => g.id) : [], d);
  // uk-UA response already localizes country names when TMDb has a
  // translation on file; dEn (fetched for a missing trailer/overview
  // anyway, see above) is just the fallback when the uk-UA response has
  // no production_countries at all.
  const countryNames = (d.production_countries || (dEn && dEn.production_countries) || []).map(c => c.name).filter(Boolean);
  const country = countryNames.length ? countryNames.join(', ') : undefined;
  let castRaw = ((d.credits && d.credits.cast) || []).slice(0, 5).map(c => ({ id: c.id, name: c.name }));
  if (!castRaw.length && dEn) castRaw = ((dEn.credits && dEn.credits.cast) || []).slice(0, 5).map(c => ({ id: c.id, name: c.name }));
  const [cast, omdb] = await Promise.all([
    resolveLatinCastNames(castRaw),
    fetchOmdbData(titleEn, titleUk, year, kind),
  ]);
  const criticScore = extractCriticScore(omdb);
  // Both sources merged, not either/or — Wikidata for the categories, OMDb
  // for the authoritative count, padding any ceremony Wikidata only
  // partially detailed (see mergeAwardSources() in src/logic.js).
  const wikidataAwards = omdb ? await fetchWikidataAwardCategories(omdb.imdbID) : null;
  const mergedAwards = mergeAwardSources(
    wikidataAwards,
    omdb ? parseOmdbAwardsSummary(omdb.Awards) : null
  );
  // Language rule: the category half must read in Ukrainian. Whatever
  // Wikidata happened to return goes through the check-then-translate rule
  // (ensureUkrainian(), src/logic.js) rather than a list of known strings.
  const [awardsWon, awardsNominated] = await Promise.all([
    localizeAwardCategories(mergedAwards.won, translateToUk),
    localizeAwardCategories(mergedAwards.nominated, translateToUk),
  ]);
  return {
    // The film's identity, and the only durable one. Everything the app
    // stores about a film — a mark, a place in a collection — is a reference
    // to this id. It was missing until now, which is why a handful of
    // catalogue records still have none and cannot be marked at all.
    tmdb_id: Number(id) || undefined,
    // The DISPLAY id: it is what the DOM and the URL use, and it reads. It
    // is derived from a title somebody can edit, so nothing durable hangs
    // off it.
    id: slugify(titleEn, titleUk, year),
    canonical_title_uk: titleUk || titleEn || 'Без назви',
    canonical_title_en: titleEn || undefined,
    year: year || undefined,
    type: kind === 'tv' ? 'серіал' : 'фільм',
    genre, genre_group: group,
    country,
    rating: d.vote_average ? `TMDb ${d.vote_average.toFixed(1)}` : undefined,
    critic_score: criticScore,
    description_uk: overview,
    _overviewTranslated: overviewTranslated, // internal flag, not saved to Firebase
    _titleTranslated: titleTranslated, // internal flag, not saved to Firebase
    poster_url: d.poster_path ? (TMDB_IMG + d.poster_path) : undefined,
    trailer_url: trailer ? `https://www.youtube.com/watch?v=${trailer.key}` : undefined,
    cast,
    // Grouped on the way in as well, so a film reaches the confirm form in
    // the same shape it will be stored — one format from fetch to save.
    awards_won: awardsWon.length ? groupAwardsByCeremony(awardsWon) : undefined,
    awards_nominated: awardsNominated.length ? groupAwardsByCeremony(awardsNominated) : undefined,
  };
}

// Crop the image down to just the region where text was actually found,
// trimming empty space above/below (and the sides). Returns null if we
// can't get a useful bounding box (e.g. nothing recognized, or the box is
// basically the whole image already — nothing to gain from cropping).
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
async function cropToTextRegion(file, words) {
  const good = (words || []).filter(w => w.confidence > 35 && (w.text || '').trim());
  if (!good.length) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const w of good) {
    const b = w.bbox;
    minX = Math.min(minX, b.x0); minY = Math.min(minY, b.y0);
    maxX = Math.max(maxX, b.x1); maxY = Math.max(maxY, b.y1);
  }
  const img = await loadImageFromFile(file);
  // if the text already spans almost the whole image, cropping won't help
  if ((maxY - minY) > img.height * 0.9) return null;
  const padY = Math.round((maxY - minY) * 0.2) + 14;
  const padX = Math.round((maxX - minX) * 0.1) + 14;
  const cropX = Math.max(0, minX - padX);
  const cropY = Math.max(0, minY - padY);
  const cropW = Math.min(img.width - cropX, (maxX - minX) + padX * 2);
  const cropH = Math.min(img.height - cropY, (maxY - minY) + padY * 2);
  if (cropW < 20 || cropH < 20) return null;
  const canvas = document.createElement('canvas');
  canvas.width = cropW; canvas.height = cropH;
  canvas.getContext('2d').drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
  return new Promise(resolve => canvas.toBlob(blob => resolve(blob), 'image/png'));
}

// Titles are often wrapped in quotes inside captions/comments — «Назва»,
// "Назва", 'Назва', ‘Назва’, or with the Ukrainian apostrophe-style marks ʼ —
// or introduced by a trigger word like "фільм:", "серіал", "movie", "кино" etc,

// line), pull out anything that looks like a title from several patterns,
// then run the junk-stripping pass more than once (edge punctuation can

// plausible movie-name-shaped strings remain.
// TITLE_TRIGGER_WORDS, UI_JUNK_PHRASES, isJunkLine(), cleanCandidate(),

async function runSearch(title, year) {
  const resultsEl = addBox.querySelector('#addResults');
  resultsEl.innerHTML = '<div class="add-hint">Шукаю…</div>';
  try {
    let results = await tmdbSearch(title, year);
    // A year is an exact filter at TMDb, exactly as it is at OMDb, and the
    // two databases disagree about release years for the same reasons — a
    // festival premiere in one and the wide release in the other. Asking
    // again without it turns "нічого не знайдено" into a result far more
    // often than it turns up the wrong film.
    if (!results.length && year) results = await tmdbSearch(title, '');
    if (!results.length) {
      // Often the film is not missing, it is already here. Same fuzzy
      // matcher as the catalog search box, typos and all.
      const already = fuzzyCatalogSuggestions(MOVIES, title);
      resultsEl.innerHTML = already.length
        ? `<div class="add-hint">TMDb нічого не знайшов. Можливо, це вже є у твоєму каталозі:</div>
           <div class="candidate-list">${already.map(m => `
             <div class="candidate-item" data-existing="${esc(m.id)}">
               ${m.poster_url ? `<img src="${esc(m.poster_url)}">` : '<div class="candidate-noposter"></div>'}
               <div><div class="candidate-title">${esc(m.canonical_title_uk)}</div>
               <div class="candidate-year">${m.year ? esc(String(m.year)) : '—'} · ${esc(m.type || '')}</div></div>
             </div>`).join('')}</div>`
        : '<div class="add-hint">Нічого не знайдено. Спробуй іншу назву.</div>';
      resultsEl.querySelectorAll('[data-existing]').forEach(el => {
        el.addEventListener('click', () => {
          const m = MOVIES.find(x => x.id === el.dataset.existing);
          if (m) { closeAddModal(); openModal(m); }
        });
      });
      return;
    }
    resultsEl.innerHTML = '<div class="candidate-list"></div>';
    const list = resultsEl.querySelector('.candidate-list');
    results.forEach(r => {
      const t = r.media_type === 'tv' ? r.name : r.title;
      const y = ((r.media_type === 'tv' ? r.first_air_date : r.release_date) || '').slice(0, 4);
      const poster = r.poster_path ? TMDB_IMG + r.poster_path : '';
      const div = document.createElement('div');
      div.className = 'candidate-item';
      div.innerHTML = `${poster ? `<img src="${poster}">` : '<div class="candidate-noposter"></div>'}
        <div><div class="candidate-title">${t}</div><div class="candidate-year">${y || '—'} · ${r.media_type === 'tv' ? 'серіал' : 'фільм'}</div></div>`;
      div.addEventListener('click', () => showConfirm(r.id, r.media_type));
      list.appendChild(div);
    });
  } catch (err) {
    resultsEl.innerHTML = '<div class="add-hint">Помилка запиту до TMDb. Перевір ключ або спробуй пізніше.</div>';
  }
}

// ---------- "recommended by" field: dropdown of already-used names + "add new" ----------
function getKnownRecommenders() {
  const set = new Set();
  MOVIES.forEach(m => { if (m.recommended_by) set.add(m.recommended_by); });
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'uk'));
}
function recBySelectHtml(prefill) {
  const known = getKnownRecommenders();
  const pre = (prefill != null ? prefill : recommenderPrefill) || '';
  const preIsKnown = pre && known.includes(pre);
  const newSelected = !!pre && !preIsKnown;
  let html = `<select id="cfRecBySelect">`;
  html += `<option value="" ${!pre ? 'selected' : ''}>Без імені</option>`;
  known.forEach(name => {
    html += `<option value="${esc(name)}" ${name === pre ? 'selected' : ''}>${esc(name)}</option>`;
  });
  html += `<option value="__new__" ${newSelected ? 'selected' : ''}>+ Додати нове ім'я…</option>`;
  html += `</select>`;
  html += `<input id="cfRecByNew" type="text" placeholder="Нове ім'я" value="${newSelected ? esc(pre) : ''}" style="margin-top:8px${newSelected ? '' : ';display:none'}">`;
  return html;
}
function wireRecBySelect(root) {
  const sel = root.querySelector('#cfRecBySelect');
  const newInput = root.querySelector('#cfRecByNew');
  sel.addEventListener('change', () => {
    if (sel.value === '__new__') { newInput.style.display = ''; newInput.focus(); }
    else { newInput.style.display = 'none'; newInput.value = ''; }
  });
}
function readRecBy(root) {
  const sel = root.querySelector('#cfRecBySelect');
  if (sel.value === '__new__') return root.querySelector('#cfRecByNew').value.trim();
  return sel.value;
}

// Pure(ish) DOM step, split out from showConfirm() so it can be exercised
// directly with a ready-made `movie` object (no TMDb network call needed) —
// this is what actually builds and wires the "confirm & save" card,
// including the duplicate-catalog warning (see findDuplicateMovie in
// src/logic.js).
function renderConfirmCard(movie) {
  const resultsEl = addBox.querySelector('#addResults');
  // Two different questions, and they used to be one. `dup` is the film's
  // twin in the shared catalogue — worth finding, because saving against it
  // keeps one record per film. `exists` is whether it is on MY shelf, which
  // is what decides between "save" and "update": a film can sit in the
  // catalogue, visible to everyone, and not be mine at all.
  const dup = findDuplicateMovie(MOVIES, movie.canonical_title_uk, movie.canonical_title_en, movie.year);
  const exists = haveFilm(dup || movie);
  resultsEl.innerHTML = `
    <div class="confirm-card">
      ${movie.poster_url ? `<img src="${movie.poster_url}" class="confirm-poster">` : ''}
      <div class="confirm-body">
        <div class="add-hint">Рік, рейтинг, відсоток критиків, акторський склад і нагороди підтягуються автоматично (TMDb / OMDb / Wikidata) і показані лише для ознайомлення — редагувати їх не можна.</div>
        <label class="cf-label">Назва українською</label>
        ${movie._titleTranslated ? '<div class="add-hint">Офіційної української назви не знайдено — автоматичний переклад, можна відредагувати.</div>' : ''}
        <input id="cfTitleUk" type="text" value="${movie.canonical_title_uk.replace(/"/g, '&quot;')}">
        <label class="cf-label">Оригінальна назва</label>
        <input id="cfTitleEn" type="text" value="${(movie.canonical_title_en || '').replace(/"/g, '&quot;')}" placeholder="Оригінальна назва">
        <div class="confirm-row">
          <div>
            <label class="cf-label">Рік</label>
            <div class="cf-readonly">${movie.year ? esc(String(movie.year)) : '<span class="cf-empty">не вказано</span>'}</div>
          </div>
          <div>
            <label class="cf-label">Тип</label>
            <select id="cfType"><option value="фільм" ${movie.type==='фільм'?'selected':''}>фільм</option><option value="серіал" ${movie.type==='серіал'?'selected':''}>серіал</option></select>
          </div>
        </div>
        <div class="confirm-row">
          <div>
            <label class="cf-label">Рейтинг</label>
            <div class="cf-readonly">${movie.rating ? esc(movie.rating) : '<span class="cf-empty">не знайдено</span>'}</div>
          </div>
          <div>
            <label class="cf-label">Жанр</label>
            <select id="cfGroup">${GENRE_ORDER.map(g => `<option ${g===movie.genre_group?'selected':''}>${g}</option>`).join('')}</select>
          </div>
        </div>
        <label class="cf-label">Відсоток критиків</label>
        <div class="cf-readonly">${movie.critic_score !== undefined && movie.critic_score !== null ? esc(String(movie.critic_score)) + '%' : '<span class="cf-empty">не знайдено</span>'}</div>
        ${movie.trailer_url ? `<a class="btn cf-trailer" href="${esc(movie.trailer_url)}" target="_blank" rel="noopener">${ICON.play} Подивитись трейлер</a>` : '<div class="add-hint">Трейлер не знайдено.</div>'}
        <label class="cf-label">Опис</label>
        ${movie._overviewTranslated ? '<div class="add-hint">Автоматичний переклад з англійської — можна відредагувати.</div>' : ''}
        <textarea id="cfDesc" rows="4">${movie.description_uk}</textarea>
        <label class="cf-label">Акторський склад</label>
        <div class="cf-readonly">${(movie.cast || []).length ? esc((movie.cast || []).join(', ')) : '<span class="cf-empty">не знайдено</span>'}</div>
        ${readAwards(movie.awards_won).length ? `
        <label class="cf-label">Нагороди — перемоги</label>
        <div class="cf-readonly">${esc(readAwards(movie.awards_won).join(', '))}</div>` : ''}
        ${readAwards(movie.awards_nominated).length ? `
        <label class="cf-label">Нагороди — номінації</label>
        <div class="cf-readonly">${esc(readAwards(movie.awards_nominated).join(', '))}</div>` : ''}
        <label class="cf-label">Рекомендовано від</label>
        ${recBySelectHtml()}
        ${exists ? `<div class="warn-note">Такий фільм уже є у списку: «${esc(dup.canonical_title_uk)}»${dup.year ? ` (${dup.year})` : ''}. Онови його свіжими даними або збережи як окремий запис.</div>` : ''}
        <div class="modal-actions">
          <button class="btn" id="cfBack">← Назад</button>
          ${exists
            ? `<button class="btn" id="cfSaveCopy">Зберегти окремо</button>
               <button class="btn on-watched" id="cfSave">Оновити наявний</button>`
            : '<button class="btn on-watched" id="cfSave">Зберегти</button>'}
        </div>
      </div>
    </div>`;
  wireRecBySelect(resultsEl);
  resultsEl.querySelector('#cfBack').addEventListener('click', () => showResultsAgain());
  // Re-adding a film that is already in the catalog used to be a dead end:
  // a warning and a disabled button. Both outcomes people actually want are
  // now offered — refresh the existing record, or keep two separate ones.
  //
  // Updating IN PLACE matters more than it looks: it keeps the film's id,
  // and the id is what its "переглянуто"/"рекомендую" marks hang off. Saving
  // the fresh data under a new id would leave those marks pointing at the
  // old record and the person's history silently split in two.
  const saveHandler = (mode) => () => {
    const recBy = readRecBy(resultsEl);
    // Actor names: Latin script only (CONVENTIONS.md). Names arriving from
    // TMDb are already resolved by resolveLatinCastNames() above, but this
    // Enriched fields (year, rating, critic score, cast, awards) are shown
    // read-only, so they come from the fetched movie object rather than the
    // DOM — nothing to re-parse and nothing a stray keystroke could corrupt.
    // The Latin-script guard stays: TMDb itself can hand back a CJK name
    // that pickLatinPersonName() had no alias to replace.
    const castInput = movie.cast || [];
    const cast = castInput.filter(s => !hasCJKScript(s));
    const castDropped = castInput.length - cast.length;
    const awardsWon = readAwards(movie.awards_won);
    const awardsNom = readAwards(movie.awards_nominated);
    const criticScore = movie.critic_score;
    const finalMovie = {
      ...movie,
      canonical_title_uk: resultsEl.querySelector('#cfTitleUk').value.trim(),
      canonical_title_en: resultsEl.querySelector('#cfTitleEn').value.trim() || undefined,
      year: movie.year || undefined,
      type: resultsEl.querySelector('#cfType').value,
      genre_group: resultsEl.querySelector('#cfGroup').value,
      rating: movie.rating || undefined,
      critic_score: criticScore,
      description_uk: resultsEl.querySelector('#cfDesc').value.trim(),
      cast: cast.length ? cast : undefined,
      // Stored grouped by ceremony: the name lives once, as a key, and
      // each entry is only the category — so re-enrichment never re-
      // translates a ceremony name it already knows (see logic.js).
      awards_won: awardsWon.length ? groupAwardsByCeremony(awardsWon) : undefined,
      awards_nominated: awardsNom.length ? groupAwardsByCeremony(awardsNom) : undefined,
      recommended_by: recBy || undefined,
    };
    delete finalMovie._overviewTranslated;
    delete finalMovie._titleTranslated;
    Object.keys(finalMovie).forEach(k => finalMovie[k] === undefined && delete finalMovie[k]);
    const record = mode === 'update'
      ? mergeRefreshedMovie(dup, { ...finalMovie, id: dup.id })
      : mode === 'copy'
        ? { ...finalMovie, id: uniqueMovieId(finalMovie.id, MOVIES) }
        : finalMovie;

    const saveBtn = resultsEl.querySelector(mode === 'copy' ? '#cfSaveCopy' : '#cfSave');
    const savedLabel = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Зберігаю…';
    addFilmToMine(record).then(() => {
      const castNote = castDropped > 0
        ? ` (${castDropped} ${castDropped === 1 ? 'ім\'я актора прибрано' : 'імені акторів прибрано'} — лише латиницею, без ієрогліфів)`
        : '';
      const what = mode === 'update' ? 'оновлено' : 'збережено';
      toast('success', `«${record.canonical_title_uk}» ${what}${castNote}`);
      closeAddModal();
    }).catch(err => {
      saveBtn.disabled = false;
      saveBtn.textContent = savedLabel;
      const msg = (err && err.message) || 'невідома помилка';
      toast('error', `Не вдалося зберегти: ${msg}`);
      resultsEl.insertAdjacentHTML('beforeend', `<div class="warn-note">Не вдалося зберегти: ${msg}.</div>`);
    });
  };
  resultsEl.querySelector('#cfSave').addEventListener('click', saveHandler(exists ? 'update' : 'new'));
  const copyBtn = resultsEl.querySelector('#cfSaveCopy');
  if (copyBtn) copyBtn.addEventListener('click', saveHandler('copy'));
}
function showResultsAgain() {

    const ti = addBox.querySelector('#addTitle');

    ti.dispatchEvent(new Event('input', { bubbles: true }));
    const rb = addBox.querySelector('#addRecBy');
    if (rb && recommenderPrefill) { rb.value = recommenderPrefill; rb.dispatchEvent(new Event('input', { bubbles: true })); }
    runSearch(title, '');

}

/* ---------- batch (multi-title) search ---------- */
// parseBatchLine() now lives in src/logic.js (loaded before this file).

async function runBatchSearch(lines, recommendedBy) {
  const resultsEl = addBox.querySelector('#addResults');
  resultsEl.innerHTML = '<div class="add-hint">Шукаю всі назви…</div>';
  const rows = await Promise.all(lines.map(async (line, i) => {
    const { title, year } = parseBatchLine(line);
    try {
      const results = await tmdbSearch(title, year);
      return { line, title, year, results, chosen: 0 };
    } catch (err) {
      return { line, title, year, results: [], chosen: 0, error: true };
    }
  }));
  renderBatchRows(rows, recommendedBy);
}

function renderBatchRows(rows, recommendedBy) {
  const resultsEl = addBox.querySelector('#addResults');
  resultsEl.innerHTML = `
    <div class="batch-list"></div>
    <div class="modal-actions"><button class="btn on-watched" id="batchSaveBtn">Зберегти позначені</button></div>`;
  const listEl = resultsEl.querySelector('.batch-list');
  rows.forEach((row, i) => {
    const r = row.results[row.chosen];
    const t = r ? (r.media_type === 'tv' ? r.name : r.title) : null;
    const y = r ? ((r.media_type === 'tv' ? r.first_air_date : r.release_date) || '').slice(0, 4) : '';
    const poster = r && r.poster_path ? TMDB_IMG + r.poster_path : '';
    // "Already mine", by TMDb id — the id the search result already carries,
    // so no details call is needed. Checking the shared catalogue instead
    // would flag nearly every film, since the whole of it is on screen.
    const alreadyMine = !!(r && r.id && mine.has(String(r.id)));
    const dup = alreadyMine ? (MOVIES.find(m => markKey(m) === String(r.id)) || { canonical_title_uk: t, year: y }) : null;
    row.dup = !!dup;
    const div = document.createElement('div');
    div.className = 'batch-row';
    div.innerHTML = `
      <input type="checkbox" class="batch-check" ${r && !dup ? 'checked' : ''} ${r ? '' : 'disabled'} ${dup ? 'disabled' : ''}>
      ${poster ? `<img src="${poster}">` : '<div class="candidate-noposter"></div>'}
      <div class="batch-info">
        <div class="candidate-title">${row.line}</div>
        ${r
          ? `<select class="batch-alt">${row.results.map((res, ri) => {
              const rt = res.media_type === 'tv' ? res.name : res.title;
              const ry = ((res.media_type === 'tv' ? res.first_air_date : res.release_date) || '').slice(0, 4);
              return `<option value="${ri}" ${ri===row.chosen?'selected':''}>${rt} (${ry || '—'}, ${res.media_type === 'tv' ? 'серіал' : 'фільм'})</option>`;
            }).join('')}</select>`
          : `<div class="warn-note">${row.error ? 'Помилка запиту' : 'Нічого не знайдено'}</div>`}
        ${dup ? `<div class="warn-note">Такий фільм уже є у списку: «${esc(dup.canonical_title_uk)}»${dup.year ? ` (${dup.year})` : ''}.</div>` : ''}
      </div>`;
    if (r) {
      div.querySelector('.batch-alt').addEventListener('change', e => {
        row.chosen = parseInt(e.target.value, 10);
        renderBatchRows(rows, recommendedBy);
      });
    }
    listEl.appendChild(div);
  });
  resultsEl.querySelector('#batchSaveBtn').addEventListener('click', async () => {
    const btn = resultsEl.querySelector('#batchSaveBtn');
    btn.disabled = true;
    btn.textContent = 'Зберігаю…';
    const checks = listEl.querySelectorAll('.batch-check');
    let saved = 0, dupSkipped = 0, otherSkipped = 0;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const r = row.results[row.chosen];
      if (row.dup) { dupSkipped++; continue; }
      if (!r || !checks[i].checked) { otherSkipped++; continue; }
      try {
        const movie = await tmdbDetails(r.id, r.media_type);
        // Skipped only when it is already MINE. A film merely present in the
        // shared catalogue is exactly the case this flow exists to handle.
        if (haveFilm(movie)) { dupSkipped++; continue; }
        delete movie._overviewTranslated;
        delete movie._titleTranslated;
        if (recommendedBy) movie.recommended_by = recommendedBy;
        Object.keys(movie).forEach(k => movie[k] === undefined && delete movie[k]);
        await addFilmToMine(movie);
        saved++;
      } catch (err) { otherSkipped++; }
    }
    const skipped = dupSkipped + otherSkipped;
    const skipDetail = dupSkipped ? ` (дублікатів: ${dupSkipped}${otherSkipped ? `, інших: ${otherSkipped}` : ''})` : '';
    btn.textContent = `Готово: збережено ${saved}, пропущено ${skipped}${skipDetail}`;
    if (saved > 0 && skipped === 0) toast('success', `Збережено ${saved} ${saved === 1 ? 'фільм' : 'фільмів'}`);
    else if (saved > 0) toast('success', `Збережено ${saved}, пропущено ${skipped}${skipDetail}`);
    else toast('error', `Нічого не збережено (пропущено ${skipped}${skipDetail})`);
  });
}

function openAddModal() { addModalHome(); addOverlay.classList.add('open'); lockScroll(); }
function closeAddModal() { addOverlay.classList.remove('open'); unlockScroll(); }
/* ---------- delete mode ----------
 * Entering the mode does not select anything and does not touch data; the
 * only irreversible step is the confirm, and it happens once for the whole
 * selection. Leaving the mode always clears the selection, so a stale pick
 * can never be carried back in and deleted later by accident.
 */
const deleteModeBtn = document.getElementById('deleteModeBtn');
const deleteBar = document.getElementById('deleteBar');
const deleteCountEl = document.getElementById('deleteCount');
const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');
const deleteCancelBtn = document.getElementById('deleteCancelBtn');

function setDeleteMode(on) {
  deleteMode = on;
  selectedForDelete.clear();
  document.body.classList.toggle('delete-mode', on);
  deleteModeBtn.setAttribute('aria-pressed', String(on));
  deleteBar.hidden = !on;
  renderDeleteBar();
  // keepDrawn: entering the mode changes how cards LOOK, not which films are
  // listed, so someone who had scrolled keeps their place.
  render({ keepDrawn: true });
}

function toggleDeleteSelection(id) {
  if (!id) return;
  const on = !selectedForDelete.has(id);
  on ? selectedForDelete.add(id) : selectedForDelete.delete(id);
  renderDeleteBar();
  // One card changed, so touch one card. This used to re-render the whole
  // catalogue to flip a single checkmark — thirteen thousand cards rebuilt
  // per tap once an account held that many, which is what made selecting a
  // card time out in CI.
  const card = document.querySelector(`.card[data-id="${cssAttr(id)}"]`);
  if (!card) return;
  card.classList.toggle('is-selected', on);
  const mark = card.querySelector('.card-select-mark');
  if (mark) mark.innerHTML = on ? ICON.check : '';
}

function renderDeleteBar() {
  const n = selectedForDelete.size;
  deleteCountEl.textContent = n
    ? `Вибрано ${n} ${pluralFilms(n)}`
    : 'Обери фільми, які треба видалити';
  deleteConfirmBtn.disabled = n === 0;
}

async function deleteSelected() {
  const ids = [...selectedForDelete];
  if (!ids.length) return;
  const chosen = ids.map(id => MOVIES.find(m => m.id === id)).filter(Boolean);
  if (!window.confirm(deleteConfirmMessage(chosen))) return;

  deleteConfirmBtn.disabled = true;
  try {
    // Removal takes the film off MY shelf. It stays in the catalogue, which
    // is the whole point of there being one: another person may hold it, and
    // nobody gets to empty the shelf everybody reads.
    //
    // This also retires the orphaned-mark problem rather than guarding
    // against it. Marks used to hang off a per-account catalogue, so deleting
    // a film left its "watched" counted forever against something nobody
    // could see. A mark now belongs to the film, and the film has not gone
    // anywhere — so the mark is still true, and still points at something
    // real.
    await Promise.all(chosen.map(m => removeFilmFromMine(m)));
    toast('ok', `Прибрано ${chosen.length} ${pluralFilms(chosen.length)}`);
    setDeleteMode(false);
  } catch (err) {
    // The one place a silent failure is worst: the user believes the film is
    // gone and it is not.
    toast('err', 'Не вдалося прибрати — спробуй ще раз');
    deleteConfirmBtn.disabled = false;
  }
}

/** Takes one film off my shelf. The catalogue keeps it — see deleteSelected. */
async function removeFilmFromMine(movie, collectionId = MY_FILMS_ID) {
  const key = markKey(movie);
  if (!key) throw new Error('фільм без TMDb-ідентифікатора');
  const res = await fetch(collectionFilmUrl(API_PROXY, collectionId, key), {
    method: 'DELETE',
    headers: await proxyHeaders({ accept: 'application/json' }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  mine.delete(key);
  return res;
}

deleteModeBtn.addEventListener('click', () => setDeleteMode(!deleteMode));
deleteCancelBtn.addEventListener('click', () => setDeleteMode(false));
deleteConfirmBtn.addEventListener('click', deleteSelected);
