      .catch(() => { box.checked = !box.checked; toast('error', 'Не вдалося зберегти'); });
  });
  accountBox.querySelector('#accCloseBtn').addEventListener('click', closeAccount);
  accountBox.querySelector('#accGuideBtn').addEventListener('click', () => { closeAccount(); openOnboarding(); });
  const passForm = accountBox.querySelector('#accPassForm');
  if (passForm) passForm.addEventListener('submit', e => {
    e.preventDefault();
    const cur = accountBox.querySelector('#accCur').value;
    const next = accountBox.querySelector('#accNew').value;
    const btn = accountBox.querySelector('#accPassBtn');
    btn.disabled = true;
    // Firebase requires a RECENT sign-in before a password change, so the
    // current password is asked for and used to re-authenticate first —
    // without it updatePassword() fails with requires-recent-login for
    // anyone whose session is more than a few minutes old, i.e. everyone.
    const user = auth.currentUser;
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
    user.reauthenticateWithCredential(cred)
      .then(() => user.updatePassword(next))
      .then(() => { toast('success', 'Пароль змінено'); closeAccount(); })
      .catch(err => {
        const code = err && err.code;
        toast('error', code === 'auth/wrong-password' || code === 'auth/invalid-credential'
          ? 'Поточний пароль невірний'
          : (code === 'auth/weak-password' || code === 'auth/password-does-not-meet-requirements')
            ? 'Пароль: щонайменше 8 символів, велика й мала літери, цифра і символ.'
            : 'Не вдалося змінити пароль');
      })
      .finally(() => { btn.disabled = false; });
  });
  accountOverlay.classList.add('open');
  lockScroll();
}
function closeAccount() { accountOverlay.classList.remove('open'); unlockScroll(); }

function openOnboarding() {
  onboardBox.innerHTML = `
    <div class="acc-row"><span class="wordmark">SeenIt</span></div>
    <div class="onb-step"><div class="onb-step-n">1</div><p>Знайди фільм у каталозі або додай новий кнопкою <b>NEW</b> — рік, акторів, оцінки критиків і нагороди підтягнуться самі.</p></div>
    <div class="onb-step"><div class="onb-step-n">2</div><p>Познач переглянуте оком, а те, що радиш іншим, — серцем. Вкладка «Дивився» ховає переглянуте, «Рекомендую» збирає твої поради.</p></div>
    <div class="onb-step"><div class="onb-step-n">3</div><p>Не знаєш, з чого почати? Нижче — топ-20 фільмів, які фанати кіно дивляться просто зараз. Оновлюється щодня. Тисни на постер, щоб додати.</p></div>
    <div class="acc-label">Топ-20 зараз</div>
    <div class="trend-updated" id="trendUpdated"></div>
    <div class="trend-grid" id="trendGrid"><div class="add-hint">Завантажую…</div></div>
    <div class="acc-label">Або випадкова рекомендація з добірки</div>
    <div id="poolPick"><div class="add-hint">Завантажую…</div></div>
    <div class="acc-actions"><button class="btn on-watched" id="onbDoneBtn">Зрозуміло, поїхали</button></div>`;
  onboardBox.querySelector('#onbDoneBtn').addEventListener('click', () => closeOnboarding());
  renderTrending();
  rollPoolPick();
  onboardOverlay.classList.add('open');
  lockScroll();
}

function closeOnboarding() {
  onboardOverlay.classList.remove('open');
  unlockScroll();
  // Recorded on close, not on open: an accidental flash of the overlay
  // must not count as having read the guide.
  const user = auth.currentUser;
  if (user && userMarksPath(user.uid, 'watched')) {
    db.ref(`kino/users/${user.uid}/onboarded`).set(true).catch(() => {});
  }
}

function renderTrending() {
  const grid = onboardBox.querySelector('#trendGrid');
  db.ref('kino/trending').once('value').then(snap => {
    const data = snap.val();
    const movies = (data && data.movies) || [];
    if (!movies.length) {
      grid.innerHTML = '<div class="add-hint">Список ще формується — зазирни пізніше.</div>';
      return;
    }
    const updated = onboardBox.querySelector('#trendUpdated');
    if (updated && data.updated_at) {
      updated.textContent = `Оновлено ${new Date(data.updated_at).toLocaleDateString('uk-UA')} · TMDb + iTunes`;
    }
    grid.innerHTML = movies.map((m, i) => `
      <div class="trend-item" data-idx="${i}">
        ${m.poster_url ? `<img src="${esc(m.poster_url)}" alt="" loading="lazy">` : '<div class="trend-noposter">🎬</div>'}
        <div class="trend-rank">${m.rank}</div>
        ${haveFilm(m) ? '<div class="trend-have">Є</div>' : ''}
        <div class="trend-title">${esc(m.title_uk || m.title_en || '')}</div>
        <div class="trend-year">${m.year ? esc(String(m.year)) : ''}</div>
      </div>`).join('');
    grid.querySelectorAll('.trend-item').forEach(el => {
      el.addEventListener('click', () => {
        const m = movies[Number(el.dataset.idx)];
        if (!m) return;
        closeOnboarding();
        openExternalPick(m);
      });
    });
  }).catch(() => {
    grid.innerHTML = '<div class="add-hint">Не вдалося завантажити список. Спробуй пізніше.</div>';
  });
}

/* ---------- the shared recommendation pool (D1) ----------
 * Used to be the WHOLE kino/movies node — 13,000+ Firebase records pulled
 * into browser memory just to pick ONE random entry (a standing ROADMAP
 * item). The Worker's D1 mirror of that same pool does the random pick
 * server-side instead (ORDER BY RANDOM() LIMIT 1 — see /pool/random in
 * seenit-backend), so the browser fetches exactly one film.
 *
 * This is the ONLY thing that moved. The pool is read-only reference data
 * here (description, cast, critic score, awards already enriched) — never
 * written from the browser. Everything that IS written from the browser —
 * the person's own catalog, watched/liked marks, auth — stays Firebase,
 * unchanged. Firebase also stays where the pool itself is authored (nightly
 * enrichment, genome import); a sync job mirrors it into D1, and this only
 * changes where the APP reads it from.
 */
function rollPoolPick() {
  const box = onboardBox.querySelector('#poolPick');
  if (!box) return;
  // Every roll is a network round-trip now (there is no whole-pool cache to
  // pick from locally any more), so the button needs a visible "it's doing
  // something" state instead of looking stuck between click and response.
  box.innerHTML = '<div class="add-hint">Підбираю…</div>';
  proxyHeaders().then(headers => fetch(`${API_PROXY}/pool/random?count=1`, { headers }))
    .then(res => { if (!res.ok) throw new Error(`pool/random -> HTTP ${res.status}`); return res.json(); })
    .then(data => {
    const m = data.films && data.films[0];
    if (!m) {
      box.innerHTML = '<div class="add-hint">Добірка порожня.</div>';
      return;
    }
    const own = haveFilm(m);
    box.innerHTML = `
      <div class="pool-card" data-id="${esc(m.id)}">
        ${m.poster_url ? `<img class="pool-poster" src="${esc(m.poster_url)}" alt="">` : '<div class="pool-poster trend-noposter">🎬</div>'}
        <div class="pool-body">
          <div class="pool-title">${esc(m.canonical_title_uk || m.canonical_title_en || '')}</div>
          <div class="trend-year">${esc(m.type || '')}${m.year ? ` · ${esc(String(m.year))}` : ''}${m.rating ? ` · ${esc(m.rating)}` : ''}</div>
          <div class="pool-desc">${esc((m.description_uk || '').slice(0, 140))}${(m.description_uk || '').length > 140 ? '…' : ''}</div>
          <div class="acc-actions">
            ${own
              ? '<span class="add-hint">Уже у твоєму каталозі.</span>'
              : `<button class="btn on-watched" id="poolAddBtn">Додати собі</button>`}
            <button class="btn" id="poolRollBtn">Ще раз</button>
          </div>
        </div>
      </div>`;
    const addBtn = box.querySelector('#poolAddBtn');
    if (addBtn) addBtn.addEventListener('click', () => {
      addBtn.disabled = true;
      // The pool record is already complete and enriched — a straight copy,
      // not a re-fetch. The only thing that must NOT travel is another
      // person's recommendation note.
      const record = { ...m };
      delete record.recommended_by;
      addFilmToMine(record).then(() => {
        toast('success', `«${record.canonical_title_uk}» додано до твоїх фільмів`);
        rollPoolPick();
      }).catch(() => {
        toast('error', 'Не вдалося додати — спробуй ще раз');
        addBtn.disabled = false;
      });
    });
    box.querySelector('#poolRollBtn').addEventListener('click', rollPoolPick);
  }).catch(() => {
    box.innerHTML = '<div class="add-hint">Добірка недоступна. Спробуй пізніше.</div>';
  });
}

/**
 * Shared routing for a film picked from any external list (trending,
 * toplists). Membership is decided against MY SHELF at click time — the list
 * is the same for everybody, so a flag stored in it would answer for the
 * wrong person. A film I already hold opens its own card; a new one routes
 * through the NORMAL add flow rather than saving the thin list record
 * directly: the flow fetches the description, cast and enrichment.
 */
function openExternalPick(m) {
  // The list entry is thin — a title, a year, an id. The card has to open on
  // the CATALOGUE record, which is the one carrying the description, the
  // cast and the trailer.
  const key = markKey(m);
  const own = key && mine.has(key) ? MOVIES.find(x => markKey(x) === key) : null;
  if (own) { openModal(own); return; }
  openAddModal();
  const input = addBox.querySelector('#addTitle');
  if (input) {
    input.value = m.title_en || m.title_uk || '';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    runSearch(input.value, m.year ? String(m.year) : '');
  }
}

/* ---------- the recommendations flow ("Добірки") ----------
 * One overlay, three sources the person switches between:
 *   - друзі: a placeholder until subscriptions exist (see ROADMAP, the
 *     social section) — stated honestly rather than hidden;
 *   - мої: films THEY marked "рекомендую", in one place;
 *   - SeenIt: the auto-generated top-100 collections (kino/toplists,
 *     rebuilt weekly server-side — the app only reads).
 */
const recsBtn = document.getElementById('recsBtn');
const recsOverlay = document.getElementById('recsOverlay');
const recsBox = document.getElementById('recsBox');
let recsSource = 'seenit';
let recsListKey = 'all';
let toplistsCache = null;

function openRecs() {
  renderRecs();
  recsOverlay.classList.add('open');
  lockScroll();
}
function closeRecs() { recsOverlay.classList.remove('open'); unlockScroll(); }

function pickGridHtml(items, { ranks = false } = {}) {
  return `<div class="trend-grid">${items.map((m, i) => `
    <div class="trend-item" data-idx="${i}">
      ${m.poster_url ? `<img src="${esc(m.poster_url)}" alt="" loading="lazy">` : '<div class="trend-noposter">🎬</div>'}
      ${ranks && m.rank ? `<div class="trend-rank">${m.rank}</div>` : ''}
      ${haveFilm(m) ? '<div class="trend-have">Є</div>' : ''}
      <div class="trend-title">${esc(m.title_uk || m.title_en || '')}</div>
      <div class="trend-year">${m.year ? esc(String(m.year)) : ''}</div>
    </div>`).join('')}</div>`;
}

function renderRecs() {
  const src = (id, label) => `<button class="add-tab ${recsSource === id ? 'active' : ''}" data-recs-src="${id}">${label}</button>`;
  recsBox.innerHTML = `
    <div class="acc-row"><span class="wordmark">SeenIt</span></div>
    <div class="add-tabs">
      ${src('friends', 'Від друзів')}${src('mine', 'Мої')}${src('seenit', 'Добірки SeenIt')}
    </div>
    <div id="recsbody"></div>
    <div class="acc-actions"><button class="btn" id="recsCloseBtn">Закрити</button></div>`;
  recsBox.querySelectorAll('[data-recs-src]').forEach(el =>
    el.addEventListener('click', () => { recsSource = el.dataset.recsSrc; renderRecs(); }));
  recsBox.querySelector('#recsCloseBtn').addEventListener('click', closeRecs);

  const body = recsBox.querySelector('#recsbody') || recsBox.querySelector('#recsbody, #recsbody');
  if (recsSource === 'friends') {
    body.innerHTML = '<div class="add-hint">Рекомендації від друзів з\u02bcявляться разом із підписками — вони в планах. Поки що зазирни в «Мої» або «Добірки SeenIt».</div>';
    return;
  }
  if (recsSource === 'mine') {
    // Named for what it is rather than shadowing `mine`, the shelf set.
    const recommended = MOVIES.filter(m => isMarked(liked, m));
    if (!recommended.length) {
      body.innerHTML = '<div class="add-hint">Тут зʼявиться все, що ти позначиш серцем «рекомендую» — твій власний список порад.</div>';
      return;
    }
    const items = recommended.map(m => ({
      title_uk: m.canonical_title_uk, title_en: m.canonical_title_en,
      year: m.year, poster_url: m.poster_url,
    }));
    body.innerHTML = pickGridHtml(items);
    body.querySelectorAll('.trend-item').forEach(el =>
      el.addEventListener('click', () => { closeRecs(); openModal(recommended[Number(el.dataset.idx)]); }));
    return;
  }
  // SeenIt collections
  body.innerHTML = '<div class="add-hint">Завантажую добірки…</div>';
  const paint = (data) => {
    const lists = (data && data.lists) || {};
    const keys = TOPLIST_DEFS.map(d => d.key).filter(k => lists[k]);
    if (!keys.length) {
      body.innerHTML = '<div class="add-hint">Добірки ще формуються — зазирни пізніше.</div>';
      return;
    }
    if (!lists[recsListKey]) recsListKey = keys[0];
    const current = lists[recsListKey];
    body.innerHTML = `
      <div class="recs-lists">${keys.map(k =>
        `<button class="recs-list-chip ${k === recsListKey ? 'active' : ''}" data-list="${k}">${esc(lists[k].title)}</button>`).join('')}</div>
      ${data.updated_at ? `<div class="trend-updated">Оновлено ${new Date(data.updated_at).toLocaleDateString('uk-UA')} · за оцінками TMDb</div>` : ''}
      ${pickGridHtml(current.movies || [], { ranks: true })}`;
    body.querySelectorAll('[data-list]').forEach(el =>
      el.addEventListener('click', () => { recsListKey = el.dataset.list; renderRecs(); }));
    body.querySelectorAll('.trend-item').forEach(el =>
      el.addEventListener('click', () => {
        const m = (current.movies || [])[Number(el.dataset.idx)];
        if (!m) return;
        closeRecs();
        openExternalPick(m);
      }));
  };
  if (toplistsCache) { paint(toplistsCache); return; }
  db.ref('kino/toplists').once('value').then(snap => {
    toplistsCache = snap.val();
    paint(toplistsCache);
  }).catch(() => {
    body.innerHTML = '<div class="add-hint">Не вдалося завантажити добірки. Спробуй пізніше.</div>';
  });
}

recsBtn.addEventListener('click', openRecs);
recsOverlay.addEventListener('click', e => { if (e.target === recsOverlay) closeRecs(); });

accountBtn.addEventListener('click', openAccount);
accountOverlay.addEventListener('click', e => { if (e.target === accountOverlay) closeAccount(); });
onboardOverlay.addEventListener('click', e => { if (e.target === onboardOverlay) closeOnboarding(); });

addBtn.addEventListener('click', openAddModal);
addOverlay.addEventListener('click', e => { if (e.target === addOverlay) closeAddModal(); });
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</body>
</html>
