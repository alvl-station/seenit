<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeenIt</title>
<style>
  :root {
    --bg: #070c16;
    --surface: #10192a;
    --surface2: #17263c;
    --text: #edf2fb;
    --text-muted: #7991ac;
    --accent: #f0b95c;
    --accent2: #4f9dff;
    --accent3: #33dba0;
    --grad: linear-gradient(135deg, var(--accent2), var(--accent3));
    --like: #ff5d78;
    --border: #1c2c44;
    --radius: 14px;
    --control-h: 44px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  /* Scroll lock while a modal/overlay is open — see lockScroll()/unlockScroll()
     in app.js. Uses position:fixed (not just overflow:hidden) so background
     content can't be dragged/scrolled on iOS Safari either. */
  body.scroll-locked {
    position: fixed;
    left: 0; right: 0;
    overflow: hidden;
  }
  header { padding: 28px 24px 16px; max-width: 1280px; margin: 0 auto; }
  header h1 {
    margin: 0 0 4px; font-size: 24px; display: flex; align-items: center; gap: 10px;
    letter-spacing: .04em; font-weight: 700;
  }
  .h-badge {
    width: 30px; height: 30px; border-radius: 50%; background: var(--grad);
    position: relative; flex-shrink: 0;
  }
  .h-badge::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--surface); }
  .h-badge svg { position: relative; z-index: 1; }
  .h-badge, .brand-badge { display: flex; align-items: center; justify-content: center; }
  header .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .field-clear-wrap { position: relative; flex: 1; min-width: 220px; }
  .field-clear-wrap #search { width: 100%; box-sizing: border-box; }
  .field-clear-btn {
    position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: var(--surface2); color: var(--text-muted);
    display: none; align-items: center; justify-content: center;
    cursor: pointer; font-size: 15px; line-height: 1; padding: 0;
  }
  .field-clear-wrap.has-value .field-clear-btn { display: flex; }
  .field-clear-btn:active { background: var(--border); }
  #search {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 10px 36px 10px 14px; border-radius: 10px;
    font-size: 14px; outline: none; height: var(--control-h); width: 100%;
  }
  #search:focus { border-color: var(--accent2); }
  select {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 10px;
    font-size: 13px; outline: none; cursor: pointer; height: var(--control-h);
  }
  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; height: var(--control-h); }
  .view-toggle button {
    background: var(--surface); border: none; color: var(--text-muted);
    padding: 9px 12px; cursor: pointer; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center; flex: 1;
  }
  .view-toggle button.active { background: var(--grad); color: var(--bg); }
  .view-toggle button:not(:last-child) { border-right: 1px solid var(--border); }

  /* ---------- search row: circular "+NEW" add button, Search button, search field ---------- */
  .search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .add-fab {
    flex-shrink: 0; width: var(--control-h); height: var(--control-h); border-radius: 50%;
    border: none; background: var(--grad); color: var(--bg); font-weight: 800;
    font-size: 10.5px; letter-spacing: .03em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px -6px rgba(79,157,255,.6), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 5px rgba(0,0,0,.2);
    transition: transform .15s;
  }
  .add-fab:active { transform: scale(.94); }
  .search-btn {
    flex-shrink: 0; height: var(--control-h); border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); padding: 0 14px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .search-btn:active { border-color: var(--accent2); }
  @media (hover: hover) { .search-btn:hover { border-color: var(--accent2); } }
  .search-row .field-clear-wrap { flex: 1; min-width: 0; }
  .controls-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .tabs { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .tab {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .tab.active { background: var(--grad); color: var(--bg); border-color: transparent; font-weight: 600; }
  .tab .n { opacity: .7; font-size: 11px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    padding: 5px 11px; border-radius: 999px; font-size: 12px; cursor: pointer;
    flex: 1 1 auto; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:focus { outline: none; }
  /* Touch devices have no real hover — but WebKit applies :hover after a
     tap anyway and doesn't clear it until something else is tapped, so an
     unguarded :hover here looked identical to .active (same accent2
     border) and a deselected chip appeared stuck highlighted. Gating
     behind (hover: hover) means only an actual pointing device gets it. */
  @media (hover: hover) {
    .chip:hover { border-color: var(--accent2); color: var(--text); }
  }
  .chip.active { background: var(--surface2); color: var(--accent2); border-color: var(--accent2); font-weight: 600; }

  /* Extra room at the bottom so the last row of cards can be scrolled up
     away from the very edge of the screen (see CONVENTIONS.md). */
  main { max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; padding-bottom: 38vh; }
  .genre-section { margin-top: 32px; }
  .genre-section h2 {
    font-size: 19px; display: flex; align-items: baseline; gap: 10px;
    border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 0 0 16px;
  }
  .genre-section h2 .count { color: var(--text-muted); font-size: 13px; font-weight: 400; }

  /* GRID VIEWS */
  .grid { display: grid; gap: 16px; }
  body[data-view="grid-s"] .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  body[data-view="grid-m"] .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  body[data-view="grid-l"] .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; cursor: pointer;
    transition: transform .15s, border-color .15s, opacity .2s;
    display: flex; flex-direction: column; position: relative;
  }
  @media (hover: hover) {
    .card:hover { transform: translateY(-2px); border-color: var(--accent2); }
  }

  .poster { position: relative; aspect-ratio: 2/3; background: var(--surface2); overflow: hidden; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .25s; }
  .poster.fallback { display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, hsl(var(--hue) 45% 22%), hsl(calc(var(--hue) + 40) 40% 14%)); }
  .poster-initial { font-size: 42px; font-weight: 700; color: rgba(255,255,255,.35); }

  .card-toggles {
    position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 2;
  }
  /* Quick-glance award-win count on the poster itself (posterAwardBadgeHtml()
     in app.js) — visible while scrolling/searching the grid, without
     reading the badges row under the title. Mirrors .tgl's look, opposite
     corner. Redundant with the modal's full award section, so grid-only. */
  .poster-award-badge {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    display: flex; align-items: center; gap: 3px;
    background: rgba(15,17,21,.72); backdrop-filter: blur(4px);
    color: var(--accent); font-size: 11px; font-weight: 700;
    padding: 3px 7px; border-radius: 999px;
  }
  .poster-award-badge svg { width: 11px; height: 11px; flex-shrink: 0; }
  body[data-view="list"] .poster-award-badge { display: none; }
  .tgl {
    width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(15,17,21,.72); color: #cfd3da; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); transition: all .15s;
  }
  @media (hover: hover) {
    .tgl:hover { transform: scale(1.12); color: #fff; }
  }
  .tgl.on-watched { background: var(--grad); color: var(--bg); }
  .tgl.on-liked { background: var(--like); color: #fff; }

  .card.is-watched { opacity: .55; }
  .card.is-watched .poster img { filter: grayscale(1) brightness(.7); }
  .card.is-watched .poster.fallback { filter: grayscale(1) brightness(.7); }

  .card-body { display: flex; flex-direction: column; padding: 10px 12px 12px; flex: 1; }
  /* Meta row (type/year vs. IMDb/TMDb rating) sits above the title, per the
     grid-card layout: meta row -> title -> awards (one line) -> critic %
     pinned to the card's bottom-right corner (see .critic-corner below). */
  /* flex-wrap: nowrap (the default) let the type/year text and the rating
     badge overflow/shrink into each other on a narrow card (grid-s) instead
     of the badge cleanly dropping to its own line underneath — wrap fixes
     that; space-between still puts the badge on the right whenever both
     fit on one line. */
  .card-meta-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px; }
  .card-meta-row .year { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
  .card-title-row { margin-top: 4px; }
  .card-title-row h3 { margin: 0; font-size: 14px; line-height: 1.3; overflow-wrap: break-word; min-width: 0; }
  .badges { margin-top: 7px; }
  /* Named per-ceremony pills (shown by default, grid-m/grid-l) wrap onto
     more lines rather than forcing the card wider or clipping — see
     .badges-compact below for the narrow-card/list fallback. */
  .badges-full { display: flex; flex-wrap: wrap; gap: 5px; }
  .badges-compact {
    display: none; align-items: center; gap: 4px;
    color: var(--accent); font-size: 11px; font-weight: 700;
  }
  .badges-compact svg { width: 12px; height: 12px; flex-shrink: 0; }
  /* Always bottom-right of the card: pushed down by margin-top:auto in the
     column-flex .card-body, then right-aligned within that row. */
  .critic-corner { margin-top: auto; align-self: flex-end; padding-top: 6px; }
  .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: var(--surface2); color: var(--text-muted); }
  .badge--rating { color: var(--accent); }
  /* Critic score: color comes from the --critic-color custom property, set
     per-card in JS via criticScoreColor() (src/logic.js) — a continuous
     red -> yellow -> green sweep, not a handful of fixed tiers. Text +
     border carry the color; background stays the plain badge surface
     (avoids color-mix(), which isn't safe to rely on everywhere). */
  .badge--critic {
    color: var(--critic-color); border: 1px solid var(--critic-color);
    background: var(--surface2); font-weight: 700; cursor: pointer;
  }
  .badge--award-won, .badge--award-nom {
    display: inline-flex; align-items: center; gap: 3px; font-weight: 600;
  }
  .award-badge { cursor: pointer; }
  .award-badge, .critic-badge { -webkit-tap-highlight-color: transparent; }
  .badge--award-won svg, .badge--award-nom svg { width: 13px; height: 13px; flex-shrink: 0; }
  .badge--award-won { color: var(--accent); border: 1px solid rgba(240,185,92,.4); background: rgba(240,185,92,.12); }
  .badge--award-nom { color: #b8c4d1; border: 1px solid rgba(184,196,209,.35); background: rgba(184,196,209,.1); }
  body[data-view="grid-s"] .card-body { padding: 8px 9px 9px; }
  body[data-view="grid-s"] .card-title-row h3 { font-size: 12px; }
  /* A grid-s card is too narrow for named pills ("Golden Globe" alone can
     be wider than the whole card) — fall back to the compact trophy+count
     summary there, same as list view below. */
  body[data-view="grid-s"] .badges-full { display: none; }
  body[data-view="grid-s"] .badges-compact { display: flex; }

  /* LIST VIEW */
  body[data-view="list"] .grid { display: flex; flex-direction: column; gap: 8px; }
  body[data-view="list"] .card { flex-direction: row; align-items: center; }
  body[data-view="list"] .poster { width: 52px; min-width: 52px; aspect-ratio: 2/3; border-radius: 8px; margin: 8px; }
  body[data-view="list"] .poster-initial { font-size: 18px; }
  /* The grid-card layout (meta row -> title -> awards -> corner-pinned
     critic %) is a vertical stack; in the list view all of those become
     plain siblings in one wrapping row instead, so give each an explicit
     `order` matching the layout's intent (title first, then the rest).
     flex-direction MUST be repeated here (not just display:flex) — CSS
     resolves each property independently regardless of selector, and
     .card-body's base rule (grid layout) sets flex-direction: column, so
     leaving it unset here would silently inherit that column stacking. */
  body[data-view="list"] .card-body {
    display: flex; flex-direction: row; align-items: center; gap: 14px; padding: 8px 12px; flex-wrap: wrap;
  }
  /* Same reasoning as grid-s: a 52px-thumbnail list row has even less room
     for named pills than a grid-s card. */
  body[data-view="list"] .badges-full { display: none; }
  body[data-view="list"] .badges-compact { display: flex; }
  body[data-view="list"] .card-meta-row { order: 2; flex: 0 0 auto; }
  body[data-view="list"] .card-title-row { flex: 1 1 180px; min-width: 180px; order: 1; margin-top: 0; }
  body[data-view="list"] .badges { margin-top: 0; order: 3; }
  body[data-view="list"] .critic-corner { margin-top: 0; align-self: auto; padding-top: 0; order: 4; }
  body[data-view="list"] .card-toggles { position: static; margin-right: 12px; order: 5; margin-left: auto; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50;
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; max-width: 720px; width: 100%;
    display: flex; overflow: hidden; position: relative;
  }
  .modal-poster { width: 240px; min-width: 240px; background: var(--surface2); }
  .modal-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-poster.fallback { display: flex; align-items: center; justify-content: center; min-height: 360px;
    background: linear-gradient(135deg, hsl(var(--hue) 45% 22%), hsl(calc(var(--hue) + 40) 40% 14%)); }
  .modal-body { padding: 22px 24px; flex: 1; }
  .modal-body h2 { margin: 0 0 2px; font-size: 22px; overflow-wrap: break-word; }
  .modal-body .title-en { color: var(--text-muted); font-style: italic; font-size: 13px; margin-bottom: 10px; }
  .modal-body .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .modal-body .desc { font-size: 14px; color: #c6cad2; margin: 0 0 14px; }
  .modal-cast { margin-bottom: 16px; }
  .modal-cast .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 5px; }
  .actor {
    display: inline-block; background: var(--surface2); border: 1px solid var(--border);
    color: var(--accent2); padding: 3px 10px; border-radius: 999px;
    font-size: 12.5px; margin: 0 5px 5px 0; cursor: pointer;
  }
  @media (hover: hover) {
    .actor:hover { border-color: var(--accent2); }
  }
  .modal-awards { margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .modal-awards-group .lbl {
    display: flex; align-items: center; gap: 5px; font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 5px;
  }
  .award-pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12.5px; margin: 0 5px 5px 0;
  }
  .award-pill--won { background: rgba(240,185,92,.14); border: 1px solid rgba(240,185,92,.4); color: var(--accent); }
  .award-pill--nom { background: rgba(184,196,209,.1); border: 1px solid rgba(184,196,209,.3); color: #b8c4d1; }
  .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    padding: 9px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; text-decoration: none;
  }
  @media (hover: hover) {
    .btn:hover { border-color: var(--accent2); }
  }
  .btn.b-watched.on { background: var(--grad); color: var(--bg); border-color: transparent; }
  .btn.b-liked.on { background: var(--like); color: #fff; border-color: var(--like); }
  .modal-close {
    position: absolute; top: 6px; right: 6px; width: 44px; height: 44px;
    border-radius: 50%; border: none; background: rgba(7,12,22,.75); color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 2; -webkit-tap-highlight-color: transparent;
  }
  .warn-note { font-size: 12px; color: #e0a04f; margin-top: 10px; }

  .empty-msg { color: var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px; }
  footer { text-align: center; color: var(--text-muted); font-size: 12px; padding: 28px 20px 46px; }

  /* ---------- login screen ---------- */
  #loginOverlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 999; padding: 20px;
  }
  #loginOverlay.hidden { display: none; }
  .login-box {
    width: 100%; max-width: 320px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px 24px;
  }
  .brand-badge {
    width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px;
    background: var(--grad); position: relative;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px -10px rgba(79,157,255,.5);
  }
  .brand-badge::before {
    content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface);
  }
  .brand-badge svg { position: relative; z-index: 1; }
  .login-box h1 {
    font-size: 17px; margin: 0 0 4px; text-align: center;
    letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
  }
  .login-box .login-sub { color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 22px; }
  .login-box input {
    width: 100%; box-sizing: border-box; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 13px; font-size: 15px; margin-bottom: 10px;
  }
  .login-box input:focus { outline: none; border-color: var(--accent2); }
  .login-box button {
    width: 100%; background: var(--grad); color: var(--bg); border: none;
    border-radius: 10px; padding: 11px 13px; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }
  .login-box button:disabled { opacity: .6; cursor: default; }
  .login-error {
    color: var(--like); font-size: 13px; text-align: center;
    min-height: 18px; margin-top: 10px;
  }
  .login-reset {
    text-align: center; font-size: 12px; color: var(--text-muted);
    margin-top: 14px; cursor: pointer; text-decoration: underline;
  }
  #logoutBtn {
    position: fixed; top: 12px; right: 12px; z-index: 50;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }

  /* ---------- toast (save success/error banner) ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px);
    max-width: calc(100% - 32px); z-index: 1000;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 12px 18px; border-radius: 12px; font-size: 14px;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast--success { border-color: var(--accent3); }
  .toast--error { border-color: var(--like); color: #ffd7de; }
  .toast--info { border-color: var(--accent2); }

  /* ---------- info popover (award/critic-score explanations) ----------
     Anchored next to whatever badge was tapped (see showInfoPopover() in
     app.js) rather than fixed at the screen bottom like the toast above —
     it's an explanation of a specific thing on screen, not a standalone
     notification. */
  #infoPopover {
    position: fixed; max-width: min(280px, calc(100% - 24px));
    background: var(--surface); border: 1px solid var(--accent2); color: var(--text);
    padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.45;
    white-space: pre-line; box-shadow: 0 10px 30px -8px rgba(0,0,0,.5);
    z-index: 1000; opacity: 0; pointer-events: none; transition: opacity .15s;
    overflow-y: auto;
  }
  #infoPopover.show { opacity: 1; }

  /* ---------- mobile / portrait (see CONVENTIONS.md) ---------- */
  @media (max-width: 640px) {
    .modal { flex-direction: column; }
    .modal-poster { width: 100%; min-width: 0; max-height: 340px; }
    .modal-poster img { max-height: 340px; object-fit: contain; background: #000; }

    header { padding: 18px 16px 12px; }

const localStore = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e) { return []; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};

function attachSync(ref, targetSetName, localKey) {
  ref.on('value', snap => {
    const val = snap.val() || {};
    const ids = Object.keys(val).filter(id => val[id]);
    window[targetSetName] = new Set(ids);
    if (targetSetName === 'watched') watched = window.watched;
    if (targetSetName === 'liked') liked = window.liked;
    localStore.set(localKey, ids); // keep an offline copy
    render();
  }, err => {
    // Offline / permission error: fall back to whatever was last saved locally
    const ids = localStore.get(localKey);
    if (targetSetName === 'watched') watched = new Set(ids);
    if (targetSetName === 'liked') liked = new Set(ids);
    render();
  });
}
/* ---------- auth: each person logs in with their own username + password ---------- */
// Firebase needs an email format under the hood, so we map a plain
// "username" to a fixed fake domain. The actual password is set per-account
// in the Firebase Console and never appears anywhere in this code.
// usernameToEmail() now lives in src/logic.js (loaded before this file).

const appRoot = document.getElementById('appRoot');

const loginPass = document.getElementById('loginPass');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');

let syncedOnce = false;
auth.onAuthStateChanged(user => {
  if (user && user.isAnonymous) {

    // anonymous sign-in. That mode is gone now — kick it out automatically

/* ---------- toast (save success/error banner) ---------- */
let _toastEl = null;
let _toastTimer = null;
// Guards the very click that just opened a toast (an award/critic-score
// badge tap) from immediately closing it again as it keeps bubbling up to
// `document` in the same tick — see the click listener below. Flips true
// on the next tick, so any click after the opening one closes it.
let _toastDismissible = false;
function toast(kind, message) {
  if (!_toastEl) {
    _toastEl = document.createElement('div');
    _toastEl.id = 'toast';
    document.body.appendChild(_toastEl);
  }
  _toastEl.className = `toast toast--${kind}`;
  _toastEl.textContent = message;
  _toastEl.classList.add('show');
  clearTimeout(_toastTimer);
  const duration = kind === 'error' ? 4500 : (kind === 'info' ? 5500 : 3000);
  _toastTimer = setTimeout(hideToast, duration);
  _toastDismissible = false;
  setTimeout(() => { _toastDismissible = true; }, 0);
}
function hideToast() {
  clearTimeout(_toastTimer);
  if (_toastEl) _toastEl.classList.remove('show');
}

/* ---------- info popover (award/critic-score explanations) ----------
 * A fixed-position bottom banner (the toast above) makes sense for a
 * save confirmation — it's not "about" anything on screen. An
 * explanation of a specific badge you just tapped is: it needs to show
 * up next to that badge, not down at the bottom of a long modal/card
 * grid where it's easy to miss it's even related to what you tapped.
 */
let _popoverEl = null;
let _popoverDismissible = false;
function showInfoPopover(anchorEl, message) {
  if (!_popoverEl) {
    _popoverEl = document.createElement('div');
    _popoverEl.id = 'infoPopover';
    document.body.appendChild(_popoverEl);
  }
  _popoverEl.textContent = message;
  // Measure off-screen first (size depends on the text just set), then
  // place it right next to the anchor — never fall back to a viewport-wide
  // clamp that can strand it far from what was actually tapped (that
  // happened for a long bullet list: neither "fits below" nor "fits above"
  // held, so the old clamp shoved it all the way to the top of the
  // screen). Instead pick whichever side (above/below the anchor) has more
  // room, and cap the popover's own height to that room — so it always
  // ends up adjacent to the anchor, never covering it, never drifting away.
  _popoverEl.classList.remove('show');
  _popoverEl.style.visibility = 'hidden';
  _popoverEl.style.left = '0px';
  _popoverEl.style.top = '0px';
  _popoverEl.style.maxHeight = '';
  const anchorRect = anchorEl.getBoundingClientRect();
  const margin = 8;
  const spaceBelow = window.innerHeight - anchorRect.bottom - margin;
  const spaceAbove = anchorRect.top - margin;
  const placeBelow = spaceBelow >= spaceAbove;
  _popoverEl.style.maxHeight = `${Math.max(80, placeBelow ? spaceBelow : spaceAbove)}px`;
  const popRect = _popoverEl.getBoundingClientRect();
  let top = placeBelow ? anchorRect.bottom + margin : anchorRect.top - popRect.height - margin;
  top = Math.max(margin, Math.min(top, window.innerHeight - popRect.height - margin));
  let left = anchorRect.left + anchorRect.width / 2 - popRect.width / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - popRect.width - margin));
  _popoverEl.style.top = `${top}px`;
  _popoverEl.style.left = `${left}px`;
  _popoverEl.style.visibility = '';
  _popoverEl.classList.add('show');
  _popoverDismissible = false;
  setTimeout(() => { _popoverDismissible = true; }, 0);
}
function hideInfoPopover() {
  if (_popoverEl) _popoverEl.classList.remove('show');
}
document.addEventListener('click', e => {
  if (!_popoverDismissible || !_popoverEl || !_popoverEl.classList.contains('show')) return;
  if (_popoverEl.contains(e.target)) return;
  hideInfoPopover();
});
// Reposition (or just dismiss) on scroll/resize rather than leaving it
// pointing at empty space if the anchor moved.
window.addEventListener('scroll', () => hideInfoPopover(), true);
window.addEventListener('resize', () => hideInfoPopover());

// Tapping anywhere outside an open toast dismisses it immediately, instead
// of waiting out its timeout.
document.addEventListener('click', e => {
  if (!_toastDismissible || !_toastEl || !_toastEl.classList.contains('show')) return;
  if (_toastEl.contains(e.target)) return;
  hideToast();
});

/* ---------- render ---------- */
function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Critic-score badge (0-100%): background/border color is computed per-value
// via criticScoreColor() (src/logic.js) — a smooth red->yellow->green sweep,
// applied through a CSS custom property rather than a handful of fixed
// classes, so the color itself is continuous. Tappable (see the delegated
// click listeners below) since a native `title` tooltip doesn't work on touch.
function criticBadgeHtml(m) {
  if (m.critic_score === undefined || m.critic_score === null || m.critic_score === '') return '';
  const pct = Math.max(0, Math.min(100, Math.round(m.critic_score)));
  return `<span class="badge badge--critic critic-badge" style="--critic-color:${criticScoreColor(pct)}" data-critic-pct="${pct}">${pct}%</span>`;
}
function criticScoreToast(anchorEl, pct) {
  showInfoPopover(anchorEl, `${pct}% — частка позитивних оцінок критиків (Rotten Tomatoes, або Metascore, якщо перше недоступне для цього фільму).`);
}
// m.rating is a plain "TMDb 8.4"/"IMDb 7.7"-style string (see tmdbDetails()
// below and the older, differently-sourced catalog entries) — just
// explains whichever source it's actually tagged with, out of 10.
function ratingBadgeToast(anchorEl, ratingText) {
  const source = /^TMDb\b/i.test(ratingText) ? 'The Movie Database (TMDb)'
    : /^IMDb\b/i.test(ratingText) ? 'IMDb'
    : null;
  showInfoPopover(anchorEl, source ? `${ratingText} — рейтинг глядачів на ${source}, за шкалою 0–10.` : ratingText);
}

// Awards are grouped by ceremony (groupAwards(), src/logic.js) — a movie
// that won 3 Oscars shows ONE Oscar badge with a "+"-style multiplicity
// marker (awardCountSuffix()), not three separate icons. Each rendered
// badge's group is pushed into a registry so a later tap can toast exactly
// which award(s) it covers without cramming an array into a data-
// attribute. Two separate registries (card grid vs. modal), each reset at
// the start of its own render pass (see render()/openModal()) — otherwise
// re-rendering the grid while a modal is open would invalidate the
// modal's still-visible badge indices.
let _cardAwardGroups = [];
let _modalAwardGroups = [];
// Only the categories we actually know. Awards with no category detail (the
// OMDb count-only shape, and the padding mergeAwardSources() adds for a
// ceremony Wikidata under-detailed) are dropped rather than listed as an
// "unknown" line — that line was pure noise next to the real ones.
//
// So the bullets deliberately DON'T sum to the header's count: "Oscar (7)"
// can list 4 categories because those are the 4 we actually know. The count
// stays honest (it's the real number of awards), the list stays useful.
function knownAwardCategories(group) {
  return awardCategoryBreakdown(group.texts).filter(e => e.category);
}
// Only well-known ceremonies are shown at all — a local festival that
// AWARD_INFO doesn't recognize is dropped rather than rendered as a bare
// icon. Applied at RENDER time (not just when fetching) so rows stored
// before that rule existed display clean without waiting for a re-backfill.
function majorAwardGroups(list) {
  return groupAwards(majorAwardsOnly(list));
}
// What a tap on this group's badge should reveal, or null when there's
// nothing worth opening a popover for.
//
// Known categories win: the header names the ceremony once, each bullet is
// just the category half (splitAwardLabel()), and two awards sharing one
// category collapse to a single bullet with its own "(2)".
//
// Only when NOTHING is known — the OMDb count-only shape, e.g. a bare
// "Emmy" repeated, where no category exists anywhere in the group — does
// the curated one-line description of what the ceremony *is* stand in. It's
// strictly a fallback: whenever real categories exist, what the film
// actually won is shown instead, never a blurb about the ceremony.
function awardGroupPopoverText(group) {
  const header = `${group.name}${awardCountSuffix(group.texts.length)}`;
  const known = knownAwardCategories(group);
  if (known.length) {
    return [header, ...known.map(({ category, count }) => `• ${category}${awardCountSuffix(count)}`)].join('\n');
  }
  if (group.description) return `${header}\n${group.description}`;
  // Unrecognized ceremony, no categories, no curated description: the badge
  // renders icon-only for these (its "name" is a best-effort split that
  // could still be category text — see awardCountBadgesHtml), so the name
  // IS the new information a tap reveals here, not a repeat of the badge.
  return group.recognized ? null : header;
}
function awardGroupToast(anchorEl, registryName, idx) {
  const group = (registryName === 'modal' ? _modalAwardGroups : _cardAwardGroups)[idx];
  if (!group) return;
  const text = awardGroupPopoverText(group);
  if (text) showInfoPopover(anchorEl, text);
}
// A badge is only tappable when the tap would actually reveal something.
// Returns the class + data-attributes for that, or empty strings otherwise.
function awardBadgeAttrs(group, registryName, idx) {
  if (!awardGroupPopoverText(group)) return { cls: '', attrs: '' };
  return { cls: ' award-badge', attrs: ` data-award-registry="${registryName}" data-award-idx="${idx}"` };
}
// Compact award badges for the card grid: one badge per ceremony group
// (won + nominated combined), capped so a long list doesn't take over the
// card — the full list lives in the modal (see awardsSectionHtml below).
const CARD_AWARDS_MAX = 3;
function awardCountBadgesHtml(m) {
  const all = [
    ...majorAwardGroups(m.awards_won).map(g => ({ g, kind: 'won' })),
    ...majorAwardGroups(m.awards_nominated).map(g => ({ g, kind: 'nom' })),
  ];
  if (!all.length) return '';
  const badge = ({ g, kind }) => {
    const icon = AWARD_ICONS[g.key] || (kind === 'won' ? ICON.trophy : ICON.star);
    const cls = kind === 'won' ? 'badge--award-won' : 'badge--award-nom';
    _cardAwardGroups.push(g);
    // Name text only for a recognized ceremony (curated English name, see
    // AWARD_INFO) — an unrecognized one's "name" is just a best-effort
    // regex guess and could still be a category fragment, so icon-only
    // there rather than risk showing that without a tap.
    const label = g.recognized ? esc(g.name) : '';
    const tap = awardBadgeAttrs(g, 'card', _cardAwardGroups.length - 1);
    return `<span class="badge ${cls}${tap.cls}"${tap.attrs}>${icon}${label}${esc(awardCountSuffix(g.texts.length))}</span>`;
  };
  const shown = all.slice(0, CARD_AWARDS_MAX).map(badge).join('');
  const overflow = all.length > CARD_AWARDS_MAX ? `<span class="badge">+${all.length - CARD_AWARDS_MAX}</span>` : '';
  // Named per-ceremony pills need real width (e.g. "Golden Globe") — fine
  // on grid-m/grid-l, but on a small grid-s card or a list row they'd wrap
  // across several lines and stretch the card. Both versions are always
  // rendered; CSS shows only one per view (view switching is pure CSS, no
  // re-render — see the #viewToggle click handler) so the compact one
  // (trophy + total count) takes over wherever there isn't room for names.
  const totalCount = (m.awards_won || []).length + (m.awards_nominated || []).length;
  return `<div class="badges-full">${shown}${overflow}</div>`
    + `<div class="badges-compact">${ICON.trophy}<span>+${totalCount}</span></div>`;
}
// Full award list for the modal: won and nominated shown as their own
// labeled groups of mini pill-badges (icon + name + count marker), each
// tappable for a toast enumerating the actual award(s) it covers.
function awardsSectionHtml(m) {
  const wonGroups = majorAwardGroups(m.awards_won);
  const nomGroups = majorAwardGroups(m.awards_nominated);
  if (!wonGroups.length && !nomGroups.length) return '';
  const pill = (g, kind) => {
    const icon = AWARD_ICONS[g.key] || (kind === 'won' ? ICON.trophy : ICON.star);
    _modalAwardGroups.push(g);
    // Same rule as the card badge: an unrecognized ceremony's "name" is a
    // best-effort guess (could still be a category fragment), so it stays
    // icon-only until tapped rather than risk leaking that text.
    const label = g.recognized ? esc(g.name) : '';
    const tap = awardBadgeAttrs(g, 'modal', _modalAwardGroups.length - 1);
    return `<span class="award-pill award-pill--${kind}${tap.cls}"${tap.attrs}>${icon}${label}${esc(awardCountSuffix(g.texts.length))}</span>`;
  };
  const wonHtml = wonGroups.length
    ? `<div class="modal-awards-group"><div class="lbl">${ICON.trophy}Нагороди</div>${wonGroups.map(g => pill(g, 'won')).join('')}</div>`
    : '';
  const nomHtml = nomGroups.length
    ? `<div class="modal-awards-group"><div class="lbl">${ICON.star}Номінації</div>${nomGroups.map(g => pill(g, 'nom')).join('')}</div>`
    : '';
  return `<div class="modal-awards">${wonHtml}${nomHtml}</div>`;
}

function posterHtml(m, cls) {
  if (m.poster_url) {
    return `<div class="${cls}" style="--hue:${hue(m)}">
      <img src="${esc(m.poster_url)}" alt="${esc(m.canonical_title_uk)}" loading="lazy"
        onerror="var p=this.parentElement;this.remove();if(p){p.classList.add('fallback');p.insertAdjacentHTML('beforeend','<span class=poster-initial>${esc((m.canonical_title_uk||'?')[0].toUpperCase())}</span>')}">
    </div>`;
  }
  return `<div class="${cls} fallback" style="--hue:${hue(m)}"><span class="poster-initial">${esc((m.canonical_title_uk||'?')[0].toUpperCase())}</span></div>`;
}

// Quick-glance award count right on the poster thumbnail, so it shows up
// while scrolling/searching the grid without needing to read the badges
// row below the title (visible below the poster crop on a small card).
// Wins only, not nominations — that's the more meaningful "at a glance"
// signal, and matches the badge row already grouping wins separately.
function posterAwardBadgeHtml(m) {
  const wonCount = (m.awards_won || []).length;
  if (!wonCount) return '';
  return `<div class="poster-award-badge">${ICON.trophy}${wonCount}</div>`;
}

function cardHtml(m) {
  const isW = watched.has(m.id), isL = liked.has(m.id);
  const critic = criticBadgeHtml(m);
  return `<div class="card ${isW ? 'is-watched' : ''}" data-id="${esc(m.id)}">
    ${posterHtml(m, 'poster')}
    ${posterAwardBadgeHtml(m)}
    <div class="card-toggles">
      <button class="tgl ${isW ? 'on-watched' : ''}" data-act="watch" title="Переглянуто">${ICON.eye}</button>
      <button class="tgl ${isL ? 'on-liked' : ''}" data-act="like" title="Рекомендую">${ICON.heart}</button>
    </div>
    <div class="card-body">
      <div class="card-meta-row">
        <span class="year">${esc(m.type)}${m.year ? ` · ${m.year}` : ''}</span>
        ${m.rating ? `<span class="badge badge--rating rating-badge" data-rating="${esc(m.rating)}">★ ${esc(m.rating)}</span>` : ''}
      </div>
      <div class="card-title-row"><h3>${esc(m.canonical_title_uk)}</h3></div>
      <div class="badges">${awardCountBadgesHtml(m)}</div>
      ${critic ? `<div class="critic-corner">${critic}</div>` : ''}
    </div>
  </div>`;
}

function render() {
  const main = document.getElementById('main');
  const items = visibleMovies();
  _cardAwardGroups = [];

  document.getElementById('nLiked').textContent = liked.size ? `(${liked.size})` : '';
  document.getElementById('nWatched').textContent = watched.size ? `(${watched.size})` : '';

  if (!items.length) {
    main.innerHTML = moviesLoaded
      ? '<div class="empty-msg">Нічого не знайдено</div>'
      : '<div class="empty-msg">Завантажую каталог…</div>';
    return;
  }

  // group by genre unless a specific genre chip or non-all tab with search — keep genre sections always for structure
  const groups = new Map();
  for (const m of items) {
    const g = m.genre_group || 'Інше';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(m);
  }
  let html = '';
  for (const g of GENRE_ORDER) {
    if (!groups.has(g)) continue;
    const list = groups.get(g).slice().sort(sortFn);
    html += `<section class="genre-section">
      <h2>${esc(g)} <span class="count">${list.length}</span></h2>
      <div class="grid">${list.map(cardHtml).join('')}</div>
    </section>`;
  }
  main.innerHTML = html;
}

/* ---------- scroll lock (shared by every overlay/modal) ---------- */
// Plain `overflow:hidden` on body isn't reliable on iOS Safari (the page can
// still be dragged underneath a fixed-position overlay), so we additionally
// pin the body in place and restore the exact scroll position on unlock.
let _lockedScrollY = 0;
let _scrollLockCount = 0;
function lockScroll() {
  if (_scrollLockCount === 0) {
    _lockedScrollY = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = `-${_lockedScrollY}px`;
    document.body.classList.add('scroll-locked');
  }
  _scrollLockCount++;
}
function unlockScroll() {
  _scrollLockCount = Math.max(0, _scrollLockCount - 1);
  if (_scrollLockCount === 0) {
    document.body.classList.remove('scroll-locked');
    document.body.style.top = '';
    window.scrollTo(0, _lockedScrollY);
  }
}

/* ---------- modal ---------- */
const overlay = document.getElementById('modalOverlay');
const modalBox = document.getElementById('modalBox');

function openModal(m) {
  _modalAwardGroups = [];
  const isW = watched.has(m.id), isL = liked.has(m.id);
  const q = encodeURIComponent(`${m.canonical_title_en || m.canonical_title_uk} трейлер`);
  const trailerBtn = m.trailer_url
    ? `<a class="btn" href="${esc(m.trailer_url)}" target="_blank" rel="noopener">▶ Трейлер</a>`
    : `<a class="btn" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Трейлер на YouTube</a>`;
  const cast = (m.cast || []).map(a => `<span class="actor" data-actor="${esc(a)}">${esc(a)}</span>`).join('');
  modalBox.innerHTML = `
    ${posterHtml(m, 'modal-poster')}
    <div class="modal-body">
      <h2>${esc(m.canonical_title_uk)} ${m.year ? `<span style="color:var(--text-muted);font-weight:400;font-size:16px">(${m.year})</span>` : ''}</h2>
      ${m.canonical_title_en && m.canonical_title_en.toLowerCase() !== (m.canonical_title_uk||'').toLowerCase() ? `<div class="title-en">${esc(m.canonical_title_en)}</div>` : ''}
      ${m.country ? `<div class="title-en">${esc(m.country)}</div>` : ''}
      <div class="meta">
        <span class="badge">${esc(m.type)}</span>
        <span class="badge">${esc(m.genre)}</span>
        ${m.rating ? `<span class="badge badge--rating rating-badge" data-rating="${esc(m.rating)}">★ ${esc(m.rating)}</span>` : ''}
        ${criticBadgeHtml(m)}
      </div>
      <p class="desc">${esc(m.description_uk)}</p>
      ${cast ? `<div class="modal-cast"><div class="lbl">У головних ролях</div>${cast}</div>` : ''}
      ${awardsSectionHtml(m)}

function toggle(act, id) {
  const set = act === 'watch' ? watched : liked;
  const ref = act === 'watch' ? watchedRef : likedRef;
  const willBeOn = !set.has(id);

  // Optimistic local update for instant feedback
  willBeOn ? set.add(id) : set.delete(id);

  // for this tab and push the change to everyone else in real time.
  if (willBeOn) {

    ref.child(id).remove();

}

/* ---------- reusable clear button wiring for text inputs ---------- */
function wireClearButtons(root) {
  // `root` may either be a container that HAS .field-clear-wrap descendants
  // (e.g. the add-movie modal, several fields) or a single .field-clear-wrap
  // element itself (e.g. the header search field) — querySelectorAll alone
  // only ever finds descendants, so a lone wrap passed directly used to
  // match nothing and its clear button silently never got wired up.
  const wraps = root.classList && root.classList.contains('field-clear-wrap')
    ? [root]
    : Array.from(root.querySelectorAll('.field-clear-wrap'));
  wraps.forEach(wrap => {
    const input = wrap.querySelector('input');
    const btn = wrap.querySelector('.field-clear-btn');
    if (!input || !btn) return;
    const sync = () => wrap.classList.toggle('has-value', !!input.value);
    sync();
    input.addEventListener('input', sync);
    btn.addEventListener('click', () => {
      input.value = '';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.focus();
    });
  });
}

async function tmdbFetch(path, params = {}) {
  const url = new URL('https://api.themoviedb.org/3' + path);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url, { headers: { Authorization: `Bearer ${TMDB_TOKEN}`, accept: 'application/json' } });
  if (!res.ok) throw new Error(`TMDb ${res.status}`);
  return res.json();
}
async function tmdbSearch(query, year) {

  return (data.results || [])
    .filter(r => r.media_type === 'movie' || r.media_type === 'tv')

// a title OMDb doesn't have, or a network hiccup, just leaves these fields

async function fetchOmdbData(titleEn, titleUk, year, kind) {

// buildWikidataAwardsQuery()/parseWikidataAwards() (src/logic.js) for why
// this is two UNIONed shapes, not one. imdbId comes from the OMDb response
// we already fetched (its own `imdbID` field), so this never needs its
// own title-matching lookup. Best-effort, same as the OMDb call: no
// category data for this title, or a network hiccup, just means
// awards_won/nominated fall back to OMDb's plain counts (see tmdbDetails).
async function fetchWikidataAwardCategories(imdbId) {
  if (!imdbId || !/^tt\d+$/.test(imdbId)) return null;
  try {
    const url = `https://query.wikidata.org/sparql?format=json&query=${encodeURIComponent(buildWikidataAwardsQuery(imdbId))}`;
    const res = await fetch(url, { headers: { Accept: 'application/sparql-results+json' } });
    if (!res.ok) return null;
    const data = await res.json();
    return parseWikidataAwards(data.results && data.results.bindings);
  } catch (err) {
    return null;
  }
}
// Enforces the "actor names in Latin script only, no hieroglyphs" rule
// (CONVENTIONS.md) for names pulled fresh from TMDb credits. hasCJKScript()/
// pickLatinPersonName() are pure (src/logic.js); this wrapper does the
// actual network lookup, and — same policy as the deploy-time migration in
// scripts/migrate-actor-names.js — drops an actor entirely rather than
// ever saving a name with hieroglyphs if no Latin alias can be found.
async function resolveLatinCastNames(entries) {
  const out = [];
  for (const c of (entries || [])) {
    if (!c || !c.name) continue;
    if (!hasCJKScript(c.name)) { out.push(c.name); continue; }
    if (!c.id) continue; // no person id to look up -> can't safely resolve, drop
    try {
      const details = await tmdbFetch(`/person/${c.id}`, { language: 'en-US' });
      const latin = pickLatinPersonName(details);
      if (latin) out.push(latin);
    } catch (err) { /* lookup failed -> drop rather than risk hieroglyphs */ }
  }
  return out;
}
// Free, no-key translation fallback (client-side call, runs in the visitor's
// browser — not something we can bundle a paid key for). Best-effort only:
// if it fails or is unreachable we just keep the English text.
async function translateToUk(text) {
  if (!text) return '';
  try {
    const chunk = text.slice(0, 480);
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=en|uk`;
    const res = await fetch(url);
    const data = await res.json();
    const t = data && data.responseData && data.responseData.translatedText;
    // MyMemory sometimes "fails silently": an all-caps error string, or a
    // transliteration of the English text into Latin letters instead of an
    // actual Ukrainian (Cyrillic) translation. Reject both — a bad Latin
    // guess in the Ukrainian-title field is worse than just keeping English.
    return (t && !/^[A-Z ]+$/.test(t) && /[а-яіїєґ]/i.test(t)) ? t : '';
  } catch (err) {
    return '';
  }
}
// TMDb's own uk-UA "title" field is often just the original/English title
// with no translation on file. The actual Ukrainian *distribution* title
// (what's on the poster in Ukrainian cinemas — can be quite different from
// a literal translation) lives in alternative_titles under country UA.
// We prefer that over the plain uk-UA localized title whenever it exists.
async function fetchUaReleaseTitle(kind, id) {
  try {
    const data = await tmdbFetch(`/${kind}/${id}/alternative_titles`, {});
    const list = data.results || data.titles || [];
    const ua = list.find(t => t.iso_3166_1 === 'UA' && t.title && t.title.trim());
    return ua ? ua.title.trim() : '';
  } catch (err) {
    return '';
  }
}
async function tmdbDetails(id, mediaType) {
  const kind = mediaType === 'tv' ? 'tv' : 'movie';
  const [dUk, uaReleaseTitle] = await Promise.all([
    tmdbFetch(`/${kind}/${id}`, { language: 'uk-UA', append_to_response: 'credits,videos' }),
    fetchUaReleaseTitle(kind, id),
  ]);

  let overview = dUk.overview || '';
  let overviewTranslated = false;
  let trailer = pickTrailer(dUk.videos && dUk.videos.results);

  // Trailer fallback chain: uk -> ru (often the only dubbed trailer that
  // exists on YouTube for these titles) -> en.
  if (!trailer) {
    try {
      const dRu = await tmdbFetch(`/${kind}/${id}`, { language: 'ru-RU', append_to_response: 'videos' });
      trailer = pickTrailer(dRu.videos && dRu.videos.results);
    } catch (err) { /* ignore, fall through to en */ }
  }

  let dEn = null;
  if (!trailer || !overview) {
    try {
      dEn = await tmdbFetch(`/${kind}/${id}`, { language: 'en-US', append_to_response: 'credits,videos' });
    } catch (err) { /* ignore */ }
  }
  if (!trailer && dEn) trailer = pickTrailer(dEn.videos && dEn.videos.results);
  if (!overview && dEn && dEn.overview) {
    const translated = await translateToUk(dEn.overview);
    overview = translated || dEn.overview;
    overviewTranslated = !!translated;
  }

  const d = dUk;
  const titleEn = kind === 'tv' ? d.original_name : d.original_title;
  let titleUk = uaReleaseTitle || (kind === 'tv' ? d.name : d.title);
  let titleTranslated = false;
  // No official Ukrainian release title and no TMDb-supplied uk translation
  // (titleUk just falls back to the original) — try machine-translating the
  // title itself, shown as "Переклад (Оригінал)" so it's clearly a guess.
  if (!uaReleaseTitle && titleEn && (!titleUk || titleUk.trim().toLowerCase() === titleEn.trim().toLowerCase())) {
    const translated = await translateToUk(titleEn);
    if (translated && translated.trim().toLowerCase() !== titleEn.trim().toLowerCase()) {
      titleUk = `${translated} (${titleEn})`;
      titleTranslated = true;
    }
  }
  const yearStr = (kind === 'tv' ? d.first_air_date : d.release_date) || '';
  const year = yearStr ? parseInt(yearStr.slice(0, 4), 10) : null;
  const { genre, group } = mapGenre(d.genres ? d.genres.map(g => g.id) : []);
  // uk-UA response already localizes country names when TMDb has a
  // translation on file; dEn (fetched for a missing trailer/overview
  // anyway, see above) is just the fallback when the uk-UA response has
  // no production_countries at all.
  const countryNames = (d.production_countries || (dEn && dEn.production_countries) || []).map(c => c.name).filter(Boolean);
  const country = countryNames.length ? countryNames.join(', ') : undefined;
  let castRaw = ((d.credits && d.credits.cast) || []).slice(0, 5).map(c => ({ id: c.id, name: c.name }));
  if (!castRaw.length && dEn) castRaw = ((dEn.credits && dEn.credits.cast) || []).slice(0, 5).map(c => ({ id: c.id, name: c.name }));
  const [cast, omdb] = await Promise.all([
    resolveLatinCastNames(castRaw),
    fetchOmdbData(titleEn, titleUk, year, kind),
  ]);
  const criticScore = extractCriticScore(omdb);
  // Both sources merged, not either/or — Wikidata for the categories, OMDb
  // for the authoritative count, padding any ceremony Wikidata only
  // partially detailed (see mergeAwardSources() in src/logic.js).
  const wikidataAwards = omdb ? await fetchWikidataAwardCategories(omdb.imdbID) : null;
  const mergedAwards = mergeAwardSources(
    wikidataAwards,
    omdb ? parseOmdbAwardsSummary(omdb.Awards) : null
  );
  // Language rule: the category half must read in Ukrainian. Whatever
  // Wikidata happened to return goes through the check-then-translate rule
  // (ensureUkrainian(), src/logic.js) rather than a list of known strings.
  const [awardsWon, awardsNominated] = await Promise.all([
    localizeAwardCategories(mergedAwards.won, translateToUk),
    localizeAwardCategories(mergedAwards.nominated, translateToUk),
  ]);
  return {
    id: slugify(titleEn, titleUk, year),
    canonical_title_uk: titleUk || titleEn || 'Без назви',
    canonical_title_en: titleEn || undefined,
    year: year || undefined,
    type: kind === 'tv' ? 'серіал' : 'фільм',
    genre, genre_group: group,
    country,
    rating: d.vote_average ? `TMDb ${d.vote_average.toFixed(1)}` : undefined,
    critic_score: criticScore,
    description_uk: overview,
    _overviewTranslated: overviewTranslated, // internal flag, not saved to Firebase
    _titleTranslated: titleTranslated, // internal flag, not saved to Firebase
    poster_url: d.poster_path ? (TMDB_IMG + d.poster_path) : undefined,
    trailer_url: trailer ? `https://www.youtube.com/watch?v=${trailer.key}` : undefined,
    cast,
    awards_won: awardsWon.length ? awardsWon : undefined,
    awards_nominated: awardsNominated.length ? awardsNominated : undefined,
  };
}

// Crop the image down to just the region where text was actually found,
// trimming empty space above/below (and the sides). Returns null if we
// can't get a useful bounding box (e.g. nothing recognized, or the box is
// basically the whole image already — nothing to gain from cropping).
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
async function cropToTextRegion(file, words) {
  const good = (words || []).filter(w => w.confidence > 35 && (w.text || '').trim());
  if (!good.length) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const w of good) {
    const b = w.bbox;
    minX = Math.min(minX, b.x0); minY = Math.min(minY, b.y0);
    maxX = Math.max(maxX, b.x1); maxY = Math.max(maxY, b.y1);
  }
  const img = await loadImageFromFile(file);
  // if the text already spans almost the whole image, cropping won't help
  if ((maxY - minY) > img.height * 0.9) return null;
  const padY = Math.round((maxY - minY) * 0.2) + 14;
  const padX = Math.round((maxX - minX) * 0.1) + 14;
  const cropX = Math.max(0, minX - padX);
  const cropY = Math.max(0, minY - padY);
  const cropW = Math.min(img.width - cropX, (maxX - minX) + padX * 2);
  const cropH = Math.min(img.height - cropY, (maxY - minY) + padY * 2);
  if (cropW < 20 || cropH < 20) return null;
  const canvas = document.createElement('canvas');
  canvas.width = cropW; canvas.height = cropH;
  canvas.getContext('2d').drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
  return new Promise(resolve => canvas.toBlob(blob => resolve(blob), 'image/png'));
}

// Titles are often wrapped in quotes inside captions/comments — «Назва»,
// "Назва", 'Назва', ‘Назва’, or with the Ukrainian apostrophe-style marks ʼ —
// or introduced by a trigger word like "фільм:", "серіал", "movie", "кино" etc,
// in Ukrainian/Russian/English. We scan the WHOLE text (not just the first
// line), pull out anything that looks like a title from several patterns,
// then run the junk-stripping pass more than once (edge punctuation can
// reveal more junk once the outer layer is peeled off) so only
// plausible movie-name-shaped strings remain.
// TITLE_TRIGGER_WORDS, UI_JUNK_PHRASES, isJunkLine(), cleanCandidate(),
// isPlausibleTitle(), extractTitleCandidates() now live in src/logic.js (loaded before this file).

async function runSearch(title, year) {
  const resultsEl = addBox.querySelector('#addResults');
  resultsEl.innerHTML = '<div class="add-hint">Шукаю…</div>';
  try {
    const results = await tmdbSearch(title, year);
    if (!results.length) {
      resultsEl.innerHTML = '<div class="add-hint">Нічого не знайдено. Спробуй іншу назву.</div>';
      return;
    }
    resultsEl.innerHTML = '<div class="candidate-list"></div>';
    const list = resultsEl.querySelector('.candidate-list');
    results.forEach(r => {
      const t = r.media_type === 'tv' ? r.name : r.title;
      const y = ((r.media_type === 'tv' ? r.first_air_date : r.release_date) || '').slice(0, 4);
      const poster = r.poster_path ? TMDB_IMG + r.poster_path : '';
      const div = document.createElement('div');
      div.className = 'candidate-item';
      div.innerHTML = `${poster ? `<img src="${poster}">` : '<div class="candidate-noposter"></div>'}
        <div><div class="candidate-title">${t}</div><div class="candidate-year">${y || '—'} · ${r.media_type === 'tv' ? 'серіал' : 'фільм'}</div></div>`;
      div.addEventListener('click', () => showConfirm(r.id, r.media_type));
      list.appendChild(div);
    });
  } catch (err) {
    resultsEl.innerHTML = '<div class="add-hint">Помилка запиту до TMDb. Перевір ключ або спробуй пізніше.</div>';
  }
}

// ---------- "recommended by" field: dropdown of already-used names + "add new" ----------
function getKnownRecommenders() {
  const set = new Set();
  MOVIES.forEach(m => { if (m.recommended_by) set.add(m.recommended_by); });
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'uk'));
}
function recBySelectHtml(prefill) {
  const known = getKnownRecommenders();
  const pre = (prefill != null ? prefill : recommenderPrefill) || '';
  const preIsKnown = pre && known.includes(pre);
  const newSelected = !!pre && !preIsKnown;
  let html = `<select id="cfRecBySelect">`;
  html += `<option value="" ${!pre ? 'selected' : ''}>Без імені</option>`;
  known.forEach(name => {
    html += `<option value="${esc(name)}" ${name === pre ? 'selected' : ''}>${esc(name)}</option>`;
  });
  html += `<option value="__new__" ${newSelected ? 'selected' : ''}>+ Додати нове ім'я…</option>`;
  html += `</select>`;
  html += `<input id="cfRecByNew" type="text" placeholder="Нове ім'я" value="${newSelected ? esc(pre) : ''}" style="margin-top:8px${newSelected ? '' : ';display:none'}">`;
  return html;
}
function wireRecBySelect(root) {
  const sel = root.querySelector('#cfRecBySelect');
  const newInput = root.querySelector('#cfRecByNew');
  sel.addEventListener('change', () => {
    if (sel.value === '__new__') { newInput.style.display = ''; newInput.focus(); }
    else { newInput.style.display = 'none'; newInput.value = ''; }
  });
}
function readRecBy(root) {
  const sel = root.querySelector('#cfRecBySelect');
  if (sel.value === '__new__') return root.querySelector('#cfRecByNew').value.trim();
  return sel.value;
}

      awards_nominated: awardsNom.length ? awardsNom : undefined,
      recommended_by: recBy || undefined,
    };

/* ---------- batch (multi-title) search ---------- */
// parseBatchLine() now lives in src/logic.js (loaded before this file).

async function runBatchSearch(lines, recommendedBy) {
  const resultsEl = addBox.querySelector('#addResults');
  resultsEl.innerHTML = '<div class="add-hint">Шукаю всі назви…</div>';
  const rows = await Promise.all(lines.map(async (line, i) => {
    const { title, year } = parseBatchLine(line);
    try {
      const results = await tmdbSearch(title, year);
      return { line, title, year, results, chosen: 0 };
    } catch (err) {
      return { line, title, year, results: [], chosen: 0, error: true };
    }
  }));
  renderBatchRows(rows, recommendedBy);
}

function renderBatchRows(rows, recommendedBy) {
  const resultsEl = addBox.querySelector('#addResults');
  resultsEl.innerHTML = `
    <div class="batch-list"></div>
    <div class="modal-actions"><button class="btn on-watched" id="batchSaveBtn">Зберегти позначені</button></div>`;
  const listEl = resultsEl.querySelector('.batch-list');
  rows.forEach((row, i) => {
    const r = row.results[row.chosen];
    const t = r ? (r.media_type === 'tv' ? r.name : r.title) : null;
    const y = r ? ((r.media_type === 'tv' ? r.first_air_date : r.release_date) || '').slice(0, 4) : '';
    const poster = r && r.poster_path ? TMDB_IMG + r.poster_path : '';
    // Duplicate check against the already-saved catalog, using the search
    // result's titles/year (no need to fetch full details just for this).
    const dup = r ? findDuplicateMovie(MOVIES, t, r.media_type === 'tv' ? r.original_name : r.original_title, y) : null;
    row.dup = !!dup;
    const div = document.createElement('div');
    div.className = 'batch-row';
    div.innerHTML = `
      <input type="checkbox" class="batch-check" ${r && !dup ? 'checked' : ''} ${r ? '' : 'disabled'} ${dup ? 'disabled' : ''}>
      ${poster ? `<img src="${poster}">` : '<div class="candidate-noposter"></div>'}
      <div class="batch-info">
        <div class="candidate-title">${row.line}</div>
        ${r
          ? `<select class="batch-alt">${row.results.map((res, ri) => {
              const rt = res.media_type === 'tv' ? res.name : res.title;
              const ry = ((res.media_type === 'tv' ? res.first_air_date : res.release_date) || '').slice(0, 4);
              return `<option value="${ri}" ${ri===row.chosen?'selected':''}>${rt} (${ry || '—'}, ${res.media_type === 'tv' ? 'серіал' : 'фільм'})</option>`;
            }).join('')}</select>`
          : `<div class="warn-note">${row.error ? 'Помилка запиту' : 'Нічого не знайдено'}</div>`}
        ${dup ? `<div class="warn-note">Такий фільм уже є у списку: «${esc(dup.canonical_title_uk)}»${dup.year ? ` (${dup.year})` : ''}.</div>` : ''}
      </div>`;
    if (r) {
      div.querySelector('.batch-alt').addEventListener('change', e => {
        row.chosen = parseInt(e.target.value, 10);
        renderBatchRows(rows, recommendedBy);
      });
    }
    listEl.appendChild(div);
  });
  resultsEl.querySelector('#batchSaveBtn').addEventListener('click', async () => {
    const btn = resultsEl.querySelector('#batchSaveBtn');
    btn.disabled = true;
    btn.textContent = 'Зберігаю…';
    const checks = listEl.querySelectorAll('.batch-check');
    let saved = 0, dupSkipped = 0, otherSkipped = 0;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const r = row.results[row.chosen];
      if (row.dup) { dupSkipped++; continue; }
      if (!r || !checks[i].checked) { otherSkipped++; continue; }
      try {
        const movie = await tmdbDetails(r.id, r.media_type);
        if (findDuplicateMovie(MOVIES, movie.canonical_title_uk, movie.canonical_title_en, movie.year)) { dupSkipped++; continue; }
        delete movie._overviewTranslated;
        delete movie._titleTranslated;
        if (recommendedBy) movie.recommended_by = recommendedBy;
        Object.keys(movie).forEach(k => movie[k] === undefined && delete movie[k]);
        await moviesRef.child(movie.id).set(movie);
        saved++;
      } catch (err) { otherSkipped++; }
    }
    const skipped = dupSkipped + otherSkipped;
    const skipDetail = dupSkipped ? ` (дублікатів: ${dupSkipped}${otherSkipped ? `, інших: ${otherSkipped}` : ''})` : '';
    btn.textContent = `Готово: збережено ${saved}, пропущено ${skipped}${skipDetail}`;
    if (saved > 0 && skipped === 0) toast('success', `Збережено ${saved} ${saved === 1 ? 'фільм' : 'фільмів'}`);
    else if (saved > 0) toast('success', `Збережено ${saved}, пропущено ${skipped}${skipDetail}`);
    else toast('error', `Нічого не збережено (пропущено ${skipped}${skipDetail})`);
  });
}

function openAddModal() { addModalHome(); addOverlay.classList.add('open'); lockScroll(); }
function closeAddModal() { addOverlay.classList.remove('open'); unlockScroll(); }
addBtn.addEventListener('click', openAddModal);
addOverlay.addEventListener('click', e => { if (e.target === addOverlay) closeAddModal(); });
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</body>
