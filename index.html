<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeenIt</title>
<style>
  :root {
    /* The brand palette, and nothing else — see BRAND.md. Names match PALETTE
       in brand/virazh.js so the stylesheet and the mark cannot end up
       describing different reds. */
    --blood: #8E0000;
    --flash: #C21414;
    --ink: #0E0E10;
    --paper: #F2F3F6;
    --graphite: #2A2C31;
    --ash: #8A8D93;
    --dust: #D5D7DB;

    /* Roles. Every one of these resolves to a palette colour or to a step on
       the ink -> graphite ramp; no new hues enter here. */
    --bg: var(--ink);
    --surface: #17181D;
    --surface2: var(--graphite);
    --border: #24262C;
    --text: var(--paper);
    --text-muted: var(--ash);
    --grad: linear-gradient(135deg, var(--blood), var(--flash));
    --like: var(--flash);
    --danger: var(--flash);
    --ok: var(--paper);
    /* Ratings and won awards were gold. The book has no gold, so the win/
       nominated distinction is carried by brightness instead of by hue. */
    --accent: var(--dust);
    --accent2: var(--blood);
    --accent3: var(--flash);
    --radius: 14px;
    --control-h: 44px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  /* Scroll lock while a modal/overlay is open — see lockScroll()/unlockScroll()
     in app.js. Uses position:fixed (not just overflow:hidden) so background
     content can't be dragged/scrolled on iOS Safari either. */
  body.scroll-locked {
    position: fixed;
    left: 0; right: 0;
    overflow: hidden;
  }
  header { padding: 28px 24px 16px; max-width: 1280px; margin: 0 auto; }
  header h1 {
    margin: 0 0 4px; font-size: 24px; display: flex; align-items: center; gap: 10px;
    letter-spacing: .04em; font-weight: 700;
  }
  /* Both badges hold the mark itself, injected at build time from
     brand/virazh.js. The header takes the flat drawing because 30 px is far
     under the 56 px the layered one needs; the login screen takes the full
     stack. See BRAND.md. */
  .h-badge { width: 30px; height: 30px; flex-shrink: 0; }
  .h-badge svg, .brand-badge svg { width: 100%; height: 100%; display: block; }
  .h-badge, .brand-badge { display: flex; align-items: center; justify-content: center; }
  /* The wordmark, and only the wordmark: the brand's heavy grotesque, with
     "It" in blood. Everything else on the page stays on the system stack — a
     display face is a logo, not a UI font. The fallback chain is heavy too,
     so a blocked or slow Google Fonts leaves a wordmark, not body text. */
  .wordmark {
    font-family: 'Archivo Black', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    /* Both set explicitly: the login h1 carries uppercase + .14em tracking,
       and the wordmark must inherit neither. */
    text-transform: none;
    letter-spacing: -.035em;
    font-size: 1.3em;
    line-height: 1.1;
    color: var(--text);
  }
  /* Blood on the second half — the one place the accent appears in type. */
  .wordmark em { font-style: normal; color: var(--blood); }
  header h1 .wordmark { font-size: 1.25em; }

  header .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .field-clear-wrap { position: relative; flex: 1; min-width: 220px; }
  .field-clear-wrap #search { width: 100%; box-sizing: border-box; }
  .field-clear-btn {
    position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: var(--surface2); color: var(--text-muted);
    display: none; align-items: center; justify-content: center;
    cursor: pointer; font-size: 15px; line-height: 1; padding: 0;
  }
  .field-clear-wrap.has-value .field-clear-btn { display: flex; }
  .field-clear-btn:active { background: var(--border); }
  #search {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 10px 36px 10px 14px; border-radius: 10px;
    font-size: 14px; outline: none; height: var(--control-h); width: 100%;
  }
  #search:focus { border-color: var(--accent2); }
  select {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 10px;
    font-size: 13px; outline: none; cursor: pointer; height: var(--control-h);
  }
  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; height: var(--control-h); }
  .view-toggle button {
    background: var(--surface); border: none; color: var(--text-muted);
    padding: 9px 12px; cursor: pointer; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center; flex: 1;
  }
  .view-toggle button.active { background: var(--grad); color: var(--paper); }
  .view-toggle button:not(:last-child) { border-right: 1px solid var(--border); }

  /* ---------- search row: circular "+NEW" add button, Search button, search field ---------- */
  .search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .add-fab {
    flex-shrink: 0; width: var(--control-h); height: var(--control-h); border-radius: 50%;
    border: none; background: var(--grad); color: var(--paper); font-weight: 800;
    font-size: 10.5px; letter-spacing: .03em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px -6px rgba(142,0,0,.65), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 5px rgba(0,0,0,.2);
    transition: transform .15s;
  }
  .add-fab:active { transform: scale(.94); }
  /* Same size and shape as .add-fab so the header row stays one rhythm, but
     deliberately quiet: destructive controls should be reachable, not the
     brightest thing on screen. It only turns red once the mode is ON. */
  .del-fab {
    flex-shrink: 0; width: var(--control-h); height: var(--control-h); border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform .15s, color .15s, border-color .15s, background .15s;
  }
  .del-fab:active { transform: scale(.94); }
  .del-fab[aria-pressed="true"] {
    color: var(--danger); border-color: var(--danger); background: rgba(194,20,20,.16);
  }
  @media (hover: hover) { .del-fab:hover { color: var(--danger); border-color: var(--danger); } }

  /* Sits between the read-only facts and the editable description, so the
     trailer can be checked while deciding whether this is the right film. */
  .cf-trailer { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 10px; }

  .delete-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 12px; padding: 10px 12px; border-radius: 12px;
    border: 1px solid rgba(194,20,20,.5); background: rgba(194,20,20,.12);
  }
  .delete-bar[hidden] { display: none; }
  .delete-bar-count { flex: 1; min-width: 0; font-size: 13px; color: var(--text); }
  .delete-bar-btn {
    height: var(--control-h); border-radius: 10px; padding: 0 14px; font-size: 13px;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  }
  .delete-bar-btn--go { border-color: var(--danger); background: var(--danger); color: var(--ink); font-weight: 700; }
  /* A disabled destructive button must not still look armed. */
  .delete-bar-btn--go:disabled { opacity: .45; cursor: not-allowed; background: var(--surface2); color: var(--muted); border-color: var(--border); }

  /* In delete mode a card is a checkbox, so the whole card reacts — a small
     tap target on a phone would make multi-select painful. */
  body.delete-mode .card { cursor: pointer; }
  body.delete-mode .card-toggles { opacity: .25; pointer-events: none; }
  .card.is-selected { outline: 2px solid var(--danger); outline-offset: -2px; }
  .card-select-mark {
    position: absolute; top: 8px; left: 8px; z-index: 3;
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.75); background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .card.is-selected .card-select-mark { background: var(--danger); border-color: var(--danger); color: var(--ink); }
  .search-btn {
    flex-shrink: 0; height: var(--control-h); border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); padding: 0 14px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .search-btn:active { border-color: var(--accent2); }
  @media (hover: hover) { .search-btn:hover { border-color: var(--accent2); } }
  .search-row .field-clear-wrap { flex: 1; min-width: 0; }
  .controls-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .tabs { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .tab {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .tab.active { background: var(--grad); color: var(--paper); border-color: transparent; font-weight: 600; }
  .tab .n { opacity: .7; font-size: 11px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    padding: 5px 11px; border-radius: 999px; font-size: 12px; cursor: pointer;
    flex: 1 1 auto; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:focus { outline: none; }
  /* Touch devices have no real hover — but WebKit applies :hover after a
     tap anyway and doesn't clear it until something else is tapped, so an
     unguarded :hover here looked identical to .active (same accent2
     border) and a deselected chip appeared stuck highlighted. Gating
     behind (hover: hover) means only an actual pointing device gets it. */
  @media (hover: hover) {
    .chip:hover { border-color: var(--accent2); color: var(--text); }
  }
  .chip.active { background: var(--surface2); color: var(--accent2); border-color: var(--accent2); font-weight: 600; }

  /* Extra room at the bottom so the last row of cards can be scrolled up
     away from the very edge of the screen (see CONVENTIONS.md). */
  main { max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; padding-bottom: 38vh; }
  .genre-section { margin-top: 32px; }
  .genre-section h2 {
    font-size: 19px; display: flex; align-items: baseline; gap: 10px;
    border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 0 0 16px;
  }
  .genre-section h2 .count { color: var(--text-muted); font-size: 13px; font-weight: 400; }

  /* GRID VIEWS */
  .grid { display: grid; gap: 16px; }
  body[data-view="grid-s"] .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  body[data-view="grid-m"] .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  body[data-view="grid-l"] .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; cursor: pointer;
    transition: transform .15s, border-color .15s, opacity .2s;
    display: flex; flex-direction: column; position: relative;
  }
  @media (hover: hover) {
    .card:hover { transform: translateY(-2px); border-color: var(--accent2); }
  }

  .poster { position: relative; aspect-ratio: 2/3; background: var(--surface2); overflow: hidden; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .25s; }
  .poster.fallback { display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, hsl(var(--hue) 45% 22%), hsl(calc(var(--hue) + 40) 40% 14%)); }
  .poster-initial { font-size: 42px; font-weight: 700; color: rgba(255,255,255,.35); }

  /* A vertical stack, not a row (owner-reported): on a three-column phone
     grid the poster is ~110px wide, and eye+heart side by side ran into
     the trophy at the opposite corner, clipping both. Stacked in the
     top-right column they coexist with the trophy at any card width. */
  .card-toggles {
    position: absolute; top: 8px; right: 8px; display: flex;
    flex-direction: column; gap: 6px; z-index: 2; align-items: flex-end;
  }
  /* Quick-glance award-win count on the poster itself (posterAwardBadgeHtml()
     in app.js) — visible while scrolling/searching the grid, without
     reading the badges row under the title. Mirrors .tgl's look, opposite
     corner. Redundant with the modal's full award section, so grid-only. */
  /* The ONLY award UI on a card (owner's call — the under-title badge row
     showed a second trophy with a different tally and the pair read as a
     contradiction). Wins only; tap opens the per-ceremony breakdown.
     Sized and styled to match the watch/like toggles it shares the poster
     with, so the top row reads as one family of controls. */
  .poster-award-badge {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    display: flex; align-items: center; gap: 4px; height: 32px;
    background: rgba(14,14,16,.74); backdrop-filter: blur(4px);
    color: var(--accent); font-size: 12.5px; font-weight: 700;
    padding: 0 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(213,215,219,.3);
  }
  .poster-award-badge svg { width: 13px; height: 13px; flex-shrink: 0; }
  .poster-award-badge:active { transform: scale(.95); }
  /* Exactly one of the two placements is visible per view. The corner sits
     on the poster in grids; the inline copy joins the card-body row right
     after the critic score in the list view, where an absolutely-
     positioned corner collided with the row layout (owner-reported). */
  .poster-award-badge--inline { display: none; }
  body[data-view="list"] .poster-award-badge--corner { display: none; }
  body[data-view="list"] .poster-award-badge--inline {
    display: inline-flex; position: static; height: 24px;
    font-size: 11px; padding: 0 9px; order: 5; margin: 0;
  }
  .tgl {
    width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(14,14,16,.74); color: var(--dust); font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); transition: all .15s;
  }
  @media (hover: hover) {
    .tgl:hover { transform: scale(1.12); color: #fff; }
  }
  .tgl.on-watched { background: var(--grad); color: var(--paper); }
  .tgl.on-liked { background: var(--like); color: #fff; }

  .card.is-watched { opacity: .55; }
  .card.is-watched .poster img { filter: grayscale(1) brightness(.7); }
  .card.is-watched .poster.fallback { filter: grayscale(1) brightness(.7); }

  .card-body { display: flex; flex-direction: column; padding: 10px 12px 12px; flex: 1; }
  /* Meta row (type/year vs. IMDb/TMDb rating) sits above the title, per the
     grid-card layout: meta row -> title -> awards (one line) -> critic %
     pinned to the card's bottom-right corner (see .critic-corner below). */
  /* flex-wrap: nowrap (the default) let the type/year text and the rating
     badge overflow/shrink into each other on a narrow card (grid-s) instead
     of the badge cleanly dropping to its own line underneath — wrap fixes
     that; space-between still puts the badge on the right whenever both
     fit on one line. */
  .card-meta-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px; }
  .card-meta-row .year { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
  .card-title-row { margin-top: 4px; }
  .card-title-row h3 { margin: 0; font-size: 14px; line-height: 1.3; overflow-wrap: break-word; min-width: 0; }
  .badges { margin-top: 7px; }
  /* Named per-ceremony pills (shown by default, grid-m/grid-l) wrap onto
     more lines rather than forcing the card wider or clipping — see
     .badges-compact below for the narrow-card/list fallback. */
  .badges-full { display: flex; flex-wrap: wrap; gap: 5px; }
  .badges-compact {
    display: none; align-items: center; gap: 4px;
    color: var(--accent); font-size: 11px; font-weight: 700;
  }
  .badges-compact svg { width: 12px; height: 12px; flex-shrink: 0; }
  /* Always bottom-right of the card: pushed down by margin-top:auto in the
     column-flex .card-body, then right-aligned within that row. */
  .critic-corner { margin-top: auto; align-self: flex-end; padding-top: 6px; }
  .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; background: var(--surface2); color: var(--text-muted); }
  .badge--rating { color: var(--accent); }
  /* Critic score: color comes from the --critic-color custom property, set
     per-card in JS via criticScoreColor() (src/logic.js) — a continuous
     red -> yellow -> green sweep, not a handful of fixed tiers. Text +
     border carry the color; background stays the plain badge surface
     (avoids color-mix(), which isn't safe to rely on everywhere). */
  .badge--critic {
    color: var(--critic-color); border: 1px solid var(--critic-color);
    background: var(--surface2); font-weight: 700; cursor: pointer;
  }
  .badge--award-won, .badge--award-nom {
    display: inline-flex; align-items: center; gap: 3px; font-weight: 600;
  }
  .award-badge { cursor: pointer; }
  .award-badge, .critic-badge { -webkit-tap-highlight-color: transparent; }
  .badge--award-won svg, .badge--award-nom svg { width: 13px; height: 13px; flex-shrink: 0; }
  .badge--award-won { color: var(--accent); border: 1px solid rgba(213,215,219,.4); background: rgba(213,215,219,.12); }
  .badge--award-nom { color: var(--ash); border: 1px solid rgba(138,141,147,.4); background: rgba(138,141,147,.12); }
  body[data-view="grid-s"] .card-body { padding: 8px 9px 9px; }
  body[data-view="grid-s"] .card-title-row h3 { font-size: 12px; }
  /* A grid-s card is too narrow for named pills ("Golden Globe" alone can
     be wider than the whole card) — fall back to the compact trophy+count
     summary there, same as list view below. */
  body[data-view="grid-s"] .badges-full { display: none; }
  body[data-view="grid-s"] .badges-compact { display: flex; }

  /* LIST VIEW */
  body[data-view="list"] .grid { display: flex; flex-direction: column; gap: 8px; }
  body[data-view="list"] .card { flex-direction: row; align-items: center; }
  body[data-view="list"] .poster { width: 52px; min-width: 52px; aspect-ratio: 2/3; border-radius: 8px; margin: 8px; }
  body[data-view="list"] .poster-initial { font-size: 18px; }
  /* The grid-card layout (meta row -> title -> awards -> corner-pinned
     critic %) is a vertical stack; in the list view all of those become
     plain siblings in one wrapping row instead, so give each an explicit
     `order` matching the layout's intent (title first, then the rest).
     flex-direction MUST be repeated here (not just display:flex) — CSS
     resolves each property independently regardless of selector, and
     .card-body's base rule (grid layout) sets flex-direction: column, so
     leaving it unset here would silently inherit that column stacking. */
  body[data-view="list"] .card-body {
    display: flex; flex-direction: row; align-items: center; gap: 14px; padding: 8px 12px; flex-wrap: wrap;
  }
  /* Same reasoning as grid-s: a 52px-thumbnail list row has even less room
     for named pills than a grid-s card. */
  body[data-view="list"] .badges-full { display: none; }
  body[data-view="list"] .badges-compact { display: flex; }
  body[data-view="list"] .card-meta-row { order: 2; flex: 0 0 auto; }
  body[data-view="list"] .card-title-row { flex: 1 1 180px; min-width: 180px; order: 1; margin-top: 0; }
  body[data-view="list"] .badges { margin-top: 0; order: 3; }
  body[data-view="list"] .critic-corner { margin-top: 0; align-self: auto; padding-top: 0; order: 4; }
  body[data-view="list"] .card-toggles { position: static; flex-direction: row; margin-right: 12px; order: 5; margin-left: auto; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50;
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; max-width: 720px; width: 100%;
    display: flex; overflow: hidden; position: relative;
  }
  .modal-poster { width: 240px; min-width: 240px; background: var(--surface2); }
  .modal-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-poster.fallback { display: flex; align-items: center; justify-content: center; min-height: 360px;
    background: linear-gradient(135deg, hsl(var(--hue) 45% 22%), hsl(calc(var(--hue) + 40) 40% 14%)); }
  /* Takes the poster's slot when there's a trailer to autoplay. Sized by its
     own 16:9 aspect ratio rather than stretched to the column's height like
     the poster — a flex item stretches by default, which would either crush
     the video or force it wider than its column. align-self opts it out. */
  .modal-trailer { width: 240px; min-width: 240px; align-self: flex-start; background: #000; }
  .modal-trailer iframe { width: 100%; aspect-ratio: 16 / 9; display: block; border: 0; }

  /* Marks where the next batch of cards loads in. Occupies a little height so
     it can actually cross the viewport and trigger — a zero-height element
     inside a collapsed layout may never intersect. */
  .render-sentinel { height: 1px; margin-top: 8px; }

  /* The poster/trailer column, which "Де подивитись" shares. Its children set
     their own width, so the column itself only needs to stop stretching. */
  .modal-side { display: flex; flex-direction: column; align-self: flex-start; }
  .modal-providers { width: 240px; padding: 12px 14px 14px; }
  .modal-providers .lbl {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-muted); margin-bottom: 8px;
  }
  .prov-row { display: flex; flex-direction: column; gap: 6px; }
  .prov {
    display: flex; align-items: center; gap: 9px; text-decoration: none;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 9px; color: var(--text);
  }
  .prov--owned { border-color: var(--accent2); }
  @media (hover: hover) { a.prov:hover { border-color: var(--accent2); } }
  .prov-logo { width: 26px; height: 26px; border-radius: 6px; object-fit: cover; flex: none; background: #000; }
  .prov-logo--none {
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--text-muted); background: var(--surface);
  }

  /* ---------- toast (save success/error banner) ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px);
    max-width: calc(100% - 32px); z-index: 1000;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 12px 18px; border-radius: 12px; font-size: 14px;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast--success { border-color: var(--ok); }
  .toast--error { border-color: var(--like); color: #F6CFCF; }

  /* ---------- info popover (award/critic-score explanations) ----------

  #infoPopover {
    position: fixed; max-width: min(280px, calc(100% - 24px));

    padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.45;

    .prov-row { flex-direction: row; flex-wrap: wrap; }

    header { padding: 18px 16px 12px; }

<script>
/* ---------- award ceremonies: what we recognise and how we name it ----------
 * Data only — no logic, no DOM, no network. Kept apart from logic.js so the
 * values a person actually edits (names, wording, mappings) are not buried
 * in the code that consumes them.
 *
 * Loaded two ways, which is why it exports through a single namespace
 * object rather than bare consts: the browser build concatenates every
 * src/*.js into one script (scripts/build.js), where `AWARDS_DATA` is simply in
 * scope for logic.js; Node (tests, scripts/) requires this file instead.
 * See the matching `typeof module` guard at the bottom.
 */
/* ---------- awards: recognize known ceremonies for icon + description ----------
 * Award fields are free-text ("Оскар — найкращий фільм"), so matching is by
 * regex against the whole string rather than an exact-name lookup — lets
 * people type the category after an em-dash without breaking recognition.
 * Unrecognized text (a festival we don't know) still displays fine, just
 * without a dedicated icon/description (see app.js AWARD_ICONS).
 */

const AWARDS_DATA = {
  AWARD_INFO: [
  { key: 'oscar', match: /оскар|academy award|\boscars?\b/i, name: 'Oscar',
    description: 'Головна премія Американської кіноакадемії.' },
  { key: 'golden-globe', match: /золот(ий|ого|ой) глобус|golden globes?\b/i, name: 'Golden Globe',
    description: 'Премія Голлівудської асоціації іноземної преси за кіно й телебачення.' },
  { key: 'bafta', match: /bafta|бафта/i, name: 'BAFTA',
    description: 'Премія Британської академії кіно та телевізійного мистецтва.' },
  { key: 'cannes', match: /канн|\bcannes\b|palme d.?or|золот(а|ої) пальмов(а|ої) гілк/i, name: 'Cannes',
    description: 'Нагорода Каннського кінофестивалю.' },
  { key: 'venice', match: /венеці|\bvenice\b|золот(ий|ого) ле[вя]|golden lion/i, name: 'Venice',
    description: 'Нагорода Венеційського кінофестивалю.' },
  { key: 'berlinale', match: /берлінале|berlinale|золот(ий|ого) ведмед|golden bear/i, name: 'Berlinale',
    description: 'Нагорода Берлінського кінофестивалю.' },
  { key: 'emmy', match: /еммі|emmys?\b/i, name: 'Emmy',
    description: 'Головна телевізійна премія США.' },
  { key: 'sag', match: /\bsag\b|гільді[її]\s+(?:кіно)?акторів|screen actors guild/i, name: 'SAG',
    description: 'Премія Гільдії кіноакторів США — її вручають самі актори.' },
  { key: 'saturn', match: /\bsaturn\b|прем[іi]я «сатурн»/i, name: 'Saturn',
    description: 'Премія за фантастику, фентезі та фільми жахів.' },

  /* Added from what the catalog ACTUALLY holds, not from a general list of
   * famous awards. Before this, one ceremony arriving in several spellings
   * became several keys: the European Film Awards alone were split six ways
   * — the English name plus four Ukrainian phrasings (including a
   * misspelling) — so forty awards sat in six separate piles with none of
   * them counted correctly. Every pattern below therefore matches BOTH the
   * English and the Ukrainian form.
   *
   * Recognition also gates display (majorAwardsOnly drops what is not
   * here), so this stays a list of ceremonies a person would recognise —
   * national academies, the international critics' bodies, the guilds —
   * and not every regional critics' circle Wikidata knows about. */
  { key: 'nbr', match: /national board of review(?: awards?)?|національн[а-яіїєґ]* ради кінокритик[а-яіїєґ]*/i, name: 'National Board of Review Award',
    description: 'Нагорода Національної ради кінокритиків США — одна з найстаріших у країні.' },
  { key: 'european-film', match: /european film(?: awards?)?|європейськ[а-яіїєґ]* кіноприз[а-яіїєґ]*|європейский кіноприз[а-яіїєґ]*/i, name: 'European Film Award',
    description: 'Головна кінопремія Європейської кіноакадемії.' },
  { key: 'cesar', match: /\bc[ée]sar\b|«?сезар»?/i, name: 'César',
    description: 'Головна кінопремія Франції.' },
  { key: 'goya', match: /\bgoya\b|«?гойя»?/i, name: 'Goya',
    description: 'Головна кінопремія Іспанії.' },
  { key: 'japan-academy', match: /japan academy(?: prize)?|японськ[а-яіїєґ]* кіноакадем[а-яіїєґ]*/i, name: 'Japan Academy Prize',
    description: 'Головна кінопремія Японії.' },
  { key: 'asian-film', match: /asian film awards?|азійськ[а-яіїєґ]* кінопремі[а-яіїєґ]*/i, name: 'Asian Film Award',
    description: 'Головна кінопремія Азії, заснована фестивалями Гонконгу, Пусана й Токіо.' },
  { key: 'critics-choice', match: /critics.? choice|вибір критик/i, name: "Critics' Choice Award",
    description: 'Премія Асоціації кінокритиків США та Канади.' },
  { key: 'sundance', match: /sundance|санденс/i, name: 'Sundance',
    description: 'Головна нагорода найбільшого фестивалю незалежного кіно США.' },
  { key: 'fipresci', match: /fipresci|фіпресі/i, name: 'FIPRESCI Prize',
    description: 'Приз Міжнародної федерації кінопреси, який вручають на великих фестивалях.' },
  // "Art Directors Guild" is a DIFFERENT body, and it appears in this very
  // catalog — hence the lookbehind rather than a bare "directors guild".
  { key: 'dga', match: /\bdga\b|(?<!art )directors guild(?: of america)?|гільді[а-яіїєґ]* режисер[а-яіїєґ]*/i, name: 'DGA Award',
    description: 'Премія Гільдії режисерів США — її вручають самі режисери.' },
  { key: 'pga', match: /\bpga\b|producers guild(?: of america)?|гільді[а-яіїєґ]* продюсер[а-яіїєґ]*/i, name: 'PGA Award',
    description: 'Премія Гільдії продюсерів США.' },
  { key: 'mtv', match: /mtv movie(?: awards?)?|кінонагород[а-яіїєґ]* mtv/i, name: 'MTV Movie Award',
    description: 'Глядацька кінопремія телеканалу MTV.' },
  { key: 'satellite', match: /satellite award|премія «?сателіт»?/i, name: 'Satellite Award',
    description: 'Премія Міжнародної академії преси.' },
],
};

if (typeof module !== 'undefined' && module.exports) {
  module.exports = AWARDS_DATA;
}
/* ---------- TMDb genre id -> Ukrainian genre + display group ----------

  // named after its own genre; the chips row wraps, so more of them costs
  // layout, not comprehension.
  28:  { genre: 'бойовик',            group: 'Бойовики' },
  10759:{ genre: 'бойовик',           group: 'Бойовики' },
  12:  { genre: 'пригоди',            group: 'Пригоди' },
  16:  { genre: 'анімація',           group: 'Мультфільми' },
  10762:{ genre: 'анімація',          group: 'Мультфільми' },   // TMDb "Kids"
  35:  { genre: 'комедія',            group: 'Комедії' },

/* ---------- where a person's marks live ----------
 * "Переглянуто" and "рекомендую" used to be GLOBAL nodes: kino/watched and
 * kino/liked, shared by every account. Anyone who logged in saw and could
 * change the same list, which is why the e2e suite had to stay read-only and
 * why "my own recommendations" could not exist as a feature at all.
 *
 * They now hang off the signed-in uid. kino/movies stays shared on purpose —
 * it is the film database, and the social features in the roadmap depend on
 * everyone recommending out of one catalog. What is personal is the marks.
 */
const MARK_LISTS = ['watched', 'liked'];

/**
 * The database path for one person's list.
 *
 * Returns null rather than a path when the uid is missing, and the caller
 * must treat that as "do not read or write". This is the dangerous case: a
 * blank uid interpolated into `kino/users/${uid}/watched` yields
 * `kino/users//watched`, which Firebase collapses to `kino/users/watched` —
 * a node SHARED by everyone, silently recreating the exact problem this
 * change exists to remove.

function userMarksPath(uid, list) {
  if (typeof uid !== 'string' || !uid.trim()) return null;
  if (!MARK_LISTS.includes(list)) return null;
  if (/[.$#[\]/]/.test(uid)) return null;   // characters Firebase forbids in a key

 *  browser never read each other's cached marks. */

  if (!MARK_LISTS.includes(list)) return null;
  return uid ? `seenit_${uid}_${list}` : null;

/**
 * Where one person's "services I already pay for" list lives.
 *

 * API since 2014 and Megogo's is a B2B partner programme, so there is nothing
 * to authenticate against — and nothing that could ever charge this person.
 * All the app does with this list is sort a service to the top of "Де
 * подивитись" and mark it "у вас є".

 * Same blank-uid guard as userMarksPath(), for the same reason.
 */
function userServicesPath(uid) {
  if (typeof uid !== 'string' || !uid.trim()) return null;
  if (/[.$#[\]/]/.test(uid)) return null;
  return `kino/users/${uid}/services`;
}

/**
 * The database path for one person's MOVIE CATALOG.
 *
 * The catalog itself is per-account now, not only the marks. It was shared
 * first, by design — but a person who registers and sees 111 of somebody
 * else's films has been given the wrong product: "мій список фільмів" is
 * the entire premise of the app. The same blank-uid guard as the marks
 * path, for the same reason: a collapsed path is a shared node.

/* ---------- the film database: one catalogue, addressed by TMDb id ----------
 *
 * Films moved to D1 and the person stayed on Firebase. What that changes here
 * is the KEY. The catalogue used to be a per-account copy, so a film could be
 * identified by its slug — a string derived from the title, unique only
 * within one person's copy. There is one catalogue now and a mark is
 * cross-cutting: "watched" is true of the film wherever it appears, on
 * anybody's shelf. Only the film's own identity can carry that, and that is
 * its TMDb id.
 *
 * The slug stays as the DISPLAY id — it is what the DOM and the URL use, and
 * it reads. But it is derived from a title somebody can edit, so nothing
 * durable is keyed on it any more.

const CATALOGUE_PAGE = 1000;

const MY_FILMS_NAME = 'Мої фільми';

/**
 * The key a mark is stored under, or null when the film cannot carry one.
 *
 * Null is not a failure to handle quietly: a film with no tmdb_id cannot be
 * marked, cannot join a collection and cannot be found again, because every
 * one of those is a reference to this id. A handful of such records exist
 * (scripts/backfill-tmdb-ids.js is what fixes them) and the UI says so rather
 * than dropping the tap on the floor.
 */
function markKey(movie) {
  const n = Number(movie && movie.tmdb_id);
  return Number.isInteger(n) && n > 0 ? String(n) : null;
}

function isMarked(set, movie) {
  const k = markKey(movie);
  return !!(k && set && set.has && set.has(k));

/**
 * One page of the catalogue, addressed by a CURSOR.
 *
 * Paged rather than fetched whole because 13,546 films is a response no
 * single request should hold, and because the grid can start drawing after
 * the first page instead of after the last.
 *
 * `after` is the last tmdb_id of the previous page, not a row offset. OFFSET
 * charges for every row it walks past and throws away, over a sort with no
 * index to ride — fourteen pages of that read ~190,000 rows per app-open and
 * put D1 at 72.8 million against a 5,000,000 daily limit. A cursor reads
 * exactly one page.

  return `${base}/pool/list?limit=${Number(limit)}&after=${Number(after) || 0}`;

/** One mark on one film. The list name is in the path, the film is the id. */
function markUrl(base, list, tmdbId) {
  if (!MARK_LISTS.includes(list)) return null;
  const n = Number(tmdbId);
  if (!Number.isInteger(n) || n <= 0) return null;
  return `${base}/library/marks/${list}/${n}`;
}

/** One film inside a collection I own. */
function collectionFilmUrl(base, collectionId, tmdbId) {
  const n = Number(tmdbId);
  if (!collectionId || !Number.isInteger(n) || n <= 0) return null;
  return `${base}/library/collections/${encodeURIComponent(collectionId)}/films/${n}`;

 * Where the catalogue is cached for an instant first paint.
 *
 * NOT scoped by account any more, and that is the point: there is one
 * catalogue, so two people on one browser would otherwise keep two identical
 * copies of 13,546 films. What stays per-account is everything that differs
 * between them — the marks (localMarksKey) and the shelf.
 */

  return 'seenit_catalogue';

function ratingNum(m) {
  const r = (m && m.rating) || '';

  return match ? parseFloat(match[1].replace(',', '.')) : -1;

// (0% = hue 0/red, 50% = hue 60/yellow, 100% = hue 120/green). Deliberately

// so the color shifts smoothly as the percentage changes instead of

  const h = Math.round(p * 1.2);

  // syntax — both are valid CSS, but the comma form renders correctly on
  // older WebKit-based views too, not just current desktop/mobile Chrome/Safari.
  return `hsl(${h}, 75%, 58%)`;

 * Rule (see CONVENTIONS.md): cast names are stored in Latin script only.
 * TMDb occasionally returns an actor's canonical `name` in their native

 * that, and pickLatinPersonName() picks the best Latin replacement from a
